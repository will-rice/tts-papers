<span id="S2.F2.pic1.1.2" class="ltx_p"><span id="S2.F2.pic1.1.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Speaker caption.<span id="S2.F2.pic1.1.2.1.1" class="ltx_text ltx_font_medium"> The speaker has a mid-range clear and articulate voice. His tone is upbeat, encouraging and authoritative delivered in a moderate pace. He is highly expressive, using significant vocal inflection and emphasis to underscore his points, creating a sense of conviction. His delivery is very confident and self-assured, with a steady rhythm and clear articulation that suggests he is in control of the subject matter.</span></span></span>
