<svg id="S1.p4.pic1" class="ltx_picture" height="595.71" overflow="visible" version="1.1" viewbox="0 0 676.77 595.71" width="676.77"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,595.71) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#FEF2F2;" fill="#FEF2F2" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.15 L 0 591.56 C 0 593.85 1.86 595.71 4.15 595.71 L 672.62 595.71 C 674.91 595.71 676.77 593.85 676.77 591.56 L 676.77 4.15 C 676.77 1.86 674.91 0 672.62 0 L 4.15 0 C 1.86 0 0 1.86 0 4.15 Z" /></g><g style="--ltx-fill-color:#FEF2F2;" fill="#FEF2F2" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.15 L 0 572.77 L 676.77 572.77 L 676.77 4.15 C 676.77 1.86 674.91 0 672.62 0 L 4.15 0 C 1.86 0 0 1.86 0 4.15 Z" /></g><g style="--ltx-fill-color:#FEF2F2;" fill="#FEF2F2" fill-opacity="1.0"><path style="stroke:none" d="M 0 572.77 L 0 591.56 C 0 593.85 1.86 595.71 4.15 595.71 L 672.62 595.71 C 674.91 595.71 676.77 593.85 676.77 591.56 L 676.77 572.77 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.62 579.4)"><foreignobject style="--ltx-fo-width:40.82em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="564.83"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S1.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:40.82em;">
<span id="S1.p4.pic1.1.1" class="ltx_p"><span id="S1.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#BB0819;">Key findings</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.62 539.43)"><foreignobject style="--ltx-fo-width:50.75em;--ltx-fo-height:1.63em;--ltx-fo-depth:38.2em;font-size:10pt;" height="551.07" overflow="visible" transform="matrix(1 0 0 -1 0 22.49)" width="702.24"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S1.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:50.75em;">
<span id="S1.I1" class="ltx_enumerate" style="--ltx-enum-leftmargin:1.5em;">
<span id="S1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="S1.I1.i1.1" class="ltx_text ltx_font_bold">1.</span></span> 
<span id="S1.I1.i1.p1" class="ltx_para">
<span id="S1.I1.i1.p1.1" class="ltx_p"><span id="S1.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">The potential gain for router is large</span><span id="S1.I1.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> (§</span><a href="#S3" title="3 Can Router Beat the Best Fixed Candidate? ‣ Route Anything: A Study of Model and Policy Routing for General-Purpose AI Systems" class="ltx_ref" style="font-size:90%;--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">3</span></a><span id="S1.I1.i1.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">). On 19,814 test inputs from 24 benchmarks, the per-input oracle beats the best fixed candidate per benchmark by 5.4 points, from 0.7 for speech generation to 18–19 for video generation and robot manipulation. The best candidate per capability type, even chosen in hindsight, closes only 8% of the gap.</span></span>
</span></span>
<span id="S1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="S1.I1.i2.1" class="ltx_text ltx_font_bold">2.</span></span> 
<span id="S1.I1.i2.p1" class="ltx_para">
<span id="S1.I1.i2.p1.1" class="ltx_p"><span id="S1.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Learned routers beat the best fixed candidate by 0.3 points, and by up to 2.1 points per output group</span><span id="S1.I1.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> (§</span><a href="#S4.SS1" title="4.1 One Router Across Modalities ‣ 4 How Well Do Learned Routers Work? ‣ Route Anything: A Study of Model and Policy Routing for General-Purpose AI Systems" class="ltx_ref" style="font-size:90%;--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">4.1</span></a><span id="S1.I1.i2.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">). One capability-tree router over 16 benchmarks scores 79.98 against 79.68 for the fixed candidate and 84.80 for the oracle. Its gains come from agents, video, and image generation; none of 124 router configurations on GenEval2 and Qwen-Image-Bench beats the fixed generator significantly.</span></span>
</span></span>
<span id="S1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="S1.I1.i3.1" class="ltx_text ltx_font_bold">3.</span></span> 
<span id="S1.I1.i3.p1" class="ltx_para">
<span id="S1.I1.i3.p1.1" class="ltx_p"><span id="S1.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">On robots, the router can also read the scene and saves time</span><span id="S1.I1.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> (§</span><a href="#S4.SS2" title="4.2 Routers That Read the Scene ‣ 4 How Well Do Learned Routers Work? ‣ Route Anything: A Study of Model and Policy Routing for General-Purpose AI Systems" class="ltx_ref" style="font-size:90%;--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">4.2</span></a><span id="S1.I1.i3.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">). From three camera frames it sends clean scenes to PatchWAM and randomized ones to ME-Dex, matching the better policy in each condition: 71.6% success against 70.5% for the best single policy, with 24% less policy time.</span></span>
</span></span>
<span id="S1.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="S1.I1.i4.1" class="ltx_text ltx_font_bold">4.</span></span> 
<span id="S1.I1.i4.p1" class="ltx_para">
<span id="S1.I1.i4.p1.1" class="ltx_p"><span id="S1.I1.i4.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Learn outcomes, not winners</span><span id="S1.I1.i4.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> (§</span><a href="#S4.SS3" title="4.3 What a Router Should Learn ‣ 4 How Well Do Learned Routers Work? ‣ Route Anything: A Study of Model and Policy Routing for General-Purpose AI Systems" class="ltx_ref" style="font-size:90%;--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">4.3</span></a><span id="S1.I1.i4.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">). With the same inputs and backbone, regressing each policy’s success reaches 71.6% robot success and classifying the winner 42.8%, because a latency tie-break decides 94% of the winner labels. Winner-label routers on 16 benchmarks and a 68-type classifier also stay below the fixed candidate.</span></span>
</span></span>
<span id="S1.I1.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="S1.I1.i5.1" class="ltx_text ltx_font_bold">5.</span></span> 
<span id="S1.I1.i5.p1" class="ltx_para">
<span id="S1.I1.i5.p1.1" class="ltx_p"><span id="S1.I1.i5.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Compare candidates on the same inputs</span><span id="S1.I1.i5.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> (§</span><a href="#S4.SS4" title="4.4 Matched Comparisons ‣ 4 How Well Do Learned Routers Work? ‣ Route Anything: A Study of Model and Policy Routing for General-Purpose AI Systems" class="ltx_ref" style="font-size:90%;--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">4.4</span></a><span id="S1.I1.i5.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">). A fixed baseline that required a score on every training input dropped Opus 5.5, which missed 11 of 1,122 HLE scores, and turned a learned router’s 0.4-point deficit into a 2.4-point gain.</span></span>
</span></span>
<span id="S1.I1.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="S1.I1.i6.1" class="ltx_text ltx_font_bold">6.</span></span> 
<span id="S1.I1.i6.p1" class="ltx_para">
<span id="S1.I1.i6.p1.1" class="ltx_p"><span id="S1.I1.i6.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">A cheaper route is often good enough</span><span id="S1.I1.i6.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> (§</span><a href="#S5.SS1" title="5.1 The Price of a Route ‣ 5 When Is a Cheaper Route Good Enough? ‣ Route Anything: A Study of Model and Policy Routing for General-Purpose AI Systems" class="ltx_ref" style="font-size:90%;--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">5.1</span></a><span id="S1.I1.i6.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">). Against the reference, routing raises efficiency by </span><math id="S1.I1.i6.p1.m1" class="ltx_math_unparsed" alttext="8.82\times" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">8.82</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" mathsize="0.900em">×</mo></mrow><annotation encoding="application/x-tex">8.82\times</annotation></semantics></math><span id="S1.I1.i6.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> on average over four testbeds, including </span><math id="S1.I1.i6.p1.m2" class="ltx_math_unparsed" alttext="25.5\times" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">25.5</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" mathsize="0.900em">×</mo></mrow><annotation encoding="application/x-tex">25.5\times</annotation></semantics></math><span id="S1.I1.i6.p1.1.5" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> on code and </span><math id="S1.I1.i6.p1.m3" class="ltx_math_unparsed" alttext="7.1\times" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">7.1</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" mathsize="0.900em">×</mo></mrow><annotation encoding="application/x-tex">7.1\times</annotation></semantics></math><span id="S1.I1.i6.p1.1.6" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> on text QA. On CodeRouterBench the router fitted for zero quality loss never calls the Opus reference; the certified zero-loss floor holds on test in all 200 splits at a median </span><math id="S1.I1.i6.p1.m4" class="ltx_math_unparsed" alttext="19.4\times" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">19.4</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" mathsize="0.900em">×</mo></mrow><annotation encoding="application/x-tex">19.4\times</annotation></semantics></math><span id="S1.I1.i6.p1.1.7" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">, the fitted one in 12.5%. In image generation, a price route cuts cost by 26% within half a point.</span></span>
</span></span>
<span id="S1.I1.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="S1.I1.i7.1" class="ltx_text ltx_font_bold">7.</span></span> 
<span id="S1.I1.i7.p1" class="ltx_para">
<span id="S1.I1.i7.p1.1" class="ltx_p"><span id="S1.I1.i7.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Richer candidates and finer states are worth their cost only if they beat what they replace</span><span id="S1.I1.i7.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> (§</span><a href="#S5.SS2" title="5.2 Spending More Within a Task ‣ 5 When Is a Cheaper Route Good Enough? ‣ Route Anything: A Study of Model and Policy Routing for General-Purpose AI Systems" class="ltx_ref" style="font-size:90%;--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">5.2</span></a><span id="S1.I1.i7.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">). On CodeRouterBench, a failure roughly halves the next model’s success; a free compiler gate gives </span><math id="S1.I1.i7.p1.m1" class="ltx_math_unparsed" alttext="4.09\times" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">4.09</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" mathsize="0.900em">×</mo></mrow><annotation encoding="application/x-tex">4.09\times</annotation></semantics></math><span id="S1.I1.i7.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> dollar efficiency, a list-price LLM judge </span><math id="S1.I1.i7.p1.m2" class="ltx_math_unparsed" alttext="0.30\times" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">0.30</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" mathsize="0.900em">×</mo></mrow><annotation encoding="application/x-tex">0.30\times</annotation></semantics></math><span id="S1.I1.i7.p1.1.5" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>