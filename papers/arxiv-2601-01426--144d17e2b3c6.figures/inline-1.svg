pan class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S2.SS3.SSS0.Px1.p2.pic1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Takeaways</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 221.95)"><foreignobject style="--ltx-fo-width:40.23em;--ltx-fo-height:1.74em;--ltx-fo-depth:15.04em;font-size:10pt;" height="232.31" overflow="visible" transform="matrix(1 0 0 -1 0 24.14)" width="556.67"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S2.SS3.SSS0.Px1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:40.23em;">
<span id="S2.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:2ex;">
<span id="S2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S2.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="S2.I1.i1.p1.1" class="ltx_p"><span id="S2.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">We introduce the </span><span id="S2.I1.i1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">SWE-Lego</span><span id="S2.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> dataset, comprising  </span><span id="S2.I1.i1.p1.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">32k</span><span id="S2.I1.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> high-quality software engineering task instances and </span><span id="S2.I1.i1.p1.1.6" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">18k</span><span id="S2.I1.i1.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> expert trajectories, the core building brick for training effective SWE agents. </span>
<br class="ltx_break"></span>
</span></span>
<span id="S2.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S2.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="S2.I1.i2.p1.1" class="ltx_p"><span id="S2.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">We demonstrate that combining real-world and synthetic data yields complementary benefits in both </span><span id="S2.I1.i2.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">quantity and quality</span><span id="S2.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">. Moverover, trajectory curation and filtering further enhance data utility, thereby improving the issue resolving rate.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>