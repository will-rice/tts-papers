<span id="S4.SS2.SSS0.Px2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:40.23em;">
<span id="S4.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:2ex;">
<span id="S4.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="S4.I1.i1.p1.1" class="ltx_p"><span id="S4.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Sequential-then-Parallel</span><span id="S4.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: We suggest to prioritize sequential scaling before a certain saturation point, and then allocate remaining compute to parallel scaling.</span>
<br class="ltx_break"></span>
</span></span>
<span id="S4.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="S4.I1.i2.p1.1" class="ltx_p"><span id="S4.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Generative <math id="S4.I1.i2.p1.m1" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math> Regressive</span><span id="S4.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: The generative verifier  consistently outperforms the regressive variant for parallel scaling across different model sizes and rollout budgets.</span></span>
</span></span>
