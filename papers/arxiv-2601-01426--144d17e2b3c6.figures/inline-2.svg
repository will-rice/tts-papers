n class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S3.SS4.p4.pic1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Takeaways</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 236.63)"><foreignobject style="--ltx-fo-width:40.23em;--ltx-fo-height:1.8em;--ltx-fo-depth:16.11em;font-size:10pt;" height="247.76" overflow="visible" transform="matrix(1 0 0 -1 0 24.91)" width="556.67"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.SS4.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:40.23em;">
<span id="S3.I3" class="ltx_itemize" style="--ltx-enum-leftmargin:2ex;">
<span id="S3.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I3.i1.p1" class="ltx_para ltx_noindent">
<span id="S3.I3.i1.p1.1" class="ltx_p"><span id="S3.I3.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">We refine conventional SFT for SWE tasks with two innovations: (1) </span><span id="S3.I3.i1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">step-level error masking</span><span id="S3.I3.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">, which enables the model to learn from effective intermediate actions, and (2) </span><span id="S3.I3.i1.p1.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">curriculum learning</span><span id="S3.I3.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">, which progressively increases task difficulty, approximated by the number of interaction turns.</span>
<br class="ltx_break"></span>
</span></span>
<span id="S3.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I3.i2.p1" class="ltx_para ltx_noindent">
<span id="S3.I3.i2.p1.1" class="ltx_p"><span id="S3.I3.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Our refined SFT outperforms conventional SFT by </span><span id="S3.I3.i2.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">3.8%</span><span id="S3.I3.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">, establishing new state-of-the-art performance among open-source models of comparable size on SWE-Bench Verified: SWE-Lego-Qwen3-8B hits </span><span id="S3.I3.i2.p1.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">42.2%</span><span id="S3.I3.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">, and SWE-Lego-Qwen3-32B reaches </span><span id="S3.I3.i2.p1.1.6" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">52.6%</span><span id="S3.I3.i2.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>