-1 0 8.65)" width="70.51"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S4.SS1.p1.pic1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Takeaways</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 318.12)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:1.69em;--ltx-fo-depth:21.99em;font-size:10pt;" height="327.67" overflow="visible" transform="matrix(1 0 0 -1 0 23.33)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S4.SS1.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="S4.I1" class="ltx_enumerate" style="--ltx-enum-leftmargin:1em;">
<span id="S4.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="S4.I1.i1.p1" class="ltx_para">
<span id="S4.I1.i1.p1.1" class="ltx_p"><span id="S4.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">TTRL</span><span id="S4.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> surpasses the traditional self-training upper bound, the majority accuracy of the initial model.</span></span>
</span></span>
<span id="S4.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="S4.I1.i2.p1" class="ltx_para">
<span id="S4.I1.i2.p1.1" class="ltx_p"><span id="S4.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The empirical upper bound of </span><span id="S4.I1.i2.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">TTRL</span><span id="S4.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> is direct RL on labeled test data (i.e., training on the test data). </span><span id="S4.I1.i2.p1.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">TTRL</span><span id="S4.I1.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> can approach the performance of this upper bound, highlighting its potential advantages in efficacy over standard </span><span id="S4.I1.i2.p1.1.6" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">training-evaluation</span><span id="S4.I1.i2.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> protocols.</span></span>
</span></span>
<span id="S4.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="S4.I1.i3.p1" class="ltx_para">
<span id="S4.I1.i3.p1.1" class="ltx_p"><span id="S4.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">For challenging tasks, </span><span id="S4.I1.i3.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">TTRL</span><span id="S4.I1.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> can reach the empirical upper bound using only a 1.5B model. This demonstrates that LLMs can now efficiently self-evolve through </span><span id="S4.I1.i3.p1.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">TTRL</span><span id="S4.I1.i3.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">, enabling unbounded lifelong learning on large-scale datasets.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>