<span id="S4.I2.i4.p1.1" class="ltx_p"><span id="S4.I2.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">AudioLDM2</span><span id="S4.I2.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> consistently underperformed across all metrics, reflecting challenges in both audio quality and relevance to complex prompts. This positions it as the least preferred model in this evaluation.</span></span>
