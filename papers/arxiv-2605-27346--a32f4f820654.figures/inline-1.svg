ass="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="p2.pic1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">In a Nutshell</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.84 11.69)"><foreignobject style="--ltx-fo-width:46.65em;--ltx-fo-height:6.69em;--ltx-fo-depth:0em;font-size:10pt;" height="92.52" overflow="visible" transform="matrix(1 0 0 -1 0 92.52)" width="645.5"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.65em;">
<span id="p2.pic1.2.1" class="ltx_p"><span id="p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">MERIT<span id="p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> learns three lightweight projection heads
(melody, rhythm, timbre) on top of a pre-trained <em id="p2.pic1.2.1.1.1.1" class="ltx_emph ltx_font_italic">frozen</em> MERT backbone.
A generative triplet pipeline provides factor-isolated training data with no manual labelling.
Each head achieves <math id="p2.pic1.m1" class="ltx_Math" alttext="\geq\!99.6\%" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≥</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">99.6</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">%</mo></mrow></mrow><annotation encoding="application/x-tex">\geq\!99.6\%</annotation></semantics></math> triplet accuracy on held-out factor-controlled tests and
the correct head dominates on all three independent zero-shot audio probes,
confirming that disentanglement transfers to real-world audio.</span></span></span>
</span></span></span></foreignobject></g></g></svg>