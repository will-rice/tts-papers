<span id="A1.SS2.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.48em;">
<span id="A1.SS2.p2.pic1.1.1" class="ltx_p"><span id="A1.SS2.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Level Guide</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.5 11.26)"><foreignobject style="--ltx-fo-width:45.4em;--ltx-fo-height:9.09em;--ltx-fo-depth:0.19em;font-size:10pt;" height="128.53" overflow="visible" transform="matrix(1 0 0 -1 0 125.84)" width="628.21"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.4em;">
<span id="A1.SS2.p2.pic1.2.1" class="ltx_p"><span id="A1.SS2.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Level definitions:</span></span>
<span id="A1.SS2.p2.pic1.2.2" class="ltx_p"><span id="A1.SS2.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">L1 Instruction-Only: follow the semantic instruction; paralinguistics are not evaluated.</span></span>
<span id="A1.SS2.p2.pic1.2.3" class="ltx_p"><span id="A1.SS2.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">L2 Perceive-In: infer paralinguistic information present in the input speech and adapt the reply accordingly (no requirement on output paralinguistics).</span></span>
<span id="A1.SS2.p2.pic1.2.4" class="ltx_p"><span id="A1.SS2.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">L3 Express-Out: obey an explicit request to embed designated paralinguistic traits in the output speech, while the input speech itself is neutral.</span></span>
<span id="A1.SS2.p2.pic1.2.5" class="ltx_p"><span id="A1.SS2.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">L4 Perceive &amp; Express: jointly understand input paralinguistics and reproduce appropriate paralinguistics in the output, mirroring real S2S interaction.</span></span>
</span></span></span></foreignobject></g></g></svg>