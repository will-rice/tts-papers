<span id="A1.SS2.SSS0.Px3.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.4em;">
<span id="A1.SS2.SSS0.Px3.p2.pic1.2.1" class="ltx_p"><span id="A1.SS2.SSS0.Px3.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Schema</span></span>
<span id="A1.SS2.SSS0.Px3.p2.pic1.2.2" class="ltx_p"><span id="A1.SS2.SSS0.Px3.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">{schema}</span></span>
<span id="A1.SS2.SSS0.Px3.p2.pic1.2.3" class="ltx_p"><span id="A1.SS2.SSS0.Px3.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Level Guide</span></span>
<span id="A1.SS2.SSS0.Px3.p2.pic1.2.4" class="ltx_p"><span id="A1.SS2.SSS0.Px3.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">{level_guide}</span></span>
<span id="A1.SS2.SSS0.Px3.p2.pic1.2.5" class="ltx_p"><span id="A1.SS2.SSS0.Px3.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Seeds (5 examples)</span></span>
<span id="A1.SS2.SSS0.Px3.p2.pic1.2.6" class="ltx_p"><span id="A1.SS2.SSS0.Px3.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">{seed_json}</span></span>
<span id="A1.SS2.SSS0.Px3.p2.pic1.2.7" class="ltx_p"><span id="A1.SS2.SSS0.Px3.p2.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;"># Task</span></span>
<span id="A1.SS2.SSS0.Px3.p2.pic1.2.8" class="ltx_p"><span id="A1.SS2.SSS0.Px3.p2.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Generate one **new** example that:</span></span>
<span id="A1.SS2.SSS0.Px3.p2.pic1.2.9" class="ltx_p"><span id="A1.SS2.SSS0.Px3.p2.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Conform to the schema exactly (all required keys, same key order is appreciated).</span></span>
<span id="A1.SS2.SSS0.Px3.p2.pic1.2.10" class="ltx_p"><span id="A1.SS2.SSS0.Px3.p2.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. Are plausible and should significant different with the seeds.</span></span>
<span id="A1.SS2.SSS0.Px3.p2.pic1.2.11" class="ltx_p"><span id="A1.SS2.SSS0.Px3.p2.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. Use unique &quot;id&quot;s prefixed with &quot;id_prefix_&quot; followed by an incrementing integer.</span></span>
<span id="A1.SS2.SSS0.Px3.p2.pic1.2.12" class="ltx_p"><span id="A1.SS2.SSS0.Px3.p2.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">4. It should be considered that the generated **&lt;text&gt;** attribute can serve as a good input for the TTS model, thereby generating problem speech.</span></span>
<span id="A1.SS2.SSS0.Px3.p2.pic1.2.13" class="ltx_p"><span id="A1.SS2.SSS0.Px3.p2.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">5. **&lt;category&gt;** should be category, **&lt;tasks&gt;** could be various and **&lt;language&gt;** should be Chinese or English.</span></span>
<span id="A1.SS2.SSS0.Px3.p2.pic1.2.14" class="ltx_p"><span id="A1.SS2.SSS0.Px3.p2.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">6. Return ONLY the JSON, nothing else.</span></span>
</span></span></span></foreignobject></g></g></svg>