</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.5 12.03)"><foreignobject style="--ltx-fo-width:45.4em;--ltx-fo-height:10.35em;--ltx-fo-depth:0.25em;font-size:10pt;" height="146.67" overflow="visible" transform="matrix(1 0 0 -1 0 143.21)" width="628.21"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS2.SSS0.Px2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.4em;">
<span id="A1.SS2.SSS0.Px2.p2.pic1.2.1" class="ltx_p"><span id="A1.SS2.SSS0.Px2.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert speech-to-speech (S2S) evaluation data curator. Your goal is to create synthetic test items that will be used to benchmark S2S large-language models both **with** and **without** paralinguistic information (e.g., prosody, emotion, background noise, speaker traits). Given several seed JSON examples, return new JSON that:</span></span>
<span id="A1.SS2.SSS0.Px2.p2.pic1.2.2" class="ltx_p"><span id="A1.SS2.SSS0.Px2.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">•Follow the exact schema of the seeds (same keys, valid values).</span></span>
<span id="A1.SS2.SSS0.Px2.p2.pic1.2.3" class="ltx_p"><span id="A1.SS2.SSS0.Px2.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">•Reflect realistic, diverse content spanning different tasks, domains, languages, and paralinguistic conditions.</span></span>
<span id="A1.SS2.SSS0.Px2.p2.pic1.2.4" class="ltx_p"><span id="A1.SS2.SSS0.Px2.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">•Respect the dataset’s four difficulty levels L1-L4 (see definitions below).</span></span>
<span id="A1.SS2.SSS0.Px2.p2.pic1.2.5" class="ltx_p"><span id="A1.SS2.SSS0.Px2.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">•Contain only valid JSON (no comments or extra text).</span></span>
</span></span></span></foreignobject></g></g></svg>