<svg id="A1.SS5.SSS0.Px2.p4.pic1" class="ltx_picture" height="218.65" overflow="visible" version="1.1" viewbox="0 0 653.15 218.65" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,218.65) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#D9D9D9;" fill="#D9D9D9" fill-opacity="1.0"><path style="stroke:none" d="M 0 7.87 L 0 210.77 C 0 215.12 3.53 218.65 7.87 218.65 L 645.28 218.65 C 649.62 218.65 653.15 215.12 653.15 210.77 L 653.15 7.87 C 653.15 3.53 649.62 0 645.28 0 L 7.87 0 C 3.53 0 0 3.53 0 7.87 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 8.57 L 0.69 195.55 L 652.46 195.55 L 652.46 8.57 C 652.46 4.22 648.93 0.69 644.58 0.69 L 8.57 0.69 C 4.22 0.69 0.69 4.22 0.69 8.57 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.5 203.64)"><foreignobject style="--ltx-fo-width:39.48em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="546.29"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS5.SSS0.Px2.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.48em;">
<span id="A1.SS5.SSS0.Px2.p4.pic1.1.1" class="ltx_p"><span id="A1.SS5.SSS0.Px2.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Audio Evaluation Prompt ((Text Modality))</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.5 12.03)"><foreignobject style="--ltx-fo-width:45.4em;--ltx-fo-height:12.69em;--ltx-fo-depth:0.25em;font-size:10pt;" height="179.11" overflow="visible" transform="matrix(1 0 0 -1 0 175.66)" width="628.21"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS5.SSS0.Px2.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.4em;">
<span id="A1.SS5.SSS0.Px2.p4.pic1.2.1" class="ltx_p"><span id="A1.SS5.SSS0.Px2.p4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">I will provide an input audio and two corresponding response audios. Please evaluate which response is better. You only need to reply with ’First one wins’ or ’Second one wins.’</span></span>
<span id="A1.SS5.SSS0.Px2.p4.pic1.2.2" class="ltx_p"><span id="A1.SS5.SSS0.Px2.p4.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here is the input audio: [input audio], the first response: [output audio 1], and the second response: [output audio 2].</span></span>
<span id="A1.SS5.SSS0.Px2.p4.pic1.2.3" class="ltx_p"><span id="A1.SS5.SSS0.Px2.p4.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">My requirement: A. When comparing the quality of two output audios, you need to check:</span></span>
<span id="A1.SS5.SSS0.Px2.p4.pic1.2.4" class="ltx_p"><span id="A1.SS5.SSS0.Px2.p4.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Check the instruction alignment: Does output audio follow the instructions of the input audio or complete the corresponding task?</span></span>
<span id="A1.SS5.SSS0.Px2.p4.pic1.2.5" class="ltx_p"><span id="A1.SS5.SSS0.Px2.p4.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. Check the expressiveness: Does the output audio recognize the paralinguistic information (such as vocal tone, speaking speed, emotion, etc.) in the input audio or respond to such paralinguistic information?</span></span>
<span id="A1.SS5.SSS0.Px2.p4.pic1.2.6" class="ltx_p"><span id="A1.SS5.SSS0.Px2.p4.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. Check the quality of the output audio: the sound (such as fluency, integrity, naturalness of speech).</span></span>
</span></span></span></foreignobject></g></g></svg>