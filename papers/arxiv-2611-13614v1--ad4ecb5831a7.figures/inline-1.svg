<span id="A1.SS3.SSS0.Px4.p2.pic1.2.2" class="ltx_p"><span id="A1.SS3.SSS0.Px4.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Constraints.<span id="A1.SS3.SSS0.Px4.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> The attached critical rules forbid quoting or retelling
