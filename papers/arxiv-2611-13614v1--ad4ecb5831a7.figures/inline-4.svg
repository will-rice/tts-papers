<span id="A1.SS3.SSS0.Px4.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.72em;">
<span id="A1.SS3.SSS0.Px4.p5.pic1.2.1" class="ltx_p"><span id="A1.SS3.SSS0.Px4.p5.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">“Task: produce an RP (role-play) voice direction—an
evocative prompt that casts the speaker as an abstract ROLE within a MOOD or
ATMOSPHERE, inferred from how the VOICE SOUNDS (pitch, pace, volume, energy,
timbre) and NOT from what is being said. Lean on imagery rather than a list of
acoustic parameters. VARY your structure: open on the scene, the character,
a sensory image, or a direct instruction—do NOT fall into a fixed formula
or a stock opening. A dynamic arc that shifts tone is welcome. Tags (a light
guide—weave them into the imagery, don’t just list them; anything you state
must match): <span id="A1.SS3.SSS0.Px4.p5.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">[TAGS]</span>”</span></span>
<span id="A1.SS3.SSS0.Px4.p5.pic1.2.2" class="ltx_p"><span id="A1.SS3.SSS0.Px4.p5.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output.<span id="A1.SS3.SSS0.Px4.p5.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> After the rules and rotated example: <span id="A1.SS3.SSS0.Px4.p5.pic1.2.2.1.1.1" class="ltx_text ltx_font_typewriter">YOUR RP:</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>