<svg id="A4.SS3.SSS2.p3.pic1" class="ltx_picture" height="462.21" overflow="visible" version="1.1" viewbox="0 0 238.69 462.21" width="238.69"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,462.21) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#228B22;" fill="#228B22" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.04 L 0 457.17 C 0 459.96 2.26 462.21 5.04 462.21 L 233.64 462.21 C 236.43 462.21 238.69 459.96 238.69 457.17 L 238.69 5.04 C 238.69 2.26 236.43 0 233.64 0 L 5.04 0 C 2.26 0 0 2.26 0 5.04 Z" /></g><g style="--ltx-fill-color:#F8FFF8;" fill="#F8FFF8" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 5.04 L 1.11 420.02 L 237.58 420.02 L 237.58 5.04 C 237.58 2.87 235.82 1.11 233.64 1.11 L 5.04 1.11 C 2.87 1.11 1.11 2.87 1.11 5.04 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 429.22)"><foreignobject style="--ltx-fo-width:12.12em;--ltx-fo-height:2.02em;--ltx-fo-depth:0.3em;font-size:10pt;" height="32.1" overflow="visible" transform="matrix(1 0 0 -1 0 27.95)" width="167.71"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS3.SSS2.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:12.12em;">
<span id="A4.SS3.SSS2.p3.pic1.1.1" class="ltx_p"><span id="A4.SS3.SSS2.p3.pic1.1.1.1" class="ltx_text" style="font-size:120%;--ltx-fg-color:#FFFFFF;">Ours (<span id="A4.SS3.SSS2.p3.pic1.1.1.1.1" class="ltx_text ltx_font_smallcaps">Prism</span>)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 12.92)"><foreignobject style="--ltx-fo-width:14.24em;--ltx-fo-height:28.57em;--ltx-fo-depth:0em;font-size:10pt;" height="395.3" overflow="visible" transform="matrix(1 0 0 -1 0 395.3)" width="197.04"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A4.SS3.SSS2.p3.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:14.24em;">
<span id="A4.SS3.SSS2.p3.pic1.p2" class="ltx_para">
<span id="A4.SS3.SSS2.p3.pic1.p2.1" class="ltx_p"><span id="A4.SS3.SSS2.p3.pic1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The number must be divisible by <math id="A4.SS3.SSS2.p3.pic1.m1" class="ltx_Math" alttext="30=2\cdot 3\cdot 5" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">30</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn></mrow></mrow><annotation encoding="application/x-tex">30=2\cdot 3\cdot 5</annotation></semantics></math>, so it must end in 0, divisible by 3, and divisible by 5.</span></span>
<span id="A4.SS3.SSS2.p3.pic1.p2.2" class="ltx_p"><span id="A4.SS3.SSS2.p3.pic1.p2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">We can start by listing the possible numbers that end in 0 and are divisible by 3.
The possible numbers that end in 0 and are divisible by 3 are <math id="A4.SS3.SSS2.p3.pic1.m2" class="ltx_Math" alttext="2220" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2220</mn><annotation encoding="application/x-tex">2220</annotation></semantics></math>, <math id="A4.SS3.SSS2.p3.pic1.m3" class="ltx_Math" alttext="22020" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">22020</mn><annotation encoding="application/x-tex">22020</annotation></semantics></math>, <math id="A4.SS3.SSS2.p3.pic1.m4" class="ltx_Math" alttext="20220" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">20220</mn><annotation encoding="application/x-tex">20220</annotation></semantics></math>, <math id="A4.SS3.SSS2.p3.pic1.m5" class="ltx_Math" alttext="22220" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">22220</mn><annotation encoding="application/x-tex">22220</annotation></semantics></math>, and <math id="A4.SS3.SSS2.p3.pic1.m6" class="ltx_Math" alttext="22020" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">22020</mn><annotation encoding="application/x-tex">22020</annotation></semantics></math>.</span></span>
<span id="A4.SS3.SSS2.p3.pic1.p2.3" class="ltx_p"><span id="A4.SS3.SSS2.p3.pic1.p2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">From these, we choose the smallest number that is divisible by 5.
The possible numbers that end in 0 and are divisible by 3 are <math id="A4.SS3.SSS2.p3.pic1.m7" class="ltx_Math" alttext="2220" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2220</mn><annotation encoding="application/x-tex">2220</annotation></semantics></math>, <math id="A4.SS3.SSS2.p3.pic1.m8" class="ltx_Math" alttext="22020" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">22020</mn><annotation encoding="application/x-tex">22020</annotation></semantics></math>, <math id="A4.SS3.SSS2.p3.pic1.m9" class="ltx_Math" alttext="20220" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">20220</mn><annotation encoding="application/x-tex">20220</annotation></semantics></math>, <math id="A4.SS3.SSS2.p3.pic1.m10" class="ltx_Math" alttext="22220" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">22220</mn><annotation encoding="application/x-tex">22220</annotation></semantics></math>, <math id="A4.SS3.SSS2.p3.pic1.m11" class="ltx_Math" alttext="22020" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">22020</mn><annotation encoding="application/x-tex">22020</annotation></semantics></math>, and <math id="A4.SS3.SSS2.p3.pic1.m12" class="ltx_Math" alttext="20220" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">20220</mn><annotation encoding="application/x-tex">20220</annotation></semantics></math>.</span></span>
<span id="A4.SS3.SSS2.p3.pic1.p2.4" class="ltx_p"><span id="A4.SS3.SSS2.p3.pic1.p2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">The smallest number that is divisible by 5 is <math id="A4.SS3.SSS2.p3.pic1.m13" class="ltx_Math" alttext="2220" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2220</mn><annotation encoding="application/x-tex">2220</annotation></semantics></math>.
Therefore, the least positive integer multiple of 30 that can be written with only the digits 0 and 2 is <math id="A4.SS3.SSS2.p3.pic1.m14" class="ltx_Math" alttext="2220" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2220</mn><annotation encoding="application/x-tex">2220</annotation></semantics></math>.</span></span>
</span>
