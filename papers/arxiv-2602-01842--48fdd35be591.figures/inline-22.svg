<svg id="A4.SS3.SSS1.p2.pic1" class="ltx_picture" height="369.31" overflow="visible" version="1.1" viewbox="0 0 229.14 369.31" width="229.14"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,369.31) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#800000;" fill="#800000" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.04 L 0 364.26 C 0 367.05 2.26 369.31 5.04 369.31 L 224.09 369.31 C 226.88 369.31 229.14 367.05 229.14 364.26 L 229.14 5.04 C 229.14 2.26 226.88 0 224.09 0 L 5.04 0 C 2.26 0 0 2.26 0 5.04 Z" /></g><g style="--ltx-fill-color:#FFF8F8;" fill="#FFF8F8" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 5.04 L 1.11 324.63 L 228.03 324.63 L 228.03 5.04 C 228.03 2.87 226.27 1.11 224.09 1.11 L 5.04 1.11 C 2.87 1.11 1.11 2.87 1.11 5.04 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 333.82)"><foreignobject style="--ltx-fo-width:11.53em;--ltx-fo-height:2.2em;--ltx-fo-depth:0.3em;font-size:10pt;" height="34.59" overflow="visible" transform="matrix(1 0 0 -1 0 30.44)" width="159.54"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS3.SSS1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:11.53em;">
<span id="A4.SS3.SSS1.p2.pic1.1.1" class="ltx_p"><span id="A4.SS3.SSS1.p2.pic1.1.1.1" class="ltx_text" style="font-size:120%;--ltx-fg-color:#FFFFFF;">Original (LLaDA 8B Instruct)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 12.92)"><foreignobject style="--ltx-fo-width:13.55em;--ltx-fo-height:21.67em;--ltx-fo-depth:0em;font-size:10pt;" height="299.9" overflow="visible" transform="matrix(1 0 0 -1 0 299.9)" width="187.49"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A4.SS3.SSS1.p2.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:13.55em;">
<span id="A4.SS3.SSS1.p2.pic1.p2" class="ltx_para">
<span id="A4.SS3.SSS1.p2.pic1.p2.1" class="ltx_p"><span id="A4.SS3.SSS1.p2.pic1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To convert the point <math id="A4.SS3.SSS1.p2.pic1.m1" class="ltx_Math" alttext="(0,3)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(0,3)</annotation></semantics></math> from rectangular coordinates to polar coordinates, we need to use the following formulas:</span></span>
<span id="A4.Ex5" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A4.Ex5.m1" class="ltx_Math" alttext="r=\sqrt{x^{2}+y^{2}}" display="block" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msqrt style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup></mrow></msqrt></mrow><annotation encoding="application/x-tex">r=\sqrt{x^{2}+y^{2}}</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="A4.Ex6" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A4.Ex6.m1" class="ltx_Math" alttext="\theta=\tan^{-1}\left(\frac{y}{x}\right)" display="block" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">tan</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msup><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">(</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">\theta=\tan^{-1}\left(\frac{y}{x}\right)</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="A4.SS3.SSS1.p2.pic1.p2.2" class="ltx_p"><span id="A4.SS3.SSS1.p2.pic1.p2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here, <math id="A4.SS3.SSS1.p2.pic1.m2" class="ltx_Math" alttext="x=0" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><annotation encoding="application/x-tex">x=0</annotation></semantics></math> and <math id="A4.SS3.SSS1.p2.pic1.m3" class="ltx_Math" alttext="y=3" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></mrow><annotation encoding="application/x-tex">y=3</annotation></semantics></math>.</span></span>
<span id="A4.SS3.SSS1.p2.pic1.p2.3" class="ltx_p"><span id="A4.SS3.SSS1.p2.pic1.p2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Calculate <math id="A4.SS3.SSS1.p2.pic1.m4" class="ltx_Math" alttext="r" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><annotation encoding="application/x-tex">r</annotation></semantics></math>:</span></span>
<span id="A4.Ex7" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A4.Ex7.m1" class="ltx_Math" alttext="r=\sqrt{0^{2}+3^{2}}=\sqrt{9}=3" display="block" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msqrt style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup></mrow></msqrt><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msqrt style="--ltx-fg-color:#000000;" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn></msqrt><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></mrow><annotation encoding="application/x-tex">r=\sqrt{0^{2}+3^{2}}=\sqrt{9}=3</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="A4.SS3.SSS1.p2.pic1.p2.4" class="ltx_p"><span id="A4.SS3.SSS1.p2.pic1.p2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. Calculate <math id="A4.SS3.SSS1.p2.pic1.m5" class="ltx_Math" alttext="\theta" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi><annotation encoding="application/x-tex">\theta</annotation></semantics></math>:</span></span>
<span id="A4.Ex8" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A4.Ex8.m1" class="ltx_Math" alttext="\theta=\tan^{-1}\left(\frac{3}{0}\right)=\tan^{-1}(3)" display="block" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">tan</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msup><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">(</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">tan</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msup><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">\theta=\tan^{-1}\left(\frac{3}{0}\right)=\tan^{-1}(3)</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="A4.SS3.SSS1.p2.pic1.p2.5" class="ltx_p"><span id="A4.SS3.SSS1.p2.pic1.p2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">The value of <math id="A4.SS3.SSS1.p2.pic1.m6" class="ltx_Math" alttext="\tan^{-1}(3)" display="inline" intent=":literal"><semantics><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">tan</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msup><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\tan^{-1}(3)</annotation></semantics></math> is <math id="A4.SS3.SSS1.p2.pic1.m7" class="ltx_Math" alttext="\frac{\pi}{3}" display="inline" intent=":literal"><semantics><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></mfrac><annotation encoding="application/x-tex">\frac{\pi}{3}</annotation></semantics></math> because <math id="A4.SS3.SSS1.p2.pic1.m8" class="ltx_Math" alttext="\tan\left(\frac{\pi}{3}\right)=3" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">tan</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">(</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></mrow><annotation encoding="application/x-tex">\tan\left(\frac{\pi}{3}\right)=3</annotation></semantics></math>.<span id="A4.SS3.SSS1.p2.pic1.p2.5.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS3.SSS1.p2.pic1.p2.6" class="ltx_p"><span id="A4.SS3.SSS1.p2.pic1.p2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Therefore, the polar coordinates of the point <math id="A4.SS3.SSS1.p2.pic1.m9" class="ltx_Math" alttext="(0,3)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(0,3)</annotation></semantics></math> are <math id="A4.SS3.SSS1.p2.pic1.m10" class="ltx_Math" alttext="(3,\frac{\pi}{3})" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(3,\frac{\pi}{3})</annotation></semantics></math>.</span></span>
</span>
<span id="A4.SS3.SSS1.p2.pic1.p1" class="ltx_para ltx_noindent ltx_align_center"><span class="ltx_inline-block"><svg id="A4.SS3.SSS1.p2.pic1.p1.pic1" class="ltx_picture" color="#000000" height="23.92" overflow="visible" version="1.1" viewbox="0 0 98.43 23.92" width="98.43"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,23.92) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#C80000;" fill="#C80000" fill-opacity="1.0"><path style="stroke:none" d="M 0 1.11 L 0 22.82 C 0 23.43 0.5 23.92 1.11 23.92 L 97.32 23.92 C 97.93 23.92 98.43 23.43 98.43 22.82 L 98.43 1.11 C 98.43 0.5 97.93 0 97.32 0 L 1.11 0 C 0.5 0 0 0.5 0 1.11 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 1.11 L 1.11 22.82 L 97.32 22.82 L 97.32 1.11 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.98 8.5)"><foreignobject style="--ltx-fo-width:5.82em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="80.53"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS3.SSS1.p2.pic1.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:5.82em;">
<span id="A4.SS3.SSS1.p2.pic1.p1.pic1.1.1" class="ltx_p ltx_align_center"><span id="A4.SS3.SSS1.p2.pic1.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#C80000;">(3, <math id="A4.SS3.SSS1.p2.pic1.p1.pic1.m1" class="ltx_Math" alttext="\frac{\pi}{3}" display="inline" intent=":literal"><semantics><mfrac style="--ltx-fg-color:#C80000;" mathcolor="#C80000"><mi style="--ltx-fg-color:#C80000;" mathcolor="#C80000">π</mi><mn style="--ltx-fg-color:#C80000;" mathcolor="#C80000">𝟑</mn></mfrac><annotation encoding="application/x-tex">\frac{\pi}{3}</annotation></semantics></math>)</span></span>
</span></span></span></foreignobject></g></g></svg>