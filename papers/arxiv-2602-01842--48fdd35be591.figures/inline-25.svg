<span id="A4.SS3.SSS2.p2.pic1.p2" class="ltx_para">
<span id="A4.SS3.SSS2.p2.pic1.p2.1" class="ltx_p"><span id="A4.SS3.SSS2.p2.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Reasoning:<span id="A4.SS3.SSS2.p2.pic1.p2.1.1.1" class="ltx_text ltx_font_medium">
To find the least positive integer multiple of 30 that can be written with only the digits 0 and 2, we need to find a number that is divisible by both 5 and 6, since 30 is the least common multiple of 5 and 6.</span></span></span>
<span id="A4.SS3.SSS2.p2.pic1.p2.2" class="ltx_p"><span id="A4.SS3.SSS2.p2.pic1.p2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Step 1:<span id="A4.SS3.SSS2.p2.pic1.p2.2.1.1" class="ltx_text ltx_font_medium"> First, let’s find the smallest multiple of 5 that can be written with only the digits 0 and 2. This would be 20, since 20 is divisible by 5.</span></span></span>
<span id="A4.SS3.SSS2.p2.pic1.p2.3" class="ltx_p"><span id="A4.SS3.SSS2.p2.pic1.p2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Step 2:<span id="A4.SS3.SSS2.p2.pic1.p2.3.1.1" class="ltx_text ltx_font_medium"> Next, let’s find the smallest multiple of 6 that can be written with only the digits 0 and 2. This would be 20 itself, since 20 is divisible by both 2 and 3.</span></span></span>
<span id="A4.SS3.SSS2.p2.pic1.p2.4" class="ltx_p"><span id="A4.SS3.SSS2.p2.pic1.p2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Step 3:<span id="A4.SS3.SSS2.p2.pic1.p2.4.1.1" class="ltx_text ltx_font_medium"> Now, we need to find a number that is divisible by both 20 and 20 (or equivalently, divisible by both 20 and 30). The smallest such number is 2020, which is divisible by 30.</span></span></span>
<span id="A4.SS3.SSS2.p2.pic1.p2.5" class="ltx_p"><span id="A4.SS3.SSS2.p2.pic1.p2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Therefore, the least positive integer multiple of 30 that can be written with only the digits 0 and 2 is 2020.</span></span>
</span>
