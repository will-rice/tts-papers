<svg id="A4.SS3.SSS1.p3.pic1" class="ltx_picture" height="435.38" overflow="visible" version="1.1" viewbox="0 0 238.69 435.38" width="238.69"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,435.38) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#228B22;" fill="#228B22" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.04 L 0 430.34 C 0 433.13 2.26 435.38 5.04 435.38 L 233.64 435.38 C 236.43 435.38 238.69 433.13 238.69 430.34 L 238.69 5.04 C 238.69 2.26 236.43 0 233.64 0 L 5.04 0 C 2.26 0 0 2.26 0 5.04 Z" /></g><g style="--ltx-fill-color:#F8FFF8;" fill="#F8FFF8" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 5.04 L 1.11 393.2 L 237.58 393.2 L 237.58 5.04 C 237.58 2.87 235.82 1.11 233.64 1.11 L 5.04 1.11 C 2.87 1.11 1.11 2.87 1.11 5.04 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 402.39)"><foreignobject style="--ltx-fo-width:12.12em;--ltx-fo-height:2.02em;--ltx-fo-depth:0.3em;font-size:10pt;" height="32.1" overflow="visible" transform="matrix(1 0 0 -1 0 27.95)" width="167.71"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS3.SSS1.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:12.12em;">
<span id="A4.SS3.SSS1.p3.pic1.1.1" class="ltx_p"><span id="A4.SS3.SSS1.p3.pic1.1.1.1" class="ltx_text" style="font-size:120%;--ltx-fg-color:#FFFFFF;">Ours (<span id="A4.SS3.SSS1.p3.pic1.1.1.1.1" class="ltx_text ltx_font_smallcaps">Prism</span>)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 12.92)"><foreignobject style="--ltx-fo-width:14.24em;--ltx-fo-height:26.63em;--ltx-fo-depth:0em;font-size:10pt;" height="368.47" overflow="visible" transform="matrix(1 0 0 -1 0 368.47)" width="197.04"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A4.SS3.SSS1.p3.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:14.24em;">
<span id="A4.SS3.SSS1.p3.pic1.p2" class="ltx_para">
<span id="A4.SS3.SSS1.p3.pic1.p2.1" class="ltx_p"><span id="A4.SS3.SSS1.p3.pic1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To convert the point <math id="A4.SS3.SSS1.p3.pic1.m1" class="ltx_Math" alttext="(0,3)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(0,3)</annotation></semantics></math> from rectangular coordinates to polar coordinates, we need to find the radial distance <math id="A4.SS3.SSS1.p3.pic1.m2" class="ltx_Math" alttext="r" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><annotation encoding="application/x-tex">r</annotation></semantics></math> and the angle <math id="A4.SS3.SSS1.p3.pic1.m3" class="ltx_Math" alttext="\theta" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi><annotation encoding="application/x-tex">\theta</annotation></semantics></math>.</span></span>
<span id="A4.SS3.SSS1.p3.pic1.p2.2" class="ltx_p"><span id="A4.SS3.SSS1.p3.pic1.p2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. The radial distance <math id="A4.SS3.SSS1.p3.pic1.m4" class="ltx_Math" alttext="r" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><annotation encoding="application/x-tex">r</annotation></semantics></math> is given by the distance formula:</span></span>
<span id="A4.Ex9" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A4.Ex9.m1" class="ltx_Math" alttext="r=\sqrt{x^{2}+y^{2}}" display="block" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msqrt style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup></mrow></msqrt></mrow><annotation encoding="application/x-tex">r=\sqrt{x^{2}+y^{2}}</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="A4.SS3.SSS1.p3.pic1.p2.3" class="ltx_p"><span id="A4.SS3.SSS1.p3.pic1.p2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">For the point <math id="A4.SS3.SSS1.p3.pic1.m5" class="ltx_Math" alttext="(0,3)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(0,3)</annotation></semantics></math>, <math id="A4.SS3.SSS1.p3.pic1.m6" class="ltx_Math" alttext="x=0" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><annotation encoding="application/x-tex">x=0</annotation></semantics></math> and <math id="A4.SS3.SSS1.p3.pic1.m7" class="ltx_Math" alttext="y=3" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></mrow><annotation encoding="application/x-tex">y=3</annotation></semantics></math>, so:</span></span>
<span id="A4.Ex10" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A4.Ex10.m1" class="ltx_Math" alttext="r=\sqrt{0^{2}+3^{2}}=\sqrt{9}=3" display="block" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msqrt style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup></mrow></msqrt><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msqrt style="--ltx-fg-color:#000000;" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn></msqrt><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></mrow><annotation encoding="application/x-tex">r=\sqrt{0^{2}+3^{2}}=\sqrt{9}=3</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="A4.SS3.SSS1.p3.pic1.p2.4" class="ltx_p"><span id="A4.SS3.SSS1.p3.pic1.p2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. The angle <math id="A4.SS3.SSS1.p3.pic1.m8" class="ltx_Math" alttext="\theta" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi><annotation encoding="application/x-tex">\theta</annotation></semantics></math> is given by the arctangent function:</span></span>
<span id="A4.Ex11" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A4.Ex11.m1" class="ltx_Math" alttext="\theta=\tan^{-1}\left(\frac{y}{x}\right)" display="block" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">tan</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msup><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">(</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">\theta=\tan^{-1}\left(\frac{y}{x}\right)</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="A4.SS3.SSS1.p3.pic1.p2.5" class="ltx_p"><span id="A4.SS3.SSS1.p3.pic1.p2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">For the point <math id="A4.SS3.SSS1.p3.pic1.m9" class="ltx_Math" alttext="(0,3)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(0,3)</annotation></semantics></math>, <math id="A4.SS3.SSS1.p3.pic1.m10" class="ltx_Math" alttext="x=0" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><annotation encoding="application/x-tex">x=0</annotation></semantics></math> and <math id="A4.SS3.SSS1.p3.pic1.m11" class="ltx_Math" alttext="y=3" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></mrow><annotation encoding="application/x-tex">y=3</annotation></semantics></math>. Since the point lies on the positive <math id="A4.SS3.SSS1.p3.pic1.m12" class="ltx_Math" alttext="y" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi><annotation encoding="application/x-tex">y</annotation></semantics></math>-axis, the angle is:</span></span>
<span id="A4.Ex12" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A4.Ex12.m1" class="ltx_Math" alttext="\theta=\frac{\pi}{2}" display="block" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mfrac></mrow><annotation encoding="application/x-tex">\theta=\frac{\pi}{2}</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="A4.SS3.SSS1.p3.pic1.p2.6" class="ltx_p"><span id="A4.SS3.SSS1.p3.pic1.p2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Therefore, the polar coordinates are <math id="A4.SS3.SSS1.p3.pic1.m13" class="ltx_Math" alttext="{(3,\frac{\pi}{2})}" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">{(3,\frac{\pi}{2})}</annotation></semantics></math>.</span></span>
</span>
<span id="A4.SS3.SSS1.p3.pic1.p1" class="ltx_para ltx_noindent ltx_align_center"><span class="ltx_inline-block"><svg id="A4.SS3.SSS1.p3.pic1.p1.pic1" class="ltx_picture" color="#000000" height="23.92" overflow="visible" version="1.1" viewbox="0 0 98.43 23.92" width="98.43"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,23.92) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#008000;" fill="#008000" fill-opacity="1.0"><path style="stroke:none" d="M 0 1.11 L 0 22.82 C 0 23.43 0.5 23.92 1.11 23.92 L 97.32 23.92 C 97.93 23.92 98.43 23.43 98.43 22.82 L 98.43 1.11 C 98.43 0.5 97.93 0 97.32 0 L 1.11 0 C 0.5 0 0 0.5 0 1.11 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 1.11 L 1.11 22.82 L 97.32 22.82 L 97.32 1.11 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.98 8.5)"><foreignobject style="--ltx-fo-width:5.82em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="80.53"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS3.SSS1.p3.pic1.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:5.82em;">
<span id="A4.SS3.SSS1.p3.pic1.p1.pic1.1.1" class="ltx_p ltx_align_center"><span id="A4.SS3.SSS1.p3.pic1.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#008000;">(3, <math id="A4.SS3.SSS1.p3.pic1.p1.pic1.m1" class="ltx_Math" alttext="\frac{\pi}{2}" display="inline" intent=":literal"><semantics><mfrac style="--ltx-fg-color:#008000;" mathcolor="#008000"><mi style="--ltx-fg-color:#008000;" mathcolor="#008000">π</mi><mn style="--ltx-fg-color:#008000;" mathcolor="#008000">𝟐</mn></mfrac><annotation encoding="application/x-tex">\frac{\pi}{2}</annotation></semantics></math>)</span></span>
</span></span></span></foreignobject></g></g></svg>