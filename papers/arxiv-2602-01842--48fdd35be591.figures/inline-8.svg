<svg id="A4.SS1.SSS2.p3.pic1" class="ltx_picture" height="524.02" overflow="visible" version="1.1" viewbox="0 0 233.92 524.02" width="233.92"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,524.02) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#228B22;" fill="#228B22" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.04 L 0 518.97 C 0 521.76 2.26 524.02 5.04 524.02 L 228.87 524.02 C 231.66 524.02 233.92 521.76 233.92 518.97 L 233.92 5.04 C 233.92 2.26 231.66 0 228.87 0 L 5.04 0 C 2.26 0 0 2.26 0 5.04 Z" /></g><g style="--ltx-fill-color:#F8FFF8;" fill="#F8FFF8" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 5.04 L 1.11 481.83 L 232.81 481.83 L 232.81 5.04 C 232.81 2.87 231.05 1.11 228.87 1.11 L 5.04 1.11 C 2.87 1.11 1.11 2.87 1.11 5.04 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 491.02)"><foreignobject style="--ltx-fo-width:11.83em;--ltx-fo-height:2.02em;--ltx-fo-depth:0.3em;font-size:10pt;" height="32.1" overflow="visible" transform="matrix(1 0 0 -1 0 27.95)" width="163.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS1.SSS2.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:11.83em;">
<span id="A4.SS1.SSS2.p3.pic1.1.1" class="ltx_p"><span id="A4.SS1.SSS2.p3.pic1.1.1.1" class="ltx_text" style="font-size:120%;--ltx-fg-color:#FFFFFF;">Ours (<span id="A4.SS1.SSS2.p3.pic1.1.1.1.1" class="ltx_text ltx_font_smallcaps">Prism</span>)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 12.92)"><foreignobject style="--ltx-fo-width:13.9em;--ltx-fo-height:33.03em;--ltx-fo-depth:0em;font-size:10pt;" height="457.11" overflow="visible" transform="matrix(1 0 0 -1 0 457.11)" width="192.34"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A4.SS1.SSS2.p3.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:13.9em;">
<span id="A4.SS1.SSS2.p3.pic1.p2" class="ltx_para">
<span id="A4.SS1.SSS2.p3.pic1.p2.1" class="ltx_p"><span id="A4.SS1.SSS2.p3.pic1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If it costs Charlie $10.00 to make 10 candles, then: 
<br class="ltx_break"></span></span>
<span id="A4.SS1.SSS2.p3.pic1.p2.2" class="ltx_p"><span id="A4.SS1.SSS2.p3.pic1.p2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">1. Calculate the cost of supplies for 20 candles:<span id="A4.SS1.SSS2.p3.pic1.p2.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">- Cost for 10 candles = $10.00 
<br class="ltx_break">- Cost for 20 candles = <math id="A4.SS1.SSS2.p3.pic1.m1" class="ltx_math_unparsed" alttext="\$10.00\times(20/10)=\$10.00\times 2=\$20.00" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.167em">$</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10.00</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">×</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">20</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.1389em">=</mo><mo style="--ltx-fg-color:#000000;" lspace="0.1389em" mathcolor="#000000" rspace="0.167em">$</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10.00</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">×</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.1389em">=</mo><mo style="--ltx-fg-color:#000000;" lspace="0.1389em" mathcolor="#000000" rspace="0.167em">$</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">20.00</mn></mrow><annotation encoding="application/x-tex">\$10.00\times(20/10)=\$10.00\times 2=\$20.00</annotation></semantics></math> 
<br class="ltx_break"></span></span></span>
<span id="A4.SS1.SSS2.p3.pic1.p2.3" class="ltx_p"><span id="A4.SS1.SSS2.p3.pic1.p2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">2. Calculate the selling price per candle:<span id="A4.SS1.SSS2.p3.pic1.p2.3.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">- Selling price per candle = $2.00 
<br class="ltx_break"></span></span></span>
<span id="A4.SS1.SSS2.p3.pic1.p2.4" class="ltx_p"><span id="A4.SS1.SSS2.p3.pic1.p2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">3. Calculate the net profit per candle:<span id="A4.SS1.SSS2.p3.pic1.p2.4.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">- Net profit per candle = Selling price - Cost per candle 
<br class="ltx_break">- Cost per candle = <math id="A4.SS1.SSS2.p3.pic1.m2" class="ltx_math_unparsed" alttext="\$10.00/10=\$1.00" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.167em">$</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10.00</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.1389em">=</mo><mo style="--ltx-fg-color:#000000;" lspace="0.1389em" mathcolor="#000000" rspace="0.167em">$</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1.00</mn></mrow><annotation encoding="application/x-tex">\$10.00/10=\$1.00</annotation></semantics></math> 
<br class="ltx_break">- Net profit per candle = <math id="A4.SS1.SSS2.p3.pic1.m3" class="ltx_Math" alttext="\$2.00-\$1.00=\$1.00" display="inline" intent=":literal"><semantics><mrow><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.167em">$</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2.00</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0.167em">$</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1.00</mn></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.1389em">=</mo><mrow><mo style="--ltx-fg-color:#000000;" lspace="0.1389em" mathcolor="#000000" rspace="0.167em">$</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1.00</mn></mrow></mrow><annotation encoding="application/x-tex">\$2.00-\$1.00=\$1.00</annotation></semantics></math> 
<br class="ltx_break"></span></span></span>
<span id="A4.SS1.SSS2.p3.pic1.p2.5" class="ltx_p"><span id="A4.SS1.SSS2.p3.pic1.p2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">4. Calculate the total net profit for 20 candles:<span id="A4.SS1.SSS2.p3.pic1.p2.5.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">- Total net profit = Net profit per candle <math id="A4.SS1.SSS2.p3.pic1.m4" class="ltx_Math" alttext="\times" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">×</mo><annotation encoding="application/x-tex">\times</annotation></semantics></math> Number of candles 
<br class="ltx_break">- Total net profit = <math id="A4.SS1.SSS2.p3.pic1.m5" class="ltx_math_unparsed" alttext="\$1.00\times 20=\$20.00" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.167em">$</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1.00</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">×</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">20</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.1389em">=</mo><mo style="--ltx-fg-color:#000000;" lspace="0.1389em" mathcolor="#000000" rspace="0.167em">$</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">20.00</mn></mrow><annotation encoding="application/x-tex">\$1.00\times 20=\$20.00</annotation></semantics></math> 
<br class="ltx_break"></span></span></span>
<span id="A4.SS1.SSS2.p3.pic1.p2.6" class="ltx_p"><span id="A4.SS1.SSS2.p3.pic1.p2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">The answer is: 20.</span></span>
</span>
<span id="A4.SS1.SSS2.p3.pic1.p1" class="ltx_para ltx_noindent ltx_align_center"><span class="ltx_inline-block"><svg id="A4.SS1.SSS2.p3.pic1.p1.pic1" class="ltx_picture" color="#000000" height="19.01" overflow="visible" version="1.1" viewbox="0 0 98.43 19.01" width="98.43"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,19.01) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#008000;" fill="#008000" fill-opacity="1.0"><path style="stroke:none" d="M 0 1.11 L 0 17.9 C 0 18.51 0.5 19.01 1.11 19.01 L 97.32 19.01 C 97.93 19.01 98.43 18.51 98.43 17.9 L 98.43 1.11 C 98.43 0.5 97.93 0 97.32 0 L 1.11 0 C 0.5 0 0 0.5 0 1.11 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 1.11 L 1.11 17.9 L 97.32 17.9 L 97.32 1.11 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.98 5.04)"><foreignobject style="--ltx-fo-width:5.82em;--ltx-fo-height:0.64em;--ltx-fo-depth:0em;font-size:10pt;" height="8.92" overflow="visible" transform="matrix(1 0 0 -1 0 8.92)" width="80.53"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS1.SSS2.p3.pic1.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:5.82em;">
<span id="A4.SS1.SSS2.p3.pic1.p1.pic1.1.1" class="ltx_p ltx_align_center"><span id="A4.SS1.SSS2.p3.pic1.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#008000;">20</span></span>
</span></span></span></foreignobject></g></g></svg>