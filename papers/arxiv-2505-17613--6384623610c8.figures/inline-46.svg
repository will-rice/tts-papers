<span id="A5.F50.pic1.2.1" class="ltx_p ltx_minipage ltx_align_middle" style="width:314.8pt;"><span id="A5.F50.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Instruction</span><span id="A5.F50.pic1.2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Create a speech on the internet revolution, making sure the word &quot;digital&quot; is used at least twice.</span></span>
