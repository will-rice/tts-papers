<svg id="S4.SS2.SSS0.Px1.p3.pic1" class="ltx_picture" height="222.96" overflow="visible" version="1.1" viewbox="0 0 477.38 222.96" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,222.96) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 222.96 L 477.38 222.96 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 222.96 L 477.38 222.96 L 477.38 0 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 5.32 8.01)"><foreignobject style="--ltx-fo-width:33.73em;--ltx-fo-height:15.15em;--ltx-fo-depth:0.19em;font-size:10pt;" height="212.32" overflow="visible" transform="matrix(1 0 0 -1 0 209.63)" width="466.73"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S4.SS2.SSS0.Px1.p3.pic1.1" class="ltx_inline-sectional-block ltx_minipage">
                      
<section id="S4.SS2.SSS0.Px2" class="ltx_paragraph">
<h4 class="ltx_title ltx_title_paragraph" style="--ltx-fg-color:#000000;">Intuition.</h4>

<span id="S4.SS2.SSS0.Px2.p1" class="ltx_para">
<span id="S4.SS2.SSS0.Px2.p1.1" class="ltx_p"><span id="S4.SS2.SSS0.Px2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Theorem </span><a href="#S4.Thmtheorem2" title="Theorem 4.2. ‣ Overview. ‣ 4.2 Multi-view disentanglement with diffusion models ‣ 4 Theory: diffusion model-based disentanglement ‣ Can Diffusion Models Disentangle?A Theoretical Perspective" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">4.2</span></a><span id="S4.SS2.SSS0.Px2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> establishes that in the multi-view setting, DMs can achieve </span><math id="S4.SS2.SSS0.Px2.p1.m1" class="ltx_Math" alttext="(\epsilon,\nu)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϵ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ν</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(\epsilon,\nu)</annotation></semantics></math><span id="S4.SS2.SSS0.Px2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">-disentanglement and </span><math id="S4.SS2.SSS0.Px2.p1.m2" class="ltx_Math" alttext="\epsilon" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϵ</mi><annotation encoding="application/x-tex">\epsilon</annotation></semantics></math><span id="S4.SS2.SSS0.Px2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">-editability with vanishingly small </span><math id="S4.SS2.SSS0.Px2.p1.m3" class="ltx_Math" alttext="\epsilon" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϵ</mi><annotation encoding="application/x-tex">\epsilon</annotation></semantics></math><span id="S4.SS2.SSS0.Px2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">, even though </span><math id="S4.SS2.SSS0.Px2.p1.m4" class="ltx_Math" alttext="\nu" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ν</mi><annotation encoding="application/x-tex">\nu</annotation></semantics></math><span id="S4.SS2.SSS0.Px2.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> cannot be made arbitrarily small. In other words, perfect separation of content and style is theoretically achievable in terms of independence and editability, even if some information loss is unavoidable. The editability error depends on the Lipschitz constant of the decoder, the intrinsic data variance, and the latent dimensionality—factors that all amplify sensitivity to noise. To mitigate this, we introduce a </span><span id="S4.SS2.SSS0.Px2.p1.1.7" class="ltx_text" style="--ltx-fg-color:#006400;">style information regularizer</span><span id="S4.SS2.SSS0.Px2.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">, which suppresses content leakage into the style encoder. This prevents entanglement and enables reliable &quot;mix-and-match&quot; generation. Without this regularization, residual content in the style embedding can undermine both disentanglement and editing performance.</span></span>
</span>
</section>
                    </span></span></span></foreignobject></g></g></svg>