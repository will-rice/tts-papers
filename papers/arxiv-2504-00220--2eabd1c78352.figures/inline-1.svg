<svg id="S3.SS0.SSS0.Px2.p4.pic1" class="ltx_picture" height="122.64" overflow="visible" version="1.1" viewbox="0 0 477.38 122.64" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,122.64) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 122.64 L 477.38 122.64 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 122.64 L 477.38 122.64 L 477.38 0 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 5.32 107.64)"><foreignobject style="--ltx-fo-width:33.73em;--ltx-fo-height:0.7em;--ltx-fo-depth:7.39em;font-size:10pt;" height="112" overflow="visible" transform="matrix(1 0 0 -1 0 9.69)" width="466.73"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S3.SS0.SSS0.Px2.p4.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:33.73em;">
<span id="Thmexample1" class="ltx_theorem ltx_theorem_example">
<h6 class="ltx_title ltx_runin ltx_title_theorem" style="--ltx-fg-color:#000000;"><span class="ltx_tag ltx_tag_theorem"><span id="Thmexample1.2" class="ltx_text ltx_font_bold">Example 1</span></span><span id="Thmexample1.3" class="ltx_text ltx_font_bold">.</span></h6>
<span id="Thmexample1.p1" class="ltx_para">
<span id="Thmexample1.p1.1" class="ltx_p"><span id="Thmexample1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Suppose content <math id="Thmexample1.p1.m1" class="ltx_Math" alttext="Z\sim{\mathcal{N}}(0,1)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Z</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∼</mo><mrow><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒩</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">Z\sim{\mathcal{N}}(0,1)</annotation></semantics></math> and <math id="Thmexample1.p1.m2" class="ltx_Math" alttext="G\sim{\mathcal{N}}(0,1)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">G</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∼</mo><mrow><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒩</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">G\sim{\mathcal{N}}(0,1)</annotation></semantics></math> are independent standard Gaussian r.v.’s and consider the noiseless setting with <math id="Thmexample1.p1.m3" class="ltx_Math" alttext="\delta=0" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">δ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><annotation encoding="application/x-tex">\delta=0</annotation></semantics></math>. Further, suppose <math id="Thmexample1.p1.m4" class="ltx_Math" alttext="p_{f(Z,G)|Z}\not\equiv p_{f(-Z,G)|Z}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Z</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">G</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000">|</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Z</mi></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≢</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Z</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">G</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000">|</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Z</mi></mrow></msub></mrow><annotation encoding="application/x-tex">p_{f(Z,G)|Z}\not\equiv p_{f(-Z,G)|Z}</annotation></semantics></math>. Then we can choose the content/style encodings to be <math id="Thmexample1.p1.m5" class="ltx_Math" alttext="{\hat{Z}}=Z\text{sgn}(G)" display="inline" intent=":literal"><semantics><mrow><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Z</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Z</mi><mo lspace="0em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_italic" mathcolor="#000000">sgn</mtext><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">G</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">{\hat{Z}}=Z\text{sgn}(G)</annotation></semantics></math>, <math id="Thmexample1.p1.m6" class="ltx_Math" alttext="{\hat{G}}=G" display="inline" intent=":literal"><semantics><mrow><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">G</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">G</mi></mrow><annotation encoding="application/x-tex">{\hat{G}}=G</annotation></semantics></math> and the decoder <math id="Thmexample1.p1.m7" class="ltx_Math" alttext="\hat{f}({\hat{Z}},{\hat{G}})=f({\hat{Z}}\text{sgn}({\hat{G}}),{\hat{G}})," display="inline" intent=":literal"><semantics><mrow><mrow><mrow><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Z</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">G</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Z</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><mo lspace="0em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_italic" mathcolor="#000000">sgn</mtext><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">G</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">G</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo></mrow><annotation encoding="application/x-tex">\hat{f}({\hat{Z}},{\hat{G}})=f({\hat{Z}}\text{sgn}({\hat{G}}),{\hat{G}}),</annotation></semantics></math> where <math id="Thmexample1.p1.m8" class="ltx_Math" alttext="\text{sgn}(x)" display="inline" intent=":literal"><semantics><mrow><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_italic" mathcolor="#000000">sgn</mtext><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\text{sgn}(x)</annotation></semantics></math> denotes the sign of <math id="Thmexample1.p1.m9" class="ltx_Math" alttext="x" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><annotation encoding="application/x-tex">x</annotation></semantics></math>. Then <math id="Thmexample1.p1.m10" class="ltx_Math" alttext="({\hat{Z}},{\hat{G}})" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Z</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">G</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">({\hat{Z}},{\hat{G}})</annotation></semantics></math> are (0,0)-disentangled but not <math id="Thmexample1.p1.m11" class="ltx_Math" alttext="\epsilon" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϵ</mi><annotation encoding="application/x-tex">\epsilon</annotation></semantics></math>-editable for some <math id="Thmexample1.p1.m12" class="ltx_Math" alttext="\epsilon&gt;0." display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϵ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">\epsilon&gt;0.</annotation></semantics></math></span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>