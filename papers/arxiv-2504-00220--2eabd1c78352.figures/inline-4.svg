<svg id="S4.SS3.SSS0.Px1.p4.pic1" class="ltx_picture" height="239.57" overflow="visible" version="1.1" viewbox="0 0 477.38 239.57" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,239.57) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 239.57 L 477.38 239.57 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 239.57 L 477.38 239.57 L 477.38 0 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 5.32 8.01)"><foreignobject style="--ltx-fo-width:33.73em;--ltx-fo-height:16.35em;--ltx-fo-depth:0.19em;font-size:10pt;" height="228.93" overflow="visible" transform="matrix(1 0 0 -1 0 226.24)" width="466.73"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S4.SS3.SSS0.Px1.p4.pic1.1" class="ltx_inline-sectional-block ltx_minipage">
                      
<section id="S4.SS3.SSS0.Px2" class="ltx_paragraph">
<h4 class="ltx_title ltx_title_paragraph" style="--ltx-fg-color:#000000;">Intuition.</h4>

<span id="S4.SS3.SSS0.Px2.p1" class="ltx_para">
<span id="S4.SS3.SSS0.Px2.p1.1" class="ltx_p"><span id="S4.SS3.SSS0.Px2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Theorem </span><a href="#S4.Thmtheorem5" title="Theorem 4.5. ‣ Overview. ‣ 4.3 Disentanglement of independent subspaces with diffusion models ‣ 4 Theory: diffusion model-based disentanglement ‣ Can Diffusion Models Disentangle?A Theoretical Perspective" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">4.5</span></a><span id="S4.SS3.SSS0.Px2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> shows that for ISMs, a DM trained with gradient descent can recover the content and style subspaces as the number of samples </span><math id="S4.SS3.SSS0.Px2.p1.m1" class="ltx_Math" alttext="n\to\infty" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">∞</mi></mrow><annotation encoding="application/x-tex">n\to\infty</annotation></semantics></math><span id="S4.SS3.SSS0.Px2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">. This enables both approximate </span><math id="S4.SS3.SSS0.Px2.p1.m2" class="ltx_Math" alttext="(\epsilon,\nu)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϵ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ν</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(\epsilon,\nu)</annotation></semantics></math><span id="S4.SS3.SSS0.Px2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">-disentanglement and </span><math id="S4.SS3.SSS0.Px2.p1.m3" class="ltx_Math" alttext="\epsilon^{\prime}" display="inline" intent=":literal"><semantics><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϵ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">′</mo></msup><annotation encoding="application/x-tex">\epsilon^{\prime}</annotation></semantics></math><span id="S4.SS3.SSS0.Px2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">-editability. A key component is the </span><span id="S4.SS3.SSS0.Px2.p1.1.6" class="ltx_text" style="--ltx-fg-color:#006400;">style guidance regularizer</span><span id="S4.SS3.SSS0.Px2.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">, which encourages the model to separate content and style by encouraging the model to use the style information during </span><span id="S4.SS3.SSS0.Px2.p1.1.8" class="ltx_text" style="--ltx-fg-color:#BF8040;">score matching</span><span id="S4.SS3.SSS0.Px2.p1.1.9" class="ltx_text" style="--ltx-fg-color:#000000;">. Importantly, the speed and quality of subspace recovery depend on the strength of the signal in the score function. In particular, recovery is faster when the content and style score functions have larger minimum singular value. This highlights a practical consideration: well-separated or high-contrast latent factors lead to more reliable disentanglement, while near-degenerate cases may require additional regularization or supervision.</span></span>
</span>
</section>
                    </span></span></span></foreignobject></g></g></svg>