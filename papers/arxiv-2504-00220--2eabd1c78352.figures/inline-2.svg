<svg id="S4.SS1.SSS0.Px1.p3.pic1" class="ltx_picture" height="173.15" overflow="visible" version="1.1" viewbox="0 0 477.38 173.15" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,173.15) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 173.15 L 477.38 173.15 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 173.15 L 477.38 173.15 L 477.38 0 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 5.32 8.01)"><foreignobject style="--ltx-fo-width:33.73em;--ltx-fo-height:11.55em;--ltx-fo-depth:0.19em;font-size:10pt;" height="162.51" overflow="visible" transform="matrix(1 0 0 -1 0 159.82)" width="466.73"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S4.SS1.SSS0.Px1.p3.pic1.1" class="ltx_inline-sectional-block ltx_minipage">
                      
<section id="S4.SS1.SSS0.Px2" class="ltx_paragraph">
<h4 class="ltx_title ltx_title_paragraph" style="--ltx-fg-color:#000000;">Intuition.</h4>

<span id="S4.SS1.SSS0.Px2.p1" class="ltx_para">
<span id="S4.SS1.SSS0.Px2.p1.1" class="ltx_p"><span id="S4.SS1.SSS0.Px2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Theorem </span><a href="#S4.Thmtheorem1" title="Theorem 4.1. ‣ Overview. ‣ 4.1 Content disentanglement with diffusion models ‣ 4 Theory: diffusion model-based disentanglement ‣ Can Diffusion Models Disentangle?A Theoretical Perspective" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">4.1</span></a><span id="S4.SS1.SSS0.Px2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> shows that under sub-gaussian tail assumptions and Lipschitz-continuous scores, DM can achieve </span><math id="S4.SS1.SSS0.Px2.p1.m1" class="ltx_Math" alttext="(\epsilon,\nu)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϵ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ν</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(\epsilon,\nu)</annotation></semantics></math><span id="S4.SS1.SSS0.Px2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">-disentanglement with </span><math id="S4.SS1.SSS0.Px2.p1.m2" class="ltx_Math" alttext="(\epsilon,\nu)\rightarrow 0" display="inline" intent=":literal"><semantics><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϵ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ν</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><annotation encoding="application/x-tex">(\epsilon,\nu)\rightarrow 0</annotation></semantics></math><span id="S4.SS1.SSS0.Px2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> as the noise level </span><math id="S4.SS1.SSS0.Px2.p1.m3" class="ltx_Math" alttext="\delta\rightarrow 0." display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">δ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">\delta\rightarrow 0.</annotation></semantics></math><span id="S4.SS1.SSS0.Px2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> The rate at which disentanglement improves depends inversely on the Lipschitz constant — higher sensitivity in the score function slows disentanglement by amplifying noise-induced variations. The regularized objective mitigates this trading off between </span><span id="S4.SS1.SSS0.Px2.p1.1.6" class="ltx_text" style="--ltx-fg-color:#BF8040;">predictive power</span><span id="S4.SS1.SSS0.Px2.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> and the amount of </span><span id="S4.SS1.SSS0.Px2.p1.1.8" class="ltx_text" style="--ltx-fg-color:#0000FF;">content information</span><span id="S4.SS1.SSS0.Px2.p1.1.9" class="ltx_text" style="--ltx-fg-color:#000000;"> retained in the content encoding </span><math id="S4.SS1.SSS0.Px2.p1.m4" class="ltx_Math" alttext="{\hat{Z}}." display="inline" intent=":literal"><semantics><mrow><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Z</mi><mo>^</mo></mover><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">{\hat{Z}}.</annotation></semantics></math></span>
</span>
</section>
                    </span></span></span></foreignobject></g></g></svg>