<span id="S2.p4.pic1.2.1" class="ltx_p"><span id="S2.p4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Advanced test-time strategies shift evaluation from token-centric metrics (e.g., perplexity, latency) to <span id="S2.p4.pic1.2.1.1.1" class="ltx_text ltx_font_italic">task-level throughput</span>—the number of tasks completed per unit time. This shift is especially relevant for reasoning tasks, where intermediate steps may vary widely depending on the strategy, yet the ultimate utility hinges almost entirely on the correctness of the final output. In contrast, traditional tasks like chat completions focus on token-level quality and throughput.</span></span>
</span></span></span></foreignobject></g></g></svg>