<span class="ltx_theorem ltx_theorem_finding" id="Thmfinding2">
<h6 class="ltx_title ltx_runin ltx_title_theorem" style="font-size:90%;">
<span class="ltx_tag ltx_tag_theorem"><span class="ltx_text ltx_font_bold">Finding 2</span></span><span class="ltx_text ltx_font_bold">.</span>
</h6>
<span class="ltx_para" id="Thmfinding2.p1">
<span class="ltx_p"><span class="ltx_text ltx_font_bold ltx_font_italic" style="font-size:90%;">Three Progressively Related Atomic Capabilities in Visual Verification<span class="ltx_text ltx_font_medium"></span></span></span>
<span class="ltx_itemize" id="S4.I1">
<span class="ltx_item" id="S4.I1.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S4.I1.i1.p1">
<span class="ltx_p"><span class="ltx_text ltx_font_bold ltx_font_italic" style="font-size:90%;">Explicit Alignment</span><span class="ltx_text ltx_font_italic" style="font-size:90%;">: text and image contain directly matchable elements.</span></span>
</span></span>
<span class="ltx_item" id="S4.I1.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S4.I1.i2.p1">
<span class="ltx_p"><span class="ltx_text ltx_font_bold ltx_font_italic" style="font-size:90%;">Relational Verification</span><span class="ltx_text ltx_font_italic" style="font-size:90%;">: requires using text to verify relationships or perform light reasoning, beyond simple visual matching.</span></span>
</span></span>
<span class="ltx_item" id="S4.I1.i3" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S4.I1.i3.p1">
<span class="ltx_p"><span class="ltx_text ltx_font_bold ltx_font_italic" style="font-size:90%;">Integrative Reasoning</span><span class="ltx_text ltx_font_italic" style="font-size:90%;">: involves holistic interaction between prompt and image for complex or higher-order reasoning.</span></span>
</span></span>
</span>
<span class="ltx_p"><span class="ltx_text ltx_font_italic" style="font-size:90%;">These capabilities form a layered structure, from perceptual to semantic-relational, and finally to task-level reasoning.</span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>