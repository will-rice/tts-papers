<span class="ltx_theorem ltx_theorem_finding" id="Thmfinding3">
<h6 class="ltx_title ltx_runin ltx_title_theorem" style="font-size:90%;">
<span class="ltx_tag ltx_tag_theorem"><span class="ltx_text ltx_font_bold">Finding 3</span></span><span class="ltx_text ltx_font_bold">.</span>
</h6>
<span class="ltx_para" id="Thmfinding3.p1">
<span class="ltx_p"><span class="ltx_text ltx_font_bold ltx_font_italic" style="font-size:90%;">Generalization of Three Visual Verification Atomic Capabilities</span></span>
</span>
<span class="ltx_para" id="Thmfinding3.p2">
<span class="ltx_p"><span class="ltx_text ltx_font_italic" style="font-size:90%;">Reinforcement learning promotes strong generalization within and between Explicit Alignment and Relational Verification, suggesting that a single dataset capturing their shared visual patterns suffices for broad transfer. In contrast, Integrative Reasoning spans heterogeneous domains with little cross-task transfer, thus requiring task-specific datasets.</span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>