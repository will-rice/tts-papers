<svg id="A1.p2.pic1" class="ltx_picture" height="1416.05" overflow="visible" version="1.1" viewbox="0 0 687.5 1416.05" width="687.5"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1416.05) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#CCCCCC;" fill="#CCCCCC" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.43 L 0 1407.62 C 0 1412.28 3.77 1416.05 8.43 1416.05 L 679.07 1416.05 C 683.73 1416.05 687.5 1412.28 687.5 1407.62 L 687.5 8.43 C 687.5 3.77 683.73 0 679.07 0 L 8.43 0 C 3.77 0 0 3.77 0 8.43 Z" /></g><g style="--ltx-fill-color:#FAFAFA;" fill="#FAFAFA" fill-opacity="1.0"><path style="stroke:none" d="M 0.55 8.43 L 0.55 1407.62 C 0.55 1411.97 4.08 1415.5 8.43 1415.5 L 679.07 1415.5 C 683.42 1415.5 686.95 1411.97 686.95 1407.62 L 686.95 8.43 C 686.95 4.08 683.42 0.55 679.07 0.55 L 8.43 0.55 C 4.08 0.55 0.55 4.08 0.55 8.43 Z" /></g><g style="--ltx-stroke-color:#737373;--ltx-fill-color:#737373;--ltx-fg-color:#737373;" color="#737373" fill="#737373" stroke="#737373" stroke-width="2.0pt"><path style="fill:none" d="M 1.38 1416.05 L 1.38 0" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 18.33 21.02)"><foreignobject style="--ltx-fo-width:47.04em;--ltx-fo-height:99.5em;--ltx-fo-depth:0.19em;font-size:10pt;" height="1379.41" overflow="visible" transform="matrix(1 0 0 -1 0 1376.72)" width="650.9"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.p2.pic1.1" class="ltx_inline-sectional-block ltx_minipage">
                  
<span id="A1.p2.pic1.p1" class="ltx_para">
<span id="A1.p2.pic1.p1.1" class="ltx_p"><span id="A1.p2.pic1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please read the following information carefully.</span></span>
</span>
                  
<section id="A1.SSx1" class="ltx_subsection">
<h3 class="ltx_title ltx_title_subsection" style="--ltx-fg-color:#000000;">Purpose of the Study</h3>

<span id="A1.SSx1.p1" class="ltx_para">
<span id="A1.SSx1.p1.1" class="ltx_p"><span id="A1.SSx1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">This study aims to collect short video responses to create a research dataset for developing and evaluating deepfake detection systems. Deepfakes are videos that have been digitally altered to change a person’s face, voice, expressions, or what they are saying using artificial intelligence.</span></span>
</span>
<span id="A1.SSx1.p2" class="ltx_para">
<span id="A1.SSx1.p2.1" class="ltx_p"><span id="A1.SSx1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">In this project, we will generate benign deepfake videos purely for academic purposes. These generated videos will not depict misleading, harmful, or inappropriate content.</span></span>
</span>
<span id="A1.SSx1.p3" class="ltx_para">
<span id="A1.SSx1.p3.1" class="ltx_p"><span id="A1.SSx1.p3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your participation will help ensure that future deepfake detection systems are fair, accurate, and effective across different genders, skin tones, languages, and cultural backgrounds.</span></span>
</span>
</section>
                  
<section id="A1.SSx2" class="ltx_subsection">
<h3 class="ltx_title ltx_title_subsection" style="--ltx-fg-color:#000000;">What You’ll Do</h3>

<span id="A1.SSx2.p1" class="ltx_para">
<span id="A1.SSx2.p1.1" class="ltx_p"><span id="A1.SSx2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">During the study, you will interact with a chat-like interface that presents a series of prompts. For each prompt, you will record a short video response (including both video and audio) using your camera and microphone.</span></span>
</span>
<span id="A1.SSx2.p2" class="ltx_para">
<span id="A1.SSx2.p2.1" class="ltx_p"><span id="A1.SSx2.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">There are three types of recordings you will be asked to make:</span></span>
</span>
<span id="A1.SSx2.p3" class="ltx_para">
<span id="A1.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="A1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I1.i1.p1" class="ltx_para">
<span id="A1.I1.i1.p1.1" class="ltx_p"><span id="A1.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Reading Aloud:</span><span id="A1.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> You will be shown short pieces of text, such as a sentence, a few sentences, or a short paragraph, and asked to record yourself reading them aloud.</span></span>
</span></span>
<span id="A1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I1.i2.p1" class="ltx_para">
<span id="A1.I1.i2.p1.1" class="ltx_p"><span id="A1.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Question Answering:</span><span id="A1.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> You will be asked simple, general questions (e.g., about hobbies, daily activities, or opinions on neutral topics) and record your spoken responses.</span></span>
</span></span>
<span id="A1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I1.i3.p1" class="ltx_para">
<span id="A1.I1.i3.p1.1" class="ltx_p"><span id="A1.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Action Prompts:</span><span id="A1.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> You will be asked to perform simple gestures (such as nodding, turning your head, or gesturing with your hands) or show a natural facial expression (such as smiling) while speaking a short phrase.</span></span>
</span></span>
</span>
</span>
<span id="A1.SSx2.p4" class="ltx_para">
<span id="A1.SSx2.p4.1" class="ltx_p"><span id="A1.SSx2.p4.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">All texts, questions, and actions are carefully designed to be neutral and non-offensive. You are not required to share personal or truthful information and may freely invent responses if you prefer.</span></span>
</span>
</section>
                  
<section id="A1.SSx3" class="ltx_subsection">
<h3 class="ltx_title ltx_title_subsection" style="--ltx-fg-color:#000000;">Use of Public-Domain Texts</h3>

<span id="A1.SSx3.p1" class="ltx_para">
<span id="A1.SSx3.p1.1" class="ltx_p"><span id="A1.SSx3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Some reading-aloud prompts are taken from books in the public domain. Whenever a sentence or passage originates from such a source, the title of the book will be displayed alongside the text.</span></span>
</span>
<span id="A1.SSx3.p2" class="ltx_para">
<span id="A1.SSx3.p2.1" class="ltx_p"><span id="A1.SSx3.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If you encounter a sentence or passage that you believe is inappropriate, outdated, or otherwise problematic, you may flag it within the interface. All flagged items will be reviewed and, if deemed inappropriate, removed from future versions of the study.</span></span>
</span>
</section>
                  
<section id="A1.SSx4" class="ltx_subsection">
<h3 class="ltx_title ltx_title_subsection" style="--ltx-fg-color:#000000;">Privacy and Data Collection</h3>

<span id="A1.SSx4.p1" class="ltx_para">
<span id="A1.SSx4.p1.1" class="ltx_p"><span id="A1.SSx4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">We process your data in accordance with the General Data Protection Regulation (GDPR).</span></span>
</span>
<span id="A1.SSx4.p2" class="ltx_para">
<span id="A1.SSx4.p2.1" class="ltx_p"><span id="A1.SSx4.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your video responses will be recorded and stored securely on our local servers. The collected and generated data will only be made available to vetted researchers upon request and will be used exclusively for research purposes.</span></span>
</span>
<section id="A1.SSx4.SSS0.Px1" class="ltx_paragraph">
<h4 class="ltx_title ltx_title_paragraph" style="--ltx-fg-color:#000000;">Data Collected</h4>

<span id="A1.SSx4.SSS0.Px1.p1" class="ltx_para">
<span id="A1.I2" class="ltx_itemize ltx_leftmargin_flush">
<span id="A1.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i1.p1" class="ltx_para">
<span id="A1.I2.i1.p1.1" class="ltx_p"><span id="A1.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Video and audio recordings</span></span>
</span></span>
<span id="A1.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i2.p1" class="ltx_para">
<span id="A1.I2.i2.p1.1" class="ltx_p"><span id="A1.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Demographic information (e.g., age, gender, ethnicity, language proficiency)</span></span>
</span></span>
<span id="A1.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i3.p1" class="ltx_para">
<span id="A1.I2.i3.p1.1" class="ltx_p"><span id="A1.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Device information (microphone and webcam characteristics)</span></span>
</span></span>
</span>
</span>
</section>
</section>
                  
<section id="A1.SSx5" class="ltx_subsection">
<h3 class="ltx_title ltx_title_subsection" style="--ltx-fg-color:#000000;">Risks Associated with Participation</h3>

<span id="A1.SSx5.p1" class="ltx_para">
<span id="A1.SSx5.p1.1" class="ltx_p"><span id="A1.SSx5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Although all data will be handled with care, there is a small risk of data misuse, such as unauthorized redistribution or manipulation of the dataset.</span></span>
</span>
<span id="A1.SSx5.p2" class="ltx_para">
<span id="A1.SSx5.p2.1" class="ltx_p"><span id="A1.SSx5.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To minimize these risks, dataset distribution is governed by a strict license agreement that:</span></span>
</span>
<span id="A1.SSx5.p3" class="ltx_para">
<span id="A1.I3" class="ltx_itemize ltx_leftmargin_flush">
<span id="A1.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I3.i1.p1" class="ltx_para">
<span id="A1.I3.i1.p1.1" class="ltx_p"><span id="A1.I3.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Restricts the use of recordings and generated data to academic, non-commercial research.</span></span>
</span></span>
<span id="A1.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I3.i2.p1" class="ltx_para">
<span id="A1.I3.i2.p1.1" class="ltx_p"><span id="A1.I3.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Prohibits redistribution, resale, or repurposing outside approved research contexts.</span></span>
</span></span>
<span id="A1.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I3.i3.p1" class="ltx_para">
<span id="A1.I3.i3.p1.1" class="ltx_p"><span id="A1.I3.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Requires proper attribution and compliance with ethical guidelines.</span></span>
</span></span>
</span>
</span>
<span id="A1.SSx5.p4" class="ltx_para">
<span id="A1.SSx5.p4.1" class="ltx_p"><span id="A1.SSx5.p4.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">In addition, all data will be stored securely and access will be limited to authorized researchers. While these safeguards substantially reduce the likelihood of misuse, no system can provide an absolute guarantee against unauthorized use once data have been shared.</span></span>
</span>
</section>
                  
<section id="A1.SSx6" class="ltx_subsection">
<h3 class="ltx_title ltx_title_subsection" style="--ltx-fg-color:#000000;">Your Rights</h3>

<span id="A1.SSx6.p1" class="ltx_para">
<span id="A1.SSx6.p1.1" class="ltx_p"><span id="A1.SSx6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Participation in this study is entirely voluntary. You may stop participating at any time or withdraw your consent at a later stage without penalty or disadvantage.</span></span>
</span>
<span id="A1.SSx6.p2" class="ltx_para">
<span id="A1.SSx6.p2.1" class="ltx_p"><span id="A1.SSx6.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">It is important to distinguish between stopping participation before completing the survey and withdrawing consent after completion.</span></span>
</span>
<section id="A1.SSx6.SSS0.Px1" class="ltx_paragraph">
<h4 class="ltx_title ltx_title_paragraph" style="--ltx-fg-color:#000000;">1. If you stop participating during the survey</h4>

<span id="A1.SSx6.SSS0.Px1.p1" class="ltx_para">
<span id="A1.I4" class="ltx_itemize ltx_leftmargin_flush">
<span id="A1.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i1.p1" class="ltx_para">
<span id="A1.I4.i1.p1.1" class="ltx_p"><span id="A1.I4.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You may exit the survey at any point before submitting your final responses.</span></span>
</span></span>
<span id="A1.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i2.p1" class="ltx_para">
<span id="A1.I4.i2.p1.1" class="ltx_p"><span id="A1.I4.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Any recordings made up to that point will be permanently deleted.</span></span>
</span></span>
<span id="A1.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I4.i3.p1" class="ltx_para">
<span id="A1.I4.i3.p1.1" class="ltx_p"><span id="A1.I4.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">No data from an incomplete session will be used for research purposes.</span></span>
</span></span>
</span>
</span>
</section>
<section id="A1.SSx6.SSS0.Px2" class="ltx_paragraph">
<h4 class="ltx_title ltx_title_paragraph" style="--ltx-fg-color:#000000;">2. If you withdraw your consent after completing the survey</h4>

<span id="A1.SSx6.SSS0.Px2.p1" class="ltx_para">
<span id="A1.I5" class="ltx_itemize ltx_leftmargin_flush">
<span id="A1.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I5.i1.p1" class="ltx_para">
<span id="A1.I5.i1.p1.1" class="ltx_p"><span id="A1.I5.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You may request the removal of your data from our storage at any time.</span></span>
</span></span>
<span id="A1.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I5.i2.p1" class="ltx_para">
<span id="A1.I5.i2.p1.1" class="ltx_p"><span id="A1.I5.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your data will not be included in future releases of the dataset.</span></span>
</span></span>
<span id="A1.I5.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I5.i3.p1" class="ltx_para">
<span id="A1.I5.i3.p1.1" class="ltx_p"><span id="A1.I5.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">However, if the dataset has already been distributed to approved researchers, we cannot guarantee that previously distributed copies can be recalled or modified.</span></span>
</span></span>
</span>
</span>
<span id="A1.SSx6.SSS0.Px2.p2" class="ltx_para">
<span id="A1.SSx6.SSS0.Px2.p2.1" class="ltx_p"><span id="A1.SSx6.SSS0.Px2.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You have the right to know which data concerning you have been stored and to request correction or deletion where applicable. As noted above, we can only guarantee that future releases of the dataset will reflect deletion or correction requests.</span></span>
</span>
<span id="A1.SSx6.SSS0.Px2.p3" class="ltx_para">
<span id="A1.SSx6.SSS0.Px2.p3.1" class="ltx_p"><span id="A1.SSx6.SSS0.Px2.p3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">In case of disagreement, you have the right to lodge a complaint with the Data Protection Officer.</span></span>
</span>
</section>
</section>
                  
<section id="A1.SSx7" class="ltx_subsection">
<h3 class="ltx_title ltx_title_subsection" style="--ltx-fg-color:#000000;">Time Commitment</h3>

<span id="A1.SSx7.p1" class="ltx_para">
<span id="A1.SSx7.p1.1" class="ltx_p"><span id="A1.SSx7.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">This survey takes approximately 40 minutes to complete.</span></span>
</span>
</section>
                </span></span></span></foreignobject></g></g></svg>