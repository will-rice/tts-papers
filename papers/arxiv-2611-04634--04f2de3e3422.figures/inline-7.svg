<span id="S1.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.8em;">
<span id="S1.p4.pic1.1.1" class="ltx_p"><span id="S1.p4.pic1.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Key results</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.84 534.03)"><foreignobject style="--ltx-fo-width:47.95em;--ltx-fo-height:1.63em;--ltx-fo-depth:37.65em;font-size:10pt;" height="543.45" overflow="visible" transform="matrix(1 0 0 -1 0 22.49)" width="663.49"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S1.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.95em;">
<span id="S1.I2" class="ltx_itemize" style="--ltx-enum-leftmargin:1.4em;">
<span id="S1.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="S1.I2.i1.m1" class="ltx_Math" alttext="\blacktriangleright" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000F46;" mathcolor="#000F46">▶</mo><annotation encoding="application/x-tex">\blacktriangleright</annotation></semantics></math></span> 
<span id="S1.I2.i1.p1" class="ltx_para">
<span id="S1.I2.i1.p1.1" class="ltx_p"><span id="S1.I2.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Best open-weight detector.</span><span id="S1.I2.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> On the 14 Speech-DF-Arena sets, </span><span id="S1.I2.i1.p1.1.3" class="ltx_text ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">VeriSpoof-Plus</span><span id="S1.I2.i1.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> reaches 2.14% pooled and
1.79% mean EER (third of 28 systems on the public snapshot), and </span><span id="S1.I2.i1.p1.1.5" class="ltx_text ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">VeriSpoof-Base</span><span id="S1.I2.i1.p1.1.6" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">, trained on 0.38 M utterances
of official training splits, 4.43%; the best other open-weight system reaches 9.52%
(§</span><a href="#S6.SS1" title="6.1 Detection on public benchmarks ‣ 6 Results" class="ltx_ref" style="font-size:90%;--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">6.1</span></a><span id="S1.I2.i1.p1.1.7" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">).</span></span>
</span></span>
<span id="S1.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="S1.I2.i2.m1" class="ltx_Math" alttext="\blacktriangleright" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000F46;" mathcolor="#000F46">▶</mo><annotation encoding="application/x-tex">\blacktriangleright</annotation></semantics></math></span> 
<span id="S1.I2.i2.p1" class="ltx_para">
<span id="S1.I2.i2.p1.1" class="ltx_p"><span id="S1.I2.i2.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">The same weights verify sources.</span><span id="S1.I2.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> For pairs from generators unseen in training, </span><span id="S1.I2.i2.p1.1.3" class="ltx_text ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">VeriSpoof-Plus</span><span id="S1.I2.i2.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> decides
whether they share a source at 6.2% EER for new models of known architectures and 15.0% for new
architectures, against 26.5 and 24.8% for a pair probe on a frozen anti-spoofing encoder; general audio LLMs
answer near chance (§</span><a href="#S6.SS2" title="6.2 Source verification and attribution ‣ 6 Results" class="ltx_ref" style="font-size:90%;--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">6.2</span></a><span id="S1.I2.i2.p1.1.5" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">).</span></span>
</span></span>
<span id="S1.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="S1.I2.i3.m1" class="ltx_Math" alttext="\blacktriangleright" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000F46;" mathcolor="#000F46">▶</mo><annotation encoding="application/x-tex">\blacktriangleright</annotation></semantics></math></span> 
<span id="S1.I2.i3.p1" class="ltx_para">
<span id="S1.I2.i3.p1.1" class="ltx_p"><span id="S1.I2.i3.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Representation decides detection, the LLM decides comparison.</span><span id="S1.I2.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> With the encoder fixed, how its
features are used lowers ASVspoof 5 EER from 9.6 to 3.1% while source verification stays at 16–19%;
swapping the LLM moves detection by 0.5 points and source verification by 5.5 (§</span><a href="#S6.SS3" title="6.3 What determines what the model perceives ‣ 6 Results" class="ltx_ref" style="font-size:90%;--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">6.3</span></a><span id="S1.I2.i3.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">).</span></span>
</span></span>
<span id="S1.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="S1.I2.i4.m1" class="ltx_Math" alttext="\blacktriangleright" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000F46;" mathcolor="#000F46">▶</mo><annotation encoding="application/x-tex">\blacktriangleright</annotation></semantics></math></span> 
<span id="S1.I2.i4.p1" class="ltx_para">
<span id="S1.I2.i4.p1.1" class="ltx_p"><span id="S1.I2.i4.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Source labels are necessary for neural-codec fakes.</span><span id="S1.I2.i4.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> At a matched number of authenticity labels,
source supervision helps on 8 of 16 sets and hurts on one; with five times more authenticity labels instead,
CodecFake+ EER stays at 12.6 against 2.2% (§</span><a href="#S6.SS5" title="6.5 Does knowing the source help detection? ‣ 6 Results" class="ltx_ref" style="font-size:90%;--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">6.5</span></a><span id="S1.I2.i4.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">).</span></span>
</span></span>
<span id="S1.I2.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="S1.I2.i5.m1" class="ltx_Math" alttext="\blacktriangleright" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000F46;" mathcolor="#000F46">▶</mo><annotation encoding="application/x-tex">\blacktriangleright</annotation></semantics></math></span> 
<span id="S1.I2.i5.p1" class="ltx_para">
<span id="S1.I2.i5.p1.1" class="ltx_p"><span id="S1.I2.i5.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Checkable, useful and faithful rationales.</span><span id="S1.I2.i5.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Statements are checked one by one (SNR and level correct
for 88–100% of recordings); the decision after reasoning catches partial and unfamiliar fakes the one-step
answer misses (99.6 vs. 78.4% on PartialEdit); and with counterfactual training it follows a reworded,
inverted localization in 99.5% of cases, against 73.8% without (§</span><a href="#S6.SS6" title="6.6 Every statement can be checked ‣ 6 Results" class="ltx_ref" style="font-size:90%;--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">6.6</span></a><span id="S1.I2.i5.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">–</span><a href="#S6.SS8" title="6.8 The decision follows the stated evidence ‣ 6 Results" class="ltx_ref" style="font-size:90%;--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">6.8</span></a><span id="S1.I2.i5.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">).</span></span>
</span></span>
<span id="S1.I2.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><math id="S1.I2.i6.m1" class="ltx_Math" alttext="\blacktriangleright" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000F46;" mathcolor="#000F46">▶</mo><annotation encoding="application/x-tex">\blacktriangleright</annotation></semantics></math></span> 
<span id="S1.I2.i6.p1" class="ltx_para">
<span id="S1.I2.i6.p1.1" class="ltx_p"><span id="S1.I2.i6.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Light to train and run.</span><span id="S1.I2.i6.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Only 29.7 M of the 2.85 B parameters are trained. With gradient checkpointing, every
training stage fits a single 24 GB GPU, and we estimate that training fits a 12 GB GPU and inference an 8 GB
GPU (§</span><a href="#S6.SS9" title="6.9 Compute: training and running on small GPUs ‣ 6 Results" class="ltx_ref" style="font-size:90%;--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">6.9</span></a><span id="S1.I2.i6.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">).</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>