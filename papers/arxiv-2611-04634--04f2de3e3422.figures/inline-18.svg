<span id="A4.F11.pic2.2.1" class="ltx_p"><span id="A4.F11.pic2.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;--ltx-fg-color:#000000;">CHANNEL_STATUS: The first recording has no audible noise, no noticeable reverberation and Opus compression; the second
recording has no audible noise, no noticeable reverberation and no codec compression.
<br class="ltx_break">FINGERPRINT: The latent source-fingerprint cues show clear differences.
<br class="ltx_break">PROFILE_COMPATIBILITY: Generation method is similar (both copy-synthesis of real speech). Acoustic modelling is similar
(both copy-synthesis without an acoustic model). Waveform generation differs (time-domain neural-codec decoders vs GAN
vocoders).
<br class="ltx_break">DECISION: Channel degradations are present, but they are not evidence about the generation source. Across the source
profile, the attributes are mixed. This agrees with the fingerprint cues. Taken together, the recordings come from
different generation systems.
<br class="ltx_break" style="--ltx-break-space:2.0pt;">
</span><span id="A4.F11.pic2.2.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Checks: decision correct; the attribute statements fail (both systems are diffusion / flow-matching TTS
with GAN vocoders), which the check exposes while the fingerprint verdict carries the decision.</span></span>
