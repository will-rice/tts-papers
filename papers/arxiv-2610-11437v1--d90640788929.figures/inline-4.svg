<span id="A5.SS0.SSS0.Px2.p3.pic1.2.1" class="ltx_p ltx_align_left"><span id="A5.SS0.SSS0.Px2.p3.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input.<span id="A5.SS0.SSS0.Px2.p3.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> One complete generated utterance;
<span id="A5.SS0.SSS0.Px2.p3.pic1.2.1.1.1.1" class="ltx_text ltx_font_typewriter">{ordered segment texts and instructions}</span>.</span></span></span>
<span id="A5.SS0.SSS0.Px2.p3.pic1.2.2" class="ltx_p ltx_align_left"><span id="A5.SS0.SSS0.Px2.p3.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task.<span id="A5.SS0.SSS0.Px2.p3.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> For each adjacent boundary, judge whether both
sides sound like the same speaker and connect naturally,
without an audible splice, unnatural gap, or abrupt acoustic
reset. Natural pauses and smooth changes in delivery are
acceptable; the boundary need not be imperceptible.
Changes in pitch, energy, or rate do not by themselves indicate
a speaker change. Assess instruction following separately.</span></span></span>
<span id="A5.SS0.SSS0.Px2.p3.pic1.2.3" class="ltx_p ltx_align_left"><span id="A5.SS0.SSS0.Px2.p3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output.<span id="A5.SS0.SSS0.Px2.p3.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> Return JSON with the boundary indices, a Boolean
judgment for speaker continuity and natural connection, and a
combined <span id="A5.SS0.SSS0.Px2.p3.pic1.2.3.1.1.1" class="ltx_text ltx_font_typewriter">pass</span> when both are satisfied
(<span id="A5.SS0.SSS0.Px2.p3.pic1.2.3.1.1.2" class="ltx_text ltx_font_typewriter">fail</span> otherwise), with a brief reason.</span></span></span>
</span></span></span></foreignobject></g></g></svg>