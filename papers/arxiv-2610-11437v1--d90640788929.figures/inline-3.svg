<span id="A5.SS0.SSS0.Px2.p2.pic1.1.1" class="ltx_p"><span id="A5.SS0.SSS0.Px2.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Prompt 3. Segment-level instruction and emotion evaluation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 14.25 14.94)"><foreignobject style="--ltx-fo-width:37.69em;--ltx-fo-height:21.09em;--ltx-fo-depth:0.25em;font-size:10pt;" height="295.23" overflow="visible" transform="matrix(1 0 0 -1 0 291.77)" width="521.52"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS0.SSS0.Px2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.69em;">
<span id="A5.SS0.SSS0.Px2.p2.pic1.2.1" class="ltx_p ltx_align_left"><span id="A5.SS0.SSS0.Px2.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input.<span id="A5.SS0.SSS0.Px2.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> One complete generated utterance;
<span id="A5.SS0.SSS0.Px2.p2.pic1.2.1.1.1.1" class="ltx_text ltx_font_typewriter">{ordered segment texts and instructions}</span>;
<span id="A5.SS0.SSS0.Px2.p2.pic1.2.1.1.1.2" class="ltx_text ltx_font_typewriter">{emotion-eligible segment indices}</span>.</span></span></span>
<span id="A5.SS0.SSS0.Px2.p2.pic1.2.2" class="ltx_p ltx_align_left"><span id="A5.SS0.SSS0.Px2.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task.<span id="A5.SS0.SSS0.Px2.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Evaluate each segment against its own instruction.
Judge separately whether the delivery matches all explicitly
requested attributes and whether it conveys the requested emotion.
Assess emotion independently of other requirements, such as
speaking rate; use <span id="A5.SS0.SSS0.Px2.p2.pic1.2.2.1.1.1" class="ltx_text ltx_font_typewriter">not_applicable</span> for emotion-ineligible
segments. Do not impose unspecified requirements or use speaker
identity, recording quality, or pronunciation as separate
scoring criteria.</span></span></span>
<span id="A5.SS0.SSS0.Px2.p2.pic1.2.3" class="ltx_p ltx_align_left"><span id="A5.SS0.SSS0.Px2.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output.<span id="A5.SS0.SSS0.Px2.p2.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> Return JSON with each segment’s index, separate
instruction and emotion verdicts (<span id="A5.SS0.SSS0.Px2.p2.pic1.2.3.1.1.1" class="ltx_text ltx_font_typewriter">pass</span>/<span id="A5.SS0.SSS0.Px2.p2.pic1.2.3.1.1.2" class="ltx_text ltx_font_typewriter">fail</span>,
with <span id="A5.SS0.SSS0.Px2.p2.pic1.2.3.1.1.3" class="ltx_text ltx_font_typewriter">not_applicable</span> allowed for emotion), and brief reasons.</span></span></span>
</span></span></span></foreignobject></g></g></svg>