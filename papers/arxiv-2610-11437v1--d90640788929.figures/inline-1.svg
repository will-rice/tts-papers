<span id="A3.SS2.SSS0.Px2.p2.pic1.2.1" class="ltx_p ltx_align_left"><span id="A3.SS2.SSS0.Px2.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input.</span></span>
<span id="A3.SS2.SSS0.Px2.p2.pic1.2.2" class="ltx_p ltx_align_left"><span id="A3.SS2.SSS0.Px2.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Source voice description: <span id="A3.SS2.SSS0.Px2.p2.pic1.2.2.1.1" class="ltx_text ltx_font_typewriter">{ref_desc}</span></span></span>
<span id="A3.SS2.SSS0.Px2.p2.pic1.2.3" class="ltx_p ltx_align_left"><span id="A3.SS2.SSS0.Px2.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Target voice description: <span id="A3.SS2.SSS0.Px2.p2.pic1.2.3.1.1" class="ltx_text ltx_font_typewriter">{tgt_desc}</span></span></span>
<span id="A3.SS2.SSS0.Px2.p2.pic1.2.4" class="ltx_p ltx_align_left"><span id="A3.SS2.SSS0.Px2.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Structured edit instruction: <span id="A3.SS2.SSS0.Px2.p2.pic1.2.4.1.1" class="ltx_text ltx_font_typewriter">{canonical}</span></span></span>
<span id="A3.SS2.SSS0.Px2.p2.pic1.2.5" class="ltx_p ltx_align_left"><span id="A3.SS2.SSS0.Px2.p2.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task.<span id="A3.SS2.SSS0.Px2.p2.pic1.2.5.1.1" class="ltx_text ltx_font_medium">
Rewrite the structured instruction as two natural voice-editing requests
in <span id="A3.SS2.SSS0.Px2.p2.pic1.2.5.1.1.1" class="ltx_text ltx_font_typewriter">{language}</span>. Use the structured instruction as ground truth:
each variant must independently retain every requested attribute change,
its direction, and its target category or intensity, together with any
explicit preservation requirements. No attribute change may be omitted,
regardless of the number of attributes involved. Do not add, reverse,
strengthen, or weaken any operation. Use the source and target descriptions
only to guide wording, without introducing additional editing requirements.
Describe the desired voice naturally rather than listing attribute
transitions mechanically.
Make clear that the request edits the reference voice. Do not append a
boilerplate statement about keeping other traits unchanged unless it is
explicitly required by the structured instruction. Each variant must be
one sentence, within 80 Chinese characters or 60 English words; shorten
unnecessary wording rather than omit required edits.
Before returning, check each variant against the structured instruction
attribute by attribute and rewrite any variant with missing, added, or
altered operations.</span></span></span>
<span id="A3.SS2.SSS0.Px2.p2.pic1.2.6" class="ltx_p ltx_align_left"><span id="A3.SS2.SSS0.Px2.p2.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output.<span id="A3.SS2.SSS0.Px2.p2.pic1.2.6.1.1" class="ltx_text ltx_font_medium"> Return JSON only:</span></span></span>
<span id="A3.SS2.SSS0.Px2.p2.pic1.2.7" class="ltx_p ltx_align_left"><span id="A3.SS2.SSS0.Px2.p2.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{&quot;variants&quot;: [&quot;...&quot;, &quot;...&quot;]}<span id="A3.SS2.SSS0.Px2.p2.pic1.2.7.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
