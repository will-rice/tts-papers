<span id="A5.SS0.SSS0.Px2.p4.pic1.1.1" class="ltx_p"><span id="A5.SS0.SSS0.Px2.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Prompt 5. Timbre attribute-operation evaluation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 14.25 14.17)"><foreignobject style="--ltx-fo-width:37.69em;--ltx-fo-height:22.29em;--ltx-fo-depth:0.19em;font-size:10pt;" height="311.07" overflow="visible" transform="matrix(1 0 0 -1 0 308.38)" width="521.52"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS0.SSS0.Px2.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.69em;">
<span id="A5.SS0.SSS0.Px2.p4.pic1.2.1" class="ltx_p ltx_align_left"><span id="A5.SS0.SSS0.Px2.p4.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input.<span id="A5.SS0.SSS0.Px2.p4.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Clip A: source audio; Clip B: generated audio;
<span id="A5.SS0.SSS0.Px2.p4.pic1.2.1.1.1.1" class="ltx_text ltx_font_typewriter">{attribute definitions with ordered levels}</span>;
<span id="A5.SS0.SSS0.Px2.p4.pic1.2.1.1.1.2" class="ltx_text ltx_font_typewriter">{required operations}</span>.</span></span></span>
<span id="A5.SS0.SSS0.Px2.p4.pic1.2.2" class="ltx_p ltx_align_left"><span id="A5.SS0.SSS0.Px2.p4.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task.<span id="A5.SS0.SSS0.Px2.p4.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Evaluate each attribute operation independently.
For <span id="A5.SS0.SSS0.Px2.p4.pic1.2.2.1.1.1" class="ltx_text ltx_font_italic">up/down</span>, compare Clip B with Clip A and judge
the requested direction along the supplied ordered levels,
not exact step size.
For <span id="A5.SS0.SSS0.Px2.p4.pic1.2.2.1.1.2" class="ltx_text ltx_font_italic">category</span>, judge whether Clip B matches the
requested perceived-gender or age category.
For <span id="A5.SS0.SSS0.Px2.p4.pic1.2.2.1.1.3" class="ltx_text ltx_font_italic">keep</span>, judge whether the attribute remains
essentially unchanged, allowing minor natural variation.
Do not use linguistic content, pronunciation, recording
volume, or overall naturalness as evidence of timbre
editing success.</span></span></span>
<span id="A5.SS0.SSS0.Px2.p4.pic1.2.3" class="ltx_p ltx_align_left"><span id="A5.SS0.SSS0.Px2.p4.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output.<span id="A5.SS0.SSS0.Px2.p4.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> Return JSON with each attribute’s name,
required operation, a <span id="A5.SS0.SSS0.Px2.p4.pic1.2.3.1.1.1" class="ltx_text ltx_font_typewriter">pass</span>/<span id="A5.SS0.SSS0.Px2.p4.pic1.2.3.1.1.2" class="ltx_text ltx_font_typewriter">fail</span> verdict
indicating whether it is satisfied, and a brief reason.</span></span></span>
</span></span></span></foreignobject></g></g></svg>