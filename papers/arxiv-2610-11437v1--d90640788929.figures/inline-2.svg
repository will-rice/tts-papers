<span id="A3.SS2.SSS0.Px2.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.69em;">
<span id="A3.SS2.SSS0.Px2.p3.pic1.2.1" class="ltx_p ltx_align_left"><span id="A3.SS2.SSS0.Px2.p3.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input.<span id="A3.SS2.SSS0.Px2.p3.pic1.2.1.1.1" class="ltx_text ltx_font_medium">
<span id="A3.SS2.SSS0.Px2.p3.pic1.2.1.1.1.1" class="ltx_text ltx_font_typewriter">{language}</span>, <span id="A3.SS2.SSS0.Px2.p3.pic1.2.1.1.1.2" class="ltx_text ltx_font_typewriter">{topic}</span>,
<span id="A3.SS2.SSS0.Px2.p3.pic1.2.1.1.1.3" class="ltx_text ltx_font_typewriter">{topic_definition}</span>, and <span id="A3.SS2.SSS0.Px2.p3.pic1.2.1.1.1.4" class="ltx_text ltx_font_typewriter">{num_segments}</span>.</span></span></span>
<span id="A3.SS2.SSS0.Px2.p3.pic1.2.2" class="ltx_p ltx_align_left"><span id="A3.SS2.SSS0.Px2.p3.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task.<span id="A3.SS2.SSS0.Px2.p3.pic1.2.2.1.1" class="ltx_text ltx_font_medium">
Generate one coherent, speakable sentence on the given topic and divide
it into exactly <span id="A3.SS2.SSS0.Px2.p3.pic1.2.2.1.1.1" class="ltx_text ltx_font_typewriter">{num_segments}</span> consecutive segments. Assign
one concise delivery instruction to each segment, covering emotion,
rate, pauses, emphasis, intonation, energy, loudness, or speaking manner.
Create clear but natural variation across segments. Do not request
changes to timbre, speaker identity, gender, age, or accent. Avoid rare
named entities, numbers, URLs, code, brackets, and emoji. Target 18–36
Chinese characters or 15–28 English words. Concatenating the segment texts
must reproduce the full sentence with its punctuation and order intact.</span></span></span>
<span id="A3.SS2.SSS0.Px2.p3.pic1.2.3" class="ltx_p ltx_align_left"><span id="A3.SS2.SSS0.Px2.p3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output.<span id="A3.SS2.SSS0.Px2.p3.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> Return JSON only; the segment list must have the requested length:</span></span></span>
<span id="A3.SS2.SSS0.Px2.p3.pic1.2.4" class="ltx_p ltx_align_left"><span id="A3.SS2.SSS0.Px2.p3.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{&quot;language&quot;: &quot;...&quot;, &quot;topic&quot;: &quot;...&quot;, &quot;num_segments&quot;: N,</span></span>
<span id="A3.SS2.SSS0.Px2.p3.pic1.2.5" class="ltx_p ltx_align_left"><span id="A3.SS2.SSS0.Px2.p3.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> &quot;text&quot;: &quot;...&quot;, &quot;segments&quot;: [</span></span>
<span id="A3.SS2.SSS0.Px2.p3.pic1.2.6" class="ltx_p ltx_align_left"><span id="A3.SS2.SSS0.Px2.p3.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">   {&quot;text&quot;: &quot;...&quot;, &quot;instruction&quot;: &quot;...&quot;}, ...]}<span id="A3.SS2.SSS0.Px2.p3.pic1.2.6.1.1" class="ltx_text ltx_font_serif">
