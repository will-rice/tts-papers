<span id="A1.SS12.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="A1.SS12.p2.pic1.2.1" class="ltx_p"><span id="A1.SS12.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Your current task is model family and size initialization:<span id="A1.SS12.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> you must provide the model family and size preferences for a test-time collaboration graph that will later be optimized into a DAG. An edge indicates that the previous model’s output is the next agent’s input.</span></span></span>
<span id="A1.SS12.p2.pic1.2.2" class="ltx_p"><span id="A1.SS12.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">================ TASK =================<span id="A1.SS12.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">1. Examine the candidate model combinations listed at the end of this message. 
<br class="ltx_break">2. Return a JSON dictionary of model family and size ranking. 
<br class="ltx_break">No extra text, explanations, or formatting—just the dictionary.</span></span></span>
<span id="A1.SS12.p2.pic1.2.3" class="ltx_p"><span id="A1.SS12.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">=============== INSIGHTS ===============<span id="A1.SS12.p2.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">(1) Different tasks exhibit a clear preference for specific model combinations. Under budget constraints, it is necessary to identify the preferred model family and model size for each task.</span></span></span>
<span id="A1.SS12.p2.pic1.2.4" class="ltx_p"><span id="A1.SS12.p2.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">=============== DATA ===================<span id="A1.SS12.p2.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Single-model accuracy on <code id="A1.SS12.p2.pic1.2.4.1.1.1" class="ltx_verbatim ltx_font_typewriter">{task}</code> (higher is better): 
<br class="ltx_break"><code id="A1.SS12.p2.pic1.2.4.1.1.2" class="ltx_verbatim ltx_font_typewriter">{model_profile}</code> or <code id="A1.SS12.p2.pic1.2.4.1.1.3" class="ltx_verbatim ltx_font_typewriter">{pre_test_accuracy}</code> 
<br class="ltx_break" style="--ltx-break-space:2.5pt;">
Random-graph pre-experiment results (including small models running once or twice and large models running once): 
<br class="ltx_break"><code id="A1.SS12.p2.pic1.2.4.1.1.4" class="ltx_verbatim ltx_font_typewriter">{combinations_accuracy}</code></span></span></span>
<span id="A1.SS12.p2.pic1.2.5" class="ltx_p"><span id="A1.SS12.p2.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">=============== CANDIDATES =============<span id="A1.SS12.p2.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> 
