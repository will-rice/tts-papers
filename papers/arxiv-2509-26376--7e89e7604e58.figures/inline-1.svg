<svg id="A4.SS1.SSS0.Px4.p2.pic1" class="ltx_picture" height="681.52" overflow="visible" version="1.1" viewbox="0 0 477.38 681.52" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,681.52) matrix(1 0 0 -1 0 0)"><g style="--ltx-stroke-color:#666666;--ltx-fill-color:#666666;--ltx-fg-color:#666666;" color="#666666" fill="#666666" fill-opacity="1" stroke="#666666" stroke-opacity="1"><path style="stroke:none" d="M 4.15 -4.15 L 4.15 677.37 L 481.53 677.37 L 481.53 -4.15 Z" /></g><g style="--ltx-fill-color:#7DFFCD;" fill="#7DFFCD" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 681.52 L 477.38 681.52 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 4.15 4.15 L 4.15 659.54 L 473.23 659.54 L 473.23 4.15 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.59 667.07)"><foreignobject style="--ltx-fo-width:31.52em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="436.15"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS1.SSS0.Px4.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.52em;">
<span id="A4.SS1.SSS0.Px4.p2.pic1.1.1" class="ltx_p"><span id="A4.SS1.SSS0.Px4.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">User Study: Autoregressive Image Generation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.59 12.72)"><foreignobject style="--ltx-fo-width:37.08em;--ltx-fo-height:46.13em;--ltx-fo-depth:0em;font-size:10pt;" height="638.26" overflow="visible" transform="matrix(1 0 0 -1 0 638.26)" width="513.08"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS1.SSS0.Px4.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.08em;">
<span id="A4.SS1.SSS0.Px4.p2.pic1.2.1" class="ltx_p"><span id="A4.SS1.SSS0.Px4.p2.pic1.2.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Thank you for participating in our user study! Please follow these steps to complete your evaluation:</span></span>
<span id="A4.SS1.SSS0.Px4.p2.pic1.2.2" class="ltx_p"><span id="A4.SS1.SSS0.Px4.p2.pic1.2.2.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">1. <span id="A4.SS1.SSS0.Px4.p2.pic1.2.2.1.1" class="ltx_text ltx_font_bold">Image Generation: </span>
Carefully read the target prompt provided, and then view the provided images.</span></span>
<span id="A4.SS1.SSS0.Px4.p2.pic1.2.3" class="ltx_p"><span id="A4.SS1.SSS0.Px4.p2.pic1.2.3.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">2. <span id="A4.SS1.SSS0.Px4.p2.pic1.2.3.1.1" class="ltx_text ltx_font_bold">Scoring Criteria:</span>
Assign a score to each generated image based on the following aspects (<math id="A4.SS1.SSS0.Px4.p2.pic1.m1" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math> being the lowest, <math id="A4.SS1.SSS0.Px4.p2.pic1.m2" class="ltx_Math" alttext="5" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn><annotation encoding="application/x-tex">5</annotation></semantics></math> being the highest):</span></span>
<span id="A4.I3" class="ltx_itemize" style="--ltx-enum-leftmargin:6mm;">
<span id="A4.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I3.i1.p1" class="ltx_para">
<span id="A4.I3.i1.p1.1" class="ltx_p"><span id="A4.I3.i1.p1.1.1" class="ltx_text ltx_font_bold ltx_font_italic" style="font-size:80%;--ltx-fg-color:#000000;">Overall Quality<span id="A4.I3.i1.p1.1.1.1" class="ltx_text ltx_font_upright">:</span></span><span id="A4.I3.i1.p1.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> The overall perceived quality and appeal of the generated image.</span></span>
</span></span>
<span id="A4.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I3.i2.p1" class="ltx_para">
<span id="A4.I3.i2.p1.1" class="ltx_p"><span id="A4.I3.i2.p1.1.1" class="ltx_text ltx_font_bold ltx_font_italic" style="font-size:80%;--ltx-fg-color:#000000;">Aesthetic Quality<span id="A4.I3.i2.p1.1.1.1" class="ltx_text ltx_font_upright">:</span></span><span id="A4.I3.i2.p1.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> The visual aesthetics, composition, and artistic merit of the image.</span></span>
</span></span>
<span id="A4.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I3.i3.p1" class="ltx_para">
<span id="A4.I3.i3.p1.1" class="ltx_p"><span id="A4.I3.i3.p1.1.1" class="ltx_text ltx_font_bold ltx_font_italic" style="font-size:80%;--ltx-fg-color:#000000;">Realism Fidelity<span id="A4.I3.i3.p1.1.1.1" class="ltx_text ltx_font_upright">:</span></span><span id="A4.I3.i3.p1.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> How realistically and faithfully the image captures the intended scene or subject matter.</span></span>
</span></span>
<span id="A4.I3.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I3.i4.p1" class="ltx_para">
<span id="A4.I3.i4.p1.1" class="ltx_p"><span id="A4.I3.i4.p1.1.1" class="ltx_text ltx_font_bold ltx_font_italic" style="font-size:80%;--ltx-fg-color:#000000;">Semantic Alignment<span id="A4.I3.i4.p1.1.1.1" class="ltx_text ltx_font_upright">:</span></span><span id="A4.I3.i4.p1.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> How well the generated image aligns with and represents the meaning of the textual prompt.</span></span>
</span></span>
<span id="A4.I3.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I3.i5.p1" class="ltx_para">
<span id="A4.I3.i5.p1.1" class="ltx_p"><span id="A4.I3.i5.p1.1.1" class="ltx_text ltx_font_bold ltx_font_italic" style="font-size:80%;--ltx-fg-color:#000000;">Attribute Binding<span id="A4.I3.i5.p1.1.1.1" class="ltx_text ltx_font_upright">:</span></span><span id="A4.I3.i5.p1.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> The degree to which the image accurately depicts the specific attributes and details described in the text.</span></span>
</span></span>
</span>
<span id="A4.SS1.SSS0.Px4.p2.pic1.2.4" class="ltx_p"><span id="A4.SS1.SSS0.Px4.p2.pic1.2.4.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">3. <span id="A4.SS1.SSS0.Px4.p2.pic1.2.4.1.1" class="ltx_text ltx_font_bold">Submission:</span>
Click the “Submit Scores” button to submit your scores.</span></span>
<span id="A4.SS1.SSS0.Px4.p2.pic1.2.5" class="ltx_p"><span id="A4.SS1.SSS0.Px4.p2.pic1.2.5.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Notations:<span id="A4.SS1.SSS0.Px4.p2.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="A4.SS1.SSS0.Px4.p2.pic1.2.6" class="ltx_p"><span id="A4.SS1.SSS0.Px4.p2.pic1.2.6.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">1. We observe that the edge browser is not fully compatible with our interface. Chrome is recommended.</span></span>
<span id="A4.SS1.SSS0.Px4.p2.pic1.2.7" class="ltx_p"><span id="A4.SS1.SSS0.Px4.p2.pic1.2.7.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">2. Remember to click the “Submit Scores” button after your evaluation.</span></span>
<span id="A4.SS1.SSS0.Px4.p2.pic1.2.8" class="ltx_p"><span id="A4.SS1.SSS0.Px4.p2.pic1.2.8.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">3. If you see that images and the score sliders are not aligned, shrinking your page usually works.</span></span>
<span id="A4.SS1.SSS0.Px4.p2.pic1.2.9" class="ltx_p"><span id="A4.SS1.SSS0.Px4.p2.pic1.2.9.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">4. If the page is not responsive for a long time, please try to refresh it.</span></span>
<span id="A4.SS1.SSS0.Px4.p2.pic1.2.10" class="ltx_p"><span id="A4.SS1.SSS0.Px4.p2.pic1.2.10.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">5. If you have any questions, please directly ping us. Thank you for your time and effort!</span></span>
</span></span></span></foreignobject></g></g></svg>