<svg id="A1.SS4.SSS0.Px1.p3.pic1" class="ltx_picture" height="917.03" overflow="visible" version="1.1" viewbox="0 0 550 917.03" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,917.03) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 896.47 C 0 899.73 2.64 902.37 5.91 902.37 L 544.09 902.37 C 547.36 902.37 550 899.73 550 896.47 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 896.47 C 1.97 898.64 3.73 900.4 5.91 900.4 L 544.09 900.4 C 546.27 900.4 548.03 898.64 548.03 896.47 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g transform="matrix(1.0 0.0 0.0 1.0 7.87 894.5)"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" class="ltx_nestedsvg" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="matrix(1 0 0 1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 3.15 L 0 19.39 C 0 21.13 1.41 22.54 3.15 22.54 L 393.4 22.54 C 395.14 22.54 396.55 21.13 396.55 19.39 L 396.55 3.15 C 396.55 1.41 395.14 0 393.4 0 L 3.15 0 C 1.41 0 0 1.41 0 3.15 Z" /></g><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 1.18 3.15 L 1.18 19.39 C 1.18 20.47 2.06 21.35 3.15 21.35 L 393.4 21.35 C 394.49 21.35 395.37 20.47 395.37 19.39 L 395.37 3.15 C 395.37 2.06 394.49 1.18 393.4 1.18 L 3.15 1.18 C 2.06 1.18 1.18 2.06 1.18 3.15 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 9.06 7.81)"><foreignobject style="--ltx-fo-width:27.35em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="378.45"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS4.SSS0.Px1.p3.pic1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">GPT-4.1 Rollout Prompt for AI2D during Dataset Generation</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 49.06)"><foreignobject style="--ltx-fo-width:35.82em;--ltx-fo-height:60.67em;--ltx-fo-depth:2.55em;font-size:10pt;" height="874.82" overflow="visible" transform="matrix(1 0 0 -1 0 839.54)" width="495.65"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS4.SSS0.Px1.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.82em;">
<span id="A1.SS4.SSS0.Px1.p3.pic1.2.1" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p3.pic1.2.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">You are an expert data analyst specializing in interpreting data visualizations. Your task is to answer questions about charts and graphs presented to you in images. You will be provided with an image containing one or more data visualizations and a specific question about the data presented.</span></span>
<span id="A1.SS4.SSS0.Px1.p3.pic1.2.2" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p3.pic1.2.2.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">I will provide you with an image containing:</span></span>
<span id="A1.I3" class="ltx_itemize">
<span id="A1.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I3.i1.p1" class="ltx_para">
<span id="A1.I3.i1.p1.1" class="ltx_p"><span id="A1.I3.i1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Data Visualization: A chart or graph that contains data points and other visual elements.</span></span>
</span></span>
</span>
<span id="A1.SS4.SSS0.Px1.p3.pic1.2.3" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p3.pic1.2.3.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Here’s the question you need to answer:</span></span><pre id="A1.SS4.SSS0.Px1.p3.pic1.2.4" class="ltx_verbatim ltx_centering ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;question&gt;
{{QUESTION}}
&lt;/question&gt;
</pre>
<span id="A1.SS4.SSS0.Px1.p3.pic1.2.5" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p3.pic1.2.5.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Please follow these steps to complete the task:</span></span>
<span id="A1.I4" class="ltx_enumerate">
<span id="A1.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I4.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I4.i1.p1.1" class="ltx_p"><span id="A1.I4.i1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Carefully examine the image, paying attention to all elements of the data visualization(s) such as titles, labels, axes, legends, and data points.</span></span>
</span></span>
<span id="A1.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I4.i2.p1" class="ltx_para ltx_noindent">
<span id="A1.I4.i2.p1.1" class="ltx_p"><span id="A1.I4.i2.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Analyze the data presented in the visualization(s), identifying specific data points or trends that relate to the question asked.</span></span>
</span></span>
<span id="A1.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A1.I4.i3.p1" class="ltx_para ltx_noindent">
<span id="A1.I4.i3.p1.1" class="ltx_p"><span id="A1.I4.i3.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Interpret the data and connect it to the specific question asked. Consider how the data directly relates to answering the question.</span></span>
</span></span>
<span id="A1.I4.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A1.I4.i4.p1" class="ltx_para ltx_noindent">
<span id="A1.I4.i4.p1.1" class="ltx_p"><span id="A1.I4.i4.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Use your analysis and interpretation to determine the answer to the question. The answer must be a single integer.</span></span>
</span></span>
<span id="A1.I4.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A1.I4.i5.p1" class="ltx_para">
<span id="A1.I4.i5.p1.1" class="ltx_p"><span id="A1.I4.i5.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Present your answer in a LaTeX-formatted box using this format:</span></span><pre id="A1.I4.i5.p1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
&lt;correct_answer&gt;
\boxed{Your answer here}
&lt;/correct_answer&gt;
</pre>
</span></span>
</span>
<span id="A1.SS4.SSS0.Px1.p3.pic1.2.6" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p3.pic1.2.6.1" class="ltx_text ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#000000;">Your task is to:<span id="A1.SS4.SSS0.Px1.p3.pic1.2.6.1.1" class="ltx_text"></span></span></span>
<span id="A1.I5" class="ltx_itemize">
<span id="A1.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I5.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I5.i1.p1.1" class="ltx_p"><span id="A1.I5.i1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Under the [Visual Elements] section, list out all relevant visual elements step-by-step that relate to answering the question. Be thorough but concise. Wrap each step in </span><code id="A1.I5.i1.p1.1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;step_1&gt;</code><span id="A1.I5.i1.p1.1.3" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">, </span><code id="A1.I5.i1.p1.1.4" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;step_2&gt;</code><span id="A1.I5.i1.p1.1.5" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">, …tags.</span></span>
</span></span>
<span id="A1.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I5.i2.p1" class="ltx_para ltx_noindent">
<span id="A1.I5.i2.p1.1" class="ltx_p"><span id="A1.I5.i2.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Under the [Reasoning] section, explain your step-by-step reasoning process. This should include your analysis, interpretation, and how you arrived at the answer. Provide a clear justification of how you derived the answer from the data presented. Wrap each step in </span><code id="A1.I5.i2.p1.1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;step_1&gt;</code><span id="A1.I5.i2.p1.1.3" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">, </span><code id="A1.I5.i2.p1.1.4" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;step_2&gt;</code><span id="A1.I5.i2.p1.1.5" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">, …tags.</span></span>
</span></span>
<span id="A1.I5.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I5.i3.p1" class="ltx_para">
<span id="A1.I5.i3.p1.1" class="ltx_p"><span id="A1.I5.i3.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Present your final answer using the LaTeX-formatted box in </span><code id="A1.I5.i3.p1.1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;correct_answer&gt;</code><span id="A1.I5.i3.p1.1.3" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;"> tags.</span></span>
</span></span>
</span>
<span id="A1.SS4.SSS0.Px1.p3.pic1.2.7" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p3.pic1.2.7.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">It is crucial that your solution contains these sections in the exact format described below:</span></span><pre id="A1.SS4.SSS0.Px1.p3.pic1.2.8" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">[Visual Elements]
&lt;step_1&gt;
...(Step 1 of step-by-step perception)...
&lt;/step_1&gt;
&lt;step_2&gt;
...(Step 2 of step-by-step perception)...
&lt;/step_2&gt;
...
&lt;step_n&gt;
...(Step n of step-by-step perception)...
&lt;/step_n&gt;

[Analysis and Interpretation]
&lt;step_1&gt;
...(Step 1 of step-by-step reasoning)...
&lt;/step_1&gt;
&lt;step_2&gt;
...(Step 2 of step-by-step reasoning)...
&lt;/step_2&gt;
...
&lt;step_m&gt;
...(Step m of step-by-step reasoning)...
&lt;/step_m&gt;

&lt;correct_answer&gt;
$\boxed{\text{integer}}$
&lt;/correct_answer&gt;
</pre>
<span id="A1.SS4.SSS0.Px1.p3.pic1.2.9" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p3.pic1.2.9.1" class="ltx_text ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#000000;">Remember to<span id="A1.SS4.SSS0.Px1.p3.pic1.2.9.1.1" class="ltx_text ltx_font_medium">:</span></span></span>
<span id="A1.I6" class="ltx_itemize">
<span id="A1.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I6.i1.p1" class="ltx_para">
<span id="A1.I6.i1.p1.1" class="ltx_p"><span id="A1.I6.i1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Provide only a single string answer in the </span><code id="A1.I6.i1.p1.1.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;correct_answer&gt;</code><span id="A1.I6.i1.p1.1.3" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;"> section using the </span><code id="A1.I6.i1.p1.1.4" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">$\boxed{string_answer}$</code><span id="A1.I6.i1.p1.1.5" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;"> format, and no other text or commentary.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>