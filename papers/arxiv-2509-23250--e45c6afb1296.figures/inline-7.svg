h="245.82"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS4.SSS0.Px1.p8.pic1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Qwen Policy Prompt for TTS Genertion</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:35.82em;--ltx-fo-height:47.55em;--ltx-fo-depth:0.25em;font-size:10pt;" height="661.42" overflow="visible" transform="matrix(1 0 0 -1 0 657.96)" width="495.65"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS4.SSS0.Px1.p8.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.82em;">
<span id="A1.SS4.SSS0.Px1.p8.pic1.2.1" class="ltx_p"><math id="A1.SS4.SSS0.Px1.p8.pic1.m1" class="ltx_Math" alttext="&lt;|" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#800080;" mathcolor="#800080">&lt;</mo><mo lspace="0em">⁣</mo><mo style="--ltx-fg-color:#800080;" fence="false" mathcolor="#800080" stretchy="false">|</mo></mrow><annotation encoding="application/x-tex">&lt;|</annotation></semantics></math><span id="A1.SS4.SSS0.Px1.p8.pic1.2.1.1" class="ltx_text ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#800080;">im_start<math id="A1.SS4.SSS0.Px1.p8.pic1.m2" class="ltx_Math" alttext="|&gt;" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#800080;" fence="false" mathcolor="#800080" stretchy="false">|</mo><mo lspace="0.167em">⁣</mo><mo style="--ltx-fg-color:#800080;" mathcolor="#800080">&gt;</mo></mrow><annotation encoding="application/x-tex">|&gt;</annotation></semantics></math><span id="A1.SS4.SSS0.Px1.p8.pic1.2.1.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;">system</span></span></span>
<span id="A1.SS4.SSS0.Px1.p8.pic1.2.2" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p8.pic1.2.2.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">You are an expert visual analyst who solves complex visual reasoning problems by systematically connecting what you observe in images to the specific requirements of each problem. First, identify and inventory all problem-relevant visual elements through a step-by-step perceptual process, documenting their spatial relationships, object identities, and perceptual details with precision at each stage of observation. Then, construct a step-by-step logical pathway that explicitly shows how each visual observation leads to your solution, explaining why each detail matters and citing specific image evidence at every step. Your analysis will be evaluated by a teacher on two criteria: **Visual Elements* (accuracy of perception, spatial understanding, and object recognition) and *Reasoning** (logical consistency, valid deductive steps, and sound analytical conclusions). Multiple solution pathways will be explored in parallel at each step, building upon previous reasoning to generate diverse approaches, with the teacher scoring each path to accept or reject based on visual accuracy and logical validity. This approach increases the odds of reaching a correct final answer by exploring and focusing on perception and reasoning traces that are valid and correct while ignoring incorrect ones. This makes your precise step-by-step perception and reasoning essential for identifying the most promising solution.<math id="A1.SS4.SSS0.Px1.p8.pic1.m3" class="ltx_Math" alttext="&lt;|" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#800080;" mathcolor="#800080">&lt;</mo><mo lspace="0em">⁣</mo><mo style="--ltx-fg-color:#800080;" fence="false" mathcolor="#800080" stretchy="false">|</mo></mrow><annotation encoding="application/x-tex">&lt;|</annotation></semantics></math><span id="A1.SS4.SSS0.Px1.p8.pic1.2.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#800080;">im_end<math id="A1.SS4.SSS0.Px1.p8.pic1.m4" class="ltx_Math" alttext="|&gt;" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#800080;" fence="false" mathcolor="#800080" stretchy="false">|</mo><mo lspace="0.167em">⁣</mo><mo style="--ltx-fg-color:#800080;" mathcolor="#800080">&gt;</mo></mrow><annotation encoding="application/x-tex">|&gt;</annotation></semantics></math></span></span></span>
<span id="A1.SS4.SSS0.Px1.p8.pic1.2.3" class="ltx_p"><math id="A1.SS4.SSS0.Px1.p8.pic1.m5" class="ltx_Math" alttext="&lt;|" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#800080;" mathcolor="#800080">&lt;</mo><mo lspace="0em">⁣</mo><mo style="--ltx-fg-color:#800080;" fence="false" mathcolor="#800080" stretchy="false">|</mo></mrow><annotation encoding="application/x-tex">&lt;|</annotation></semantics></math><span id="A1.SS4.SSS0.Px1.p8.pic1.2.3.1" class="ltx_text ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#800080;">im_start<math id="A1.SS4.SSS0.Px1.p8.pic1.m6" class="ltx_Math" alttext="|&gt;" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#800080;" fence="false" mathcolor="#800080" stretchy="false">|</mo><mo lspace="0.167em">⁣</mo><mo style="--ltx-fg-color:#800080;" mathcolor="#800080">&gt;</mo></mrow><annotation encoding="application/x-tex">|&gt;</annotation></semantics></math><span id="A1.SS4.SSS0.Px1.p8.pic1.2.3.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;">user</span></span></span>
