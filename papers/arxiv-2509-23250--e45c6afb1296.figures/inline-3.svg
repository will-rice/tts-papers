<svg id="A1.SS4.SSS0.Px1.p4.pic1" class="ltx_picture" height="1143.18" overflow="visible" version="1.1" viewbox="0 0 550 1143.18" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1143.18) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 1122.62 C 0 1125.88 2.64 1128.52 5.91 1128.52 L 544.09 1128.52 C 547.36 1128.52 550 1125.88 550 1122.62 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 1122.62 C 1.97 1124.79 3.73 1126.55 5.91 1126.55 L 544.09 1126.55 C 546.27 1126.55 548.03 1124.79 548.03 1122.62 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g transform="matrix(1.0 0.0 0.0 1.0 7.87 1120.65)"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" class="ltx_nestedsvg" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="matrix(1 0 0 1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 3.15 L 0 19.39 C 0 21.13 1.41 22.54 3.15 22.54 L 370.07 22.54 C 371.81 22.54 373.22 21.13 373.22 19.39 L 373.22 3.15 C 373.22 1.41 371.81 0 370.07 0 L 3.15 0 C 1.41 0 0 1.41 0 3.15 Z" /></g><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 1.18 3.15 L 1.18 19.39 C 1.18 20.47 2.06 21.35 3.15 21.35 L 370.07 21.35 C 371.16 21.35 372.04 20.47 372.04 19.39 L 372.04 3.15 C 372.04 2.06 371.16 1.18 370.07 1.18 L 3.15 1.18 C 2.06 1.18 1.18 2.06 1.18 3.15 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 9.06 7.81)"><foreignobject style="--ltx-fo-width:25.75em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="356.27"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS4.SSS0.Px1.p4.pic1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">o4-mini Judge Prompt for Sample Correctness Verification</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 64.9)"><foreignobject style="--ltx-fo-width:35.82em;--ltx-fo-height:75.87em;--ltx-fo-depth:3.69em;font-size:10pt;" height="1100.98" overflow="visible" transform="matrix(1 0 0 -1 0 1049.86)" width="495.65"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS4.SSS0.Px1.p4.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:35.82em;">
<span id="A1.SS4.SSS0.Px1.p4.pic1.p2" class="ltx_para">
<span id="A1.SS4.SSS0.Px1.p4.pic1.p2.1" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p4.pic1.p2.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">I will provide an abstract visual reasoning problem along with a solution. They will be formatted as follows:</span></span>
<span id="A1.SS4.SSS0.Px1.p4.pic1.p2.2" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p4.pic1.p2.2.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">[Abstract Visual Reasoning Problem]</span></span><pre id="A1.SS4.SSS0.Px1.p4.pic1.p2.3" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
&lt;abstract_visual_reasoning_problem&gt;
...(abstract visual reasoning problem)...
&lt;/abstract_visual_reasoning_problem&gt;
</pre>
<span id="A1.SS4.SSS0.Px1.p4.pic1.p2.4" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p4.pic1.p2.4.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">[Solution]</span></span><pre id="A1.SS4.SSS0.Px1.p4.pic1.p2.5" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
&lt;solution&gt;
[Perception]
&lt;step_1&gt;
...(Step 1 of step-by-step perception)...
&lt;/step_1&gt;
&lt;step_2&gt;
...(Step 2 of step-by-step perception)...
&lt;/step_2&gt;
...
&lt;step_m&gt;
...(Step m of step-by-step perception)...
&lt;/step_m&gt;
[Reasoning]
&lt;step_1&gt;
...(Step 1 of step-by-step reasoning)...
&lt;/step_1&gt;
&lt;step_2&gt;
...(Step 2 of step-by-step reasoning)...
&lt;/step_2&gt;
...
&lt;step_n&gt;
...(Step n of step-by-step reasoning)...
&lt;/step_n&gt;
&lt;correct_answer&gt;
...(The provided answer to the abstract visual reasoning problem)...
&lt;/correct_answer&gt;
&lt;/solution&gt;
</pre>
<span id="A1.SS4.SSS0.Px1.p4.pic1.p2.6" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p4.pic1.p2.6.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Your task is to review each paragraph of the solution in sequence, analyzing, verifying, and critiquing the visual elements perception and reasoning in detail. You need to provide the analyses and the conclusion in the following format:</span></span>
<span id="A1.SS4.SSS0.Px1.p4.pic1.p2.7" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p4.pic1.p2.7.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">[Perception]</span></span><pre id="A1.SS4.SSS0.Px1.p4.pic1.p2.8" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
&lt;analysis_1&gt;
...(analysis of step 1)...
&lt;/analysis_1&gt;
...
&lt;analysis_m&gt;
...(analysis of step m)...
&lt;/analysis_m&gt;
</pre>
<span id="A1.SS4.SSS0.Px1.p4.pic1.p2.9" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p4.pic1.p2.9.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">[Reasoning]</span></span><pre id="A1.SS4.SSS0.Px1.p4.pic1.p2.10" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
&lt;analysis_1&gt;
...(analysis of step 1)...
&lt;/analysis_1&gt;
...
&lt;analysis_n&gt;
...(analysis of step n)...
&lt;/analysis_n&gt;
&lt;conclusion&gt;
Correct/Incorrect
&lt;/conclusion&gt;
</pre>
<span id="A1.I7" class="ltx_itemize">
<span id="A1.I7.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I7.i1.p1.1" class="ltx_p"><span id="A1.I7.i1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">When you analyze each step, you should use proper logical or perceptual verification as appropriate, or reflection to indicate whether it is logically and perceptually valid. Please carefully go through this process.</span></span>
</span></span>
<span id="A1.I7.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i2.p1" class="ltx_para ltx_noindent">
<span id="A1.I7.i2.p1.1" class="ltx_p"><span id="A1.I7.i2.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Each analysis should:</span></span>
<span id="A1.I7.i2.I1" class="ltx_itemize">
<span id="A1.I7.i2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A1.I7.i2.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A1.I7.i2.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I7.i2.I1.i1.p1.1" class="ltx_p"><span id="A1.I7.i2.I1.i1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Check if the described pattern/rule is actually present</span></span>
</span></span>
<span id="A1.I7.i2.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A1.I7.i2.I1.i2.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A1.I7.i2.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="A1.I7.i2.I1.i2.p1.1" class="ltx_p"><span id="A1.I7.i2.I1.i2.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Verify the logical consistency of the step</span></span>
</span></span>
<span id="A1.I7.i2.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="A1.I7.i2.I1.i3.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="A1.I7.i2.I1.i3.p1" class="ltx_para">
<span id="A1.I7.i2.I1.i3.p1.1" class="ltx_p"><span id="A1.I7.i2.I1.i3.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Confirm that conclusions follow from observations</span></span>
</span></span>
</span>
</span></span>
<span id="A1.I7.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i3.p1" class="ltx_para ltx_noindent">
<span id="A1.I7.i3.p1.1" class="ltx_p"><span id="A1.I7.i3.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">If an error is detected in any step, you should describe the nature and cause of the error in detail, and suggest how to correct the error or the correct approach.</span></span>
</span></span>
<span id="A1.I7.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i4.p1" class="ltx_para ltx_noindent">
<span id="A1.I7.i4.p1.1" class="ltx_p"><span id="A1.I7.i4.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">When the step is found to contain an error, stop further analysis of subsequent steps (as they may depend on the identified error) and directly provide the conclusion of “Incorrect” in the </span><span id="A1.I7.i4.p1.1.2" class="ltx_text ltx_font_typewriter ltx_font_italic" style="--ltx-fg-color:#000000;">&lt;conclusion&gt;</span><span id="A1.I7.i4.p1.1.3" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;"> tag.</span></span>
</span></span>
<span id="A1.I7.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i5.p1" class="ltx_para ltx_noindent">
<span id="A1.I7.i5.p1.1" class="ltx_p"><span id="A1.I7.i5.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Only material reasoning or perception errors should trigger the early termination of the analysis.</span></span>
</span></span>
<span id="A1.I7.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I7.i6.p1" class="ltx_para">
<span id="A1.I7.i6.p1.1" class="ltx_p"><span id="A1.I7.i6.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">For instance, given a solution of five steps, if an error is found in the third step, you should reply in the following format:</span></span>
</span></span>
</span><pre id="A1.SS4.SSS0.Px1.p4.pic1.p2.11" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;analysis_1&gt;
...(analysis of step 1)...
&lt;/analysis_1&gt;
&lt;analysis_2&gt;
...(analysis of step 2)...
&lt;/analysis_2&gt;
&lt;analysis_3&gt;
...(analysis of step 3; since an error is found here, also provide
detailed critique and correction guideline)...
&lt;/analysis_3&gt;
&lt;conclusion&gt;
Incorrect
&lt;/conclusion&gt;
</pre>
<span id="A1.I8" class="ltx_itemize">
<span id="A1.I8.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I8.i1.p1" class="ltx_para">
<span id="A1.I8.i1.p1.1" class="ltx_p"><span id="A1.I8.i1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Note that the analyses of steps 4 and 5 is skipped as step 3 has been found to contain an error.</span></span>
</span></span>
</span>
</span>
<span id="A1.SS4.SSS0.Px1.p4.pic1.p1" class="ltx_para ltx_noindent"><span class="ltx_rule" style="width:366.2pt;height:0.4pt;--ltx-bg-color:black;display:inline-block;"> </span>
</span>
<span id="A1.SS4.SSS0.Px1.p4.pic1.p3" class="ltx_para">
<span id="A1.SS4.SSS0.Px1.p4.pic1.p3.1" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p4.pic1.p3.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">The following is the abstract visual reasoning problem and its corresponding solution, for you to review and verify:</span></span>
<span id="A1.SS4.SSS0.Px1.p4.pic1.p3.2" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p4.pic1.p3.2.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">[Abstract Visual Reasoning Problem]</span></span><pre id="A1.SS4.SSS0.Px1.p4.pic1.p3.3" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
&lt;abstract_visual_reasoning_problem&gt;
{{ABSTRACT_VISUAL_REASONING_PROBLEM}}
&lt;/abstract_visual_reasoning_problem&gt;
</pre>
<span id="A1.SS4.SSS0.Px1.p4.pic1.p3.4" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p4.pic1.p3.4.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">[Solution]</span></span><pre id="A1.SS4.SSS0.Px1.p4.pic1.p3.5" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
&lt;solution&gt;
{{SOLUTION}}
&lt;/solution&gt;
</pre>
<span id="A1.SS4.SSS0.Px1.p4.pic1.p3.6" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p4.pic1.p3.6.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Remember:</span></span>
<span id="A1.I9" class="ltx_itemize">
<span id="A1.I9.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I9.i1.p1" class="ltx_para">
<span id="A1.I9.i1.p1.1" class="ltx_p"><span id="A1.I9.i1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">The </span><span id="A1.I9.i1.p1.1.2" class="ltx_text ltx_font_typewriter ltx_font_italic" style="--ltx-fg-color:#000000;">&lt;conclusion&gt;</span><span id="A1.I9.i1.p1.1.3" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;"> tag must contain either Correct or Incorrect, with no additional text or punctuation.</span></span>
</span></span>
