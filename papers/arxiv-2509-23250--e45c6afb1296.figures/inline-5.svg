<svg id="A1.SS4.SSS0.Px1.p6.pic1" class="ltx_picture" height="470.01" overflow="visible" version="1.1" viewbox="0 0 550 470.01" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,470.01) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 449.45 C 0 452.71 2.64 455.35 5.91 455.35 L 544.09 455.35 C 547.36 455.35 550 452.71 550 449.45 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 449.45 C 1.97 451.62 3.73 453.38 5.91 453.38 L 544.09 453.38 C 546.27 453.38 548.03 451.62 548.03 449.45 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g transform="matrix(1.0 0.0 0.0 1.0 7.87 447.48)"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" class="ltx_nestedsvg" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="matrix(1 0 0 1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 3.15 L 0 19.39 C 0 21.13 1.41 22.54 3.15 22.54 L 488.4 22.54 C 490.14 22.54 491.55 21.13 491.55 19.39 L 491.55 3.15 C 491.55 1.41 490.14 0 488.4 0 L 3.15 0 C 1.41 0 0 1.41 0 3.15 Z" /></g><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 1.18 3.15 L 1.18 19.39 C 1.18 20.47 2.06 21.35 3.15 21.35 L 488.4 21.35 C 489.49 21.35 490.37 20.47 490.37 19.39 L 490.37 3.15 C 490.37 2.06 489.49 1.18 488.4 1.18 L 3.15 1.18 C 2.06 1.18 1.18 2.06 1.18 3.15 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 9.06 7.81)"><foreignobject style="--ltx-fo-width:34.33em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="474.98"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS4.SSS0.Px1.p6.pic1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">GPT-4.1 Prompt for Mutating Perception in PuzzleVQA for PerceptionBench</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 289.52)"><foreignobject style="--ltx-fo-width:35.82em;--ltx-fo-height:10.99em;--ltx-fo-depth:19.93em;font-size:10pt;" height="427.8" overflow="visible" transform="matrix(1 0 0 -1 0 152.06)" width="495.65"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS4.SSS0.Px1.p6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.82em;">
<span id="A1.SS4.SSS0.Px1.p6.pic1.2.1" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p6.pic1.2.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">You are an expert assistant for creating training data for vision-language models.</span></span>
<span id="A1.SS4.SSS0.Px1.p6.pic1.2.2" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p6.pic1.2.2.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Your task is to take an image, a question about the image, and its correct caption that answers the question.</span></span>
<span id="A1.SS4.SSS0.Px1.p6.pic1.2.3" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p6.pic1.2.3.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">You must generate mutated captions that are fluent and natural but contain subtle factual errors with respect to the image and question context.</span></span>
<span id="A1.SS4.SSS0.Px1.p6.pic1.2.4" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p6.pic1.2.4.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Your Task is to not to answer the given question but to generate mutated captions that can serve as negative samples. 
<br class="ltx_break"></span></span>
<span id="A1.SS4.SSS0.Px1.p6.pic1.2.5" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p6.pic1.2.5.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Guidelines:</span></span>
<span id="A1.I11" class="ltx_enumerate">
<span id="A1.I11.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I11.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I11.i1.p1.1" class="ltx_p"><span id="A1.I11.i1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Maintain fluency: Captions must remain human-like and grammatically correct.</span></span>
</span></span>
<span id="A1.I11.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I11.i2.p1" class="ltx_para ltx_noindent">
<span id="A1.I11.i2.p1.1" class="ltx_p"><span id="A1.I11.i2.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Introduce only subtle mistakes relevant to the question:</span></span>
<span id="A1.I11.i2.I1" class="ltx_itemize">
<span id="A1.I11.i2.I0.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I11.i2.I0.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I11.i2.I0.i1.p1.1" class="ltx_p"><span id="A1.I11.i2.I0.i1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Change an object to a visually similar but incorrect one (dog → cat, apple → orange).</span></span>
</span></span>
<span id="A1.I11.i2.I0.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I11.i2.I0.i2.p1" class="ltx_para ltx_noindent">
<span id="A1.I11.i2.I0.i2.p1.1" class="ltx_p"><span id="A1.I11.i2.I0.i2.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Alter attributes such as color, size, number, position, or action.</span></span>
</span></span>
<span id="A1.I11.i2.I0.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I11.i2.I0.i3.p1" class="ltx_para">
<span id="A1.I11.i2.I0.i3.p1.1" class="ltx_p"><span id="A1.I11.i2.I0.i3.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Slightly modify spatial relations or other details that are relevant to answering the question.</span></span>
</span></span>
</span>
</span></span>
<span id="A1.I11.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A1.I11.i3.p1" class="ltx_para ltx_noindent">
<span id="A1.I11.i3.p1.1" class="ltx_p"><span id="A1.I11.i3.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Minimal edits: Only introduce one subtle error per mutated caption.</span></span>
</span></span>
<span id="A1.I11.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A1.I11.i4.p1" class="ltx_para ltx_noindent">
<span id="A1.I11.i4.p1.1" class="ltx_p"><span id="A1.I11.i4.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Do not generate nonsense: Captions must remain realistic and plausible, even if incorrect.</span></span>
</span></span>
<span id="A1.I11.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A1.I11.i5.p1" class="ltx_para">
<span id="A1.I11.i5.p1.1" class="ltx_p"><span id="A1.I11.i5.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Contrastive purpose: Mutated captions are intended as negative samples that could mislead a model answering the same question. Always ensure the error is contextually relevant to the question.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>