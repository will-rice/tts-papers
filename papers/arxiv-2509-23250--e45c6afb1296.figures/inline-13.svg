<br class="ltx_break"></span>The missing number is <math id="A1.SS8.SSS2.p1.pic1.m10" class="ltx_Math" alttext="5" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">5</mn><annotation encoding="application/x-tex">5</annotation></semantics></math>.<math id="A1.SS8.SSS2.p1.pic1.m11" class="ltx_Math" alttext="\backslash" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">\</mo><annotation encoding="application/x-tex">\backslash</annotation></semantics></math>boxed{c}</span></span>
