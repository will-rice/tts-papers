9.61)" width="396.32"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS4.SSS0.Px1.p2.pic1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">GPT-4.1 Rollout Prompt for RAVEN during Dataset Generation</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:35.82em;--ltx-fo-height:47.66em;--ltx-fo-depth:0.19em;font-size:10pt;" height="662.19" overflow="visible" transform="matrix(1 0 0 -1 0 659.49)" width="495.65"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS4.SSS0.Px1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.82em;">
<span id="A1.SS4.SSS0.Px1.p2.pic1.2.1" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p2.pic1.2.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">You are an abstract reasoning puzzle expert. The puzzle you will receive is presented in a standard Raven’s Progressive Matrices format: a <math id="A1.SS4.SSS0.Px1.p2.pic1.m1" class="ltx_Math" alttext="3\times 3" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">×</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></mrow><annotation encoding="application/x-tex">3\times 3</annotation></semantics></math> matrix of related images, with the bottom-right cell (the ninth tile) missing. There are eight possible answer choices provided separately, and your task is to decide which of those eight images correctly completes the <math id="A1.SS4.SSS0.Px1.p2.pic1.m2" class="ltx_Math" alttext="3\times 3" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">×</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></mrow><annotation encoding="application/x-tex">3\times 3</annotation></semantics></math> matrix pattern.</span></span>
<span id="A1.SS4.SSS0.Px1.p2.pic1.2.2" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p2.pic1.2.2.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">I will provide you with an image containing:</span></span>
<span id="A1.I1" class="ltx_itemize">
<span id="A1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I1.i1.p1.1" class="ltx_p"><span id="A1.I1.i1.p1.1.1" class="ltx_text ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#000000;">Problem Matrix:</span><span id="A1.I1.i1.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;"> An accompanying image that shows the eight tiles and highlights where the ninth is missing.</span></span>
</span></span>
<span id="A1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I1.i2.p1" class="ltx_para">
<span id="A1.I1.i2.p1.1" class="ltx_p"><span id="A1.I1.i2.p1.1.1" class="ltx_text ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#000000;">Answer Set:</span><span id="A1.I1.i2.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;"> The eight candidate images from which you must choose the best fit for the missing tile.</span></span>
</span></span>
</span>
<span id="A1.SS4.SSS0.Px1.p2.pic1.2.3" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p2.pic1.2.3.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Your task is to:</span></span>
<span id="A1.I2" class="ltx_itemize">
<span id="A1.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I2.i1.p1.1" class="ltx_p"><span id="A1.I2.i1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Review the problem matrix and the accompanying image in sequence, describing step-by-step what you see in the image in </span><span id="A1.I2.i1.p1.1.2" class="ltx_text ltx_font_typewriter ltx_font_italic" style="--ltx-fg-color:#000000;">&lt;perception&gt;</span><span id="A1.I2.i1.p1.1.3" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;"> tags.</span></span>
</span></span>
<span id="A1.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i2.p1" class="ltx_para ltx_noindent">
<span id="A1.I2.i2.p1.1" class="ltx_p"><span id="A1.I2.i2.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Reason step-by-step about the logical pattern or rule connecting the tiles in </span><span id="A1.I2.i2.p1.1.2" class="ltx_text ltx_font_typewriter ltx_font_italic" style="--ltx-fg-color:#000000;">&lt;reasoning&gt;</span><span id="A1.I2.i2.p1.1.3" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;"> tags.</span></span>
</span></span>
<span id="A1.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i3.p1" class="ltx_para">
<span id="A1.I2.i3.p1.1" class="ltx_p"><span id="A1.I2.i3.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Deduce the correct tile from the eight provided options in </span><span id="A1.I2.i3.p1.1.2" class="ltx_text ltx_font_typewriter ltx_font_italic" style="--ltx-fg-color:#000000;">&lt;correct_answer&gt;</span><span id="A1.I2.i3.p1.1.3" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;"> tags.</span></span>
</span></span>
</span>
<span id="A1.SS4.SSS0.Px1.p2.pic1.2.4" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p2.pic1.2.4.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">It is crucial that your solution contains these sections in the exact format described below:</span></span><pre id="A1.SS4.SSS0.Px1.p2.pic1.2.5" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">[Perception]
&lt;step_1&gt;
...(Step 1 of step-by-step perception)...
&lt;/step_1&gt;
&lt;step_2&gt;
...(Step 2 of step-by-step perception)...
&lt;/step_2&gt;
...
&lt;step_n&gt;
...(Step n of step-by-step perception)...
&lt;/step_n&gt;
[Reasoning]
&lt;step_1&gt;
...(Step 1 of step-by-step reasoning)...
&lt;/step_1&gt;
&lt;step_2&gt;
...(Step 2 of step-by-step reasoning)...
&lt;/step_2&gt;
...
&lt;step_m&gt;
...(Step m of step-by-step reasoning)...
&lt;/step_m&gt;
&lt;correct_answer&gt;
...(Clearly state which of the 8 candidate images is the best
candidate image as the missing tile to complete the matrix. If
the candidates are numbered, lettered, or can be uniquely
described, use that identifier.)...
&lt;/correct_answer&gt;
</pre>
<span id="A1.SS4.SSS0.Px1.p2.pic1.2.6" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p2.pic1.2.6.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Now proceed with the task.</span></span>
</span></span></span></foreignobject></g></g></svg>