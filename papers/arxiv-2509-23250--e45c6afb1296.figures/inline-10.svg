<svg id="A1.SS4.SSS0.Px1.p11.pic1" class="ltx_picture" height="427.35" overflow="visible" version="1.1" viewbox="0 0 550 427.35" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,427.35) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 406.78 C 0 410.04 2.64 412.69 5.91 412.69 L 544.09 412.69 C 547.36 412.69 550 410.04 550 406.78 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 406.78 C 1.97 408.96 3.73 410.72 5.91 410.72 L 544.09 410.72 C 546.27 410.72 548.03 408.96 548.03 406.78 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g transform="matrix(1.0 0.0 0.0 1.0 7.87 404.81)"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" class="ltx_nestedsvg" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="matrix(1 0 0 1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 3.15 L 0 19.39 C 0 21.13 1.41 22.54 3.15 22.54 L 467.85 22.54 C 469.59 22.54 471 21.13 471 19.39 L 471 3.15 C 471 1.41 469.59 0 467.85 0 L 3.15 0 C 1.41 0 0 1.41 0 3.15 Z" /></g><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 1.18 3.15 L 1.18 19.39 C 1.18 20.47 2.06 21.35 3.15 21.35 L 467.85 21.35 C 468.94 21.35 469.82 20.47 469.82 19.39 L 469.82 3.15 C 469.82 2.06 468.94 1.18 467.85 1.18 L 3.15 1.18 C 2.06 1.18 1.18 2.06 1.18 3.15 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 9.06 7.81)"><foreignobject style="--ltx-fo-width:32.81em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="454.05"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS4.SSS0.Px1.p11.pic1.1" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#FFFFFF;">Qwen-VL-PRM-3B<span id="A1.SS4.SSS0.Px1.p11.pic1.1.1" class="ltx_text ltx_font_upright"> and </span>Qwen-VL-PRM-7B<span id="A1.SS4.SSS0.Px1.p11.pic1.1.2" class="ltx_text ltx_font_upright"> Prompt for Step Level Scoring</span></span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:35.82em;--ltx-fo-height:27.64em;--ltx-fo-depth:0.19em;font-size:10pt;" height="385.13" overflow="visible" transform="matrix(1 0 0 -1 0 382.44)" width="495.65"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS4.SSS0.Px1.p11.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.82em;">
<span id="A1.SS4.SSS0.Px1.p11.pic1.2.1" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p11.pic1.2.1.1" class="ltx_text ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#000000;">You are a process supervision model for visual reasoning tasks. You will receive an image and an image-based problem statement, followed by solution steps to evaluate.<span id="A1.SS4.SSS0.Px1.p11.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="A1.SS4.SSS0.Px1.p11.pic1.2.2" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p11.pic1.2.2.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">First round: problem statement and first solution step.</span></span>
<span id="A1.SS4.SSS0.Px1.p11.pic1.2.3" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p11.pic1.2.3.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Subsequent rounds: one new step per round.</span></span>
<span id="A1.SS4.SSS0.Px1.p11.pic1.2.4" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p11.pic1.2.4.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Assess the cumulative correctness of the entire solution up to each step.</span></span>
<span id="A1.SS4.SSS0.Px1.p11.pic1.2.5" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p11.pic1.2.5.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Evaluation Criteria:</span></span>
<span id="A1.I12" class="ltx_enumerate">
<span id="A1.I12.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I12.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I12.i1.p1.1" class="ltx_p"><span id="A1.I12.i1.p1.1.1" class="ltx_text ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#000000;">Visual Accuracy</span><span id="A1.I12.i1.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">: Are visual elements from the image correctly identified (shapes, colors, positions, quantities, spatial relationships)?</span></span>
</span></span>
<span id="A1.I12.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I12.i2.p1" class="ltx_para">
<span id="A1.I12.i2.p1.1" class="ltx_p"><span id="A1.I12.i2.p1.1.1" class="ltx_text ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#000000;">Logical Validity</span><span id="A1.I12.i2.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">: Do all inferences and calculations follow correctly from the image and previous steps?</span></span>
</span></span>
</span>
<span id="A1.SS4.SSS0.Px1.p11.pic1.2.6" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p11.pic1.2.6.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Response:</span></span>
<span id="A1.I13" class="ltx_itemize">
<span id="A1.I13.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I13.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I13.i1.p1.1" class="ltx_p"><span id="A1.I13.i1.p1.1.1" class="ltx_text ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#000000;">”+”</span><span id="A1.I13.i1.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;"> if correct up to this step</span></span>
</span></span>
<span id="A1.I13.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I13.i2.p1" class="ltx_para">
<span id="A1.I13.i2.p1.1" class="ltx_p"><span id="A1.I13.i2.p1.1.1" class="ltx_text ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#000000;">”-”</span><span id="A1.I13.i2.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;"> if any error exists up to this step</span></span>
</span></span>
</span>
<span id="A1.SS4.SSS0.Px1.p11.pic1.2.7" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p11.pic1.2.7.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Only respond with ”+” or ”-”. No explanations.</span></span>
<span id="A1.SS4.SSS0.Px1.p11.pic1.2.8" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p11.pic1.2.8.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">An error in any step invalidates all subsequent steps.</span></span>
</span></span></span></foreignobject></g></g></svg>