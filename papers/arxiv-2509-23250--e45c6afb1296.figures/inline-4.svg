<svg id="A1.SS4.SSS0.Px1.p5.pic1" class="ltx_picture" height="295.21" overflow="visible" version="1.1" viewbox="0 0 550 295.21" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,295.21) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 274.64 C 0 277.9 2.64 280.55 5.91 280.55 L 544.09 280.55 C 547.36 280.55 550 277.9 550 274.64 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 274.64 C 1.97 276.81 3.73 278.58 5.91 278.58 L 544.09 278.58 C 546.27 278.58 548.03 276.81 548.03 274.64 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g transform="matrix(1.0 0.0 0.0 1.0 7.87 272.67)"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" class="ltx_nestedsvg" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="matrix(1 0 0 1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 3.15 L 0 19.39 C 0 21.13 1.41 22.54 3.15 22.54 L 556.55 22.54 C 558.29 22.54 559.7 21.13 559.7 19.39 L 559.7 3.15 C 559.7 1.41 558.29 0 556.55 0 L 3.15 0 C 1.41 0 0 1.41 0 3.15 Z" /></g><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 1.18 3.15 L 1.18 19.39 C 1.18 20.47 2.06 21.35 3.15 21.35 L 556.55 21.35 C 557.63 21.35 558.51 20.47 558.51 19.39 L 558.51 3.15 C 558.51 2.06 557.63 1.18 556.55 1.18 L 3.15 1.18 C 2.06 1.18 1.18 2.06 1.18 3.15 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 9.06 7.81)"><foreignobject style="--ltx-fo-width:39.2em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="542.36"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS4.SSS0.Px1.p5.pic1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">GPT-4.1 Prompt for Rephrasing template perception in PuzzleVQA for PerceptionBench</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 98.11)"><foreignobject style="--ltx-fo-width:35.82em;--ltx-fo-height:12.19em;--ltx-fo-depth:6.09em;font-size:10pt;" height="252.99" overflow="visible" transform="matrix(1 0 0 -1 0 168.66)" width="495.65"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS4.SSS0.Px1.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.82em;">
<span id="A1.SS4.SSS0.Px1.p5.pic1.2.1" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p5.pic1.2.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">You are an expert assistant for creating training data for vision-language models.</span></span>
<span id="A1.SS4.SSS0.Px1.p5.pic1.2.2" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p5.pic1.2.2.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Your task is to take an image, a question about the image, and its template based caption that provides visual perception of the image relevant to answering the question.</span></span>
<span id="A1.SS4.SSS0.Px1.p5.pic1.2.3" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p5.pic1.2.3.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">You must generate rephrased captions that are fluent, natural and contain all the information from the template based caption.</span></span>
<span id="A1.SS4.SSS0.Px1.p5.pic1.2.4" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p5.pic1.2.4.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Your Task is to not to answer the given question but to rephrase captions so they are more natural than the template based captions. 
<br class="ltx_break"></span></span>
<span id="A1.SS4.SSS0.Px1.p5.pic1.2.5" class="ltx_p"><span id="A1.SS4.SSS0.Px1.p5.pic1.2.5.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Guidelines:</span></span>
<span id="A1.I10" class="ltx_enumerate">
<span id="A1.I10.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I10.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I10.i1.p1.1" class="ltx_p"><span id="A1.I10.i1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Maintain fluency: Captions must remain human-like and grammatically correct.</span></span>
</span></span>
<span id="A1.I10.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I10.i2.p1" class="ltx_para ltx_noindent">
<span id="A1.I10.i2.p1.1" class="ltx_p"><span id="A1.I10.i2.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Do not change the content: Rephrased captions must remain correct and contain the information from the original caption.</span></span>
</span></span>
<span id="A1.I10.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A1.I10.i3.p1" class="ltx_para">
<span id="A1.I10.i3.p1.1" class="ltx_p"><span id="A1.I10.i3.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Generate only the Rephrased Caption</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>