<svg id="A6.SS4.p3.pic1" class="ltx_picture" height="1081.82" overflow="visible" version="1.1" viewbox="0 0 477.38 1081.82" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1081.82) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#E6E6E6;" fill="#E6E6E6" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 1081.82 L 477.38 1081.82 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 0.69 L 0.69 1051.84 L 476.68 1051.84 L 476.68 0.69 Z" /></g><g style="--ltx-fill-color:#FF6347;" fill="#FF6347" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 1052.53 L 0.69 1081.13 L 476.68 1081.13 L 476.68 1052.53 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.45 1062.68)"><foreignobject style="--ltx-fo-width:23.26em;--ltx-fo-height:0.83em;--ltx-fo-depth:0.23em;font-size:10pt;" height="14.76" overflow="visible" transform="matrix(1 0 0 -1 0 11.53)" width="321.85"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS4.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:23.26em;">
<span id="A6.SS4.p3.pic1.1.1" class="ltx_p"><span id="A6.SS4.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:120%;--ltx-fg-color:#000000;">Instructions for Naturalness Listening Test.</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.45 21.45)"><foreignobject style="--ltx-fo-width:31.4em;--ltx-fo-height:72.97em;--ltx-fo-depth:0em;font-size:10pt;" height="1009.65" overflow="visible" transform="matrix(1 0 0 -1 0 1009.65)" width="434.49"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A6.SS4.p3.pic1.2" class="ltx_inline-sectional-block ltx_minipage">
                    
<span id="A6.SS4.p3.pic1.p1" class="ltx_para">
<span id="A6.SS4.p3.pic1.p1.1" class="ltx_p"><span id="A6.SS4.p3.pic1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">In each question, you will read a text line and listen to audio samples. Please rate the audio samples based <span id="A6.SS4.p3.pic1.p1.1.1.1" class="ltx_text ltx_font_bold">only</span> on the following criteria:</span></span>
<span id="A6.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="A6.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I1.i1.p1" class="ltx_para">
<span id="A6.I1.i1.p1.1" class="ltx_p"><span id="A6.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Naturalness</span><span id="A6.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Is the speech fluid and human-like (natural speed, correct stress on words, logical pauses, good intonation), or more robotic and unnatural?</span></span>
</span></span>
</span>
</span>
                    
<section id="A6.SSx1" class="ltx_subsection">
<h3 class="ltx_title ltx_title_subsection" style="--ltx-fg-color:#000000;">Important Guidelines</h3>

<span id="A6.SSx1.p1" class="ltx_para">
<span id="A6.I2" class="ltx_itemize ltx_leftmargin_flush">
<span id="A6.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I2.i1.p1" class="ltx_para">
<span id="A6.I2.i1.p1.1" class="ltx_p"><span id="A6.I2.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Strictly</span><span id="A6.I2.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> evaluate how </span><span id="A6.I2.i1.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">natural</span><span id="A6.I2.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> the speech sounds given the text prompt.</span></span>
</span></span>
<span id="A6.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I2.i2.p1" class="ltx_para">
<span id="A6.I2.i2.p1.1" class="ltx_p"><span id="A6.I2.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Disregard text content</span><span id="A6.I2.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Ignore </span><span id="A6.I2.i2.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">WHAT</span><span id="A6.I2.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> is said, instead focus on </span><span id="A6.I2.i2.p1.1.5" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">HOW</span><span id="A6.I2.i2.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> it is said.</span></span>
</span></span>
<span id="A6.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I2.i3.p1" class="ltx_para">
<span id="A6.I2.i3.p1.1" class="ltx_p"><span id="A6.I2.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Disregard speaking style</span><span id="A6.I2.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Ignore the acting performance or emotion, unless it severely impacts naturalness.</span></span>
</span></span>
<span id="A6.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I2.i4.p1" class="ltx_para">
<span id="A6.I2.i4.p1.1" class="ltx_p"><span id="A6.I2.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Disregard audio quality</span><span id="A6.I2.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Ignore minor audio artifacts, unless they severely impact naturalness.</span></span>
</span></span>
<span id="A6.I2.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I2.i5.p1" class="ltx_para">
<span id="A6.I2.i5.p1.1" class="ltx_p"><span id="A6.I2.i5.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Disregard speaker identity</span><span id="A6.I2.i5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: The generated voice may sound like a different person. This is fine.</span></span>
</span></span>
<span id="A6.I2.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I2.i6.p1" class="ltx_para">
<span id="A6.I2.i6.p1.1" class="ltx_p"><span id="A6.I2.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Different samples can receive the </span><span id="A6.I2.i6.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">same score</span><span id="A6.I2.i6.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> if similar.</span></span>
</span></span>
</span>
</span>
</section>
                    
<section id="A6.SSx2" class="ltx_subsection">
<h3 class="ltx_title ltx_title_subsection" style="--ltx-fg-color:#000000;">Scoring Guidance</h3>

<span id="A6.SSx2.p1" class="ltx_para">
<span id="A6.I3" class="ltx_itemize ltx_leftmargin_flush">
<span id="A6.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I3.i1.p1" class="ltx_para">
<span id="A6.I3.i1.p1.1" class="ltx_p"><span id="A6.I3.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">80 - 100: Excellent (Very Natural)</span></span>
<span id="A6.I3.i1.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:1em;">
<span id="A6.I3.i1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">–</span> 
<span id="A6.I3.i1.I1.i1.p1" class="ltx_para">
<span id="A6.I3.i1.I1.i1.p1.1" class="ltx_p"><span id="A6.I3.i1.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Sounds like a real human speaking.</span></span>
</span></span>
</span>
</span></span>
<span id="A6.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I3.i2.p1" class="ltx_para">
<span id="A6.I3.i2.p1.1" class="ltx_p"><span id="A6.I3.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">60 - 80: Good (Natural)</span></span>
<span id="A6.I3.i2.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:1em;">
<span id="A6.I3.i2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">–</span> 
<span id="A6.I3.i2.I1.i1.p1" class="ltx_para">
<span id="A6.I3.i2.I1.i1.p1.1" class="ltx_p"><span id="A6.I3.i2.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Mostly natural with minor robotic elements.</span></span>
</span></span>
</span>
</span></span>
<span id="A6.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I3.i3.p1" class="ltx_para">
<span id="A6.I3.i3.p1.1" class="ltx_p"><span id="A6.I3.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">40 - 60: Fair (Somewhat Natural)</span></span>
<span id="A6.I3.i3.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:1em;">
<span id="A6.I3.i3.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">–</span> 
<span id="A6.I3.i3.I1.i1.p1" class="ltx_para">
<span id="A6.I3.i3.I1.i1.p1.1" class="ltx_p"><span id="A6.I3.i3.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Noticeable robotic or unnatural qualities.</span></span>
</span></span>
</span>
</span></span>
<span id="A6.I3.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I3.i4.p1" class="ltx_para">
<span id="A6.I3.i4.p1.1" class="ltx_p"><span id="A6.I3.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">20 - 40: Poor (Mostly Unnatural)</span></span>
<span id="A6.I3.i4.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:1em;">
<span id="A6.I3.i4.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">–</span> 
<span id="A6.I3.i4.I1.i1.p1" class="ltx_para">
<span id="A6.I3.i4.I1.i1.p1.1" class="ltx_p"><span id="A6.I3.i4.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Predominantly robotic or synthetic sounding.</span></span>
</span></span>
</span>
</span></span>
<span id="A6.I3.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I3.i5.p1" class="ltx_para">
<span id="A6.I3.i5.p1.1" class="ltx_p"><span id="A6.I3.i5.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">0 - 20: Bad (Unusable)</span></span>
<span id="A6.I3.i5.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:1em;">
<span id="A6.I3.i5.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">–</span> 
<span id="A6.I3.i5.I1.i1.p1" class="ltx_para">
<span id="A6.I3.i5.I1.i1.p1.1" class="ltx_p"><span id="A6.I3.i5.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Completely unnatural, or severe quality issues.</span></span>
</span></span>
</span>
</span></span>
</span>
</span>
</section>
                  </span></span></span></foreignobject></g></g></svg>