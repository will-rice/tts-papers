<svg id="A6.SS4.p5.pic1" class="ltx_picture" height="1137.56" overflow="visible" version="1.1" viewbox="0 0 477.38 1137.56" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1137.56) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#E6E6E6;" fill="#E6E6E6" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 1137.56 L 477.38 1137.56 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 0.69 L 0.69 1107.57 L 476.68 1107.57 L 476.68 0.69 Z" /></g><g style="--ltx-fill-color:#FF6347;" fill="#FF6347" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 1108.27 L 0.69 1136.86 L 476.68 1136.86 L 476.68 1108.27 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.45 1118.41)"><foreignobject style="--ltx-fo-width:23.26em;--ltx-fo-height:0.83em;--ltx-fo-depth:0.23em;font-size:10pt;" height="14.76" overflow="visible" transform="matrix(1 0 0 -1 0 11.53)" width="321.85"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS4.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:23.26em;">
<span id="A6.SS4.p5.pic1.1.1" class="ltx_p"><span id="A6.SS4.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:120%;--ltx-fg-color:#000000;">Instructions for Reference Similarity Listening Test.</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.45 21.45)"><foreignobject style="--ltx-fo-width:31.4em;--ltx-fo-height:77em;--ltx-fo-depth:0em;font-size:10pt;" height="1065.38" overflow="visible" transform="matrix(1 0 0 -1 0 1065.38)" width="434.49"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A6.SS4.p5.pic1.2" class="ltx_inline-sectional-block ltx_minipage">
                    
<span id="A6.SS4.p5.pic1.p1" class="ltx_para">
<span id="A6.SS4.p5.pic1.p1.1" class="ltx_p"><span id="A6.SS4.p5.pic1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">In each question, you will listen to a <span id="A6.SS4.p5.pic1.p1.1.1.1" class="ltx_text ltx_font_bold">reference audio</span> and several generated audio samples. Please rate the audio samples based <span id="A6.SS4.p5.pic1.p1.1.1.2" class="ltx_text ltx_font_bold">only</span> on the following criteria:</span></span>
<span id="A6.I4" class="ltx_itemize ltx_leftmargin_flush">
<span id="A6.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I4.i1.p1" class="ltx_para">
<span id="A6.I4.i1.p1.1" class="ltx_p"><span id="A6.I4.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Timbre</span><span id="A6.I4.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Does the voice have the same texture and pitch range as the reference?</span></span>
</span></span>
<span id="A6.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I4.i2.p1" class="ltx_para">
<span id="A6.I4.i2.p1.1" class="ltx_p"><span id="A6.I4.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Identity</span><span id="A6.I4.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: If you closed your eyes, would you think this is the same person speaking?</span></span>
</span></span>
<span id="A6.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I4.i3.p1" class="ltx_para">
<span id="A6.I4.i3.p1.1" class="ltx_p"><span id="A6.I4.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Recording condition</span><span id="A6.I4.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Does it seem like the generated audio was recorded in the same recording conditions as the reference?</span></span>
</span></span>
</span>
</span>
                    
<section id="A6.SSx3" class="ltx_subsection">
<h3 class="ltx_title ltx_title_subsection" style="--ltx-fg-color:#000000;">Important Guidelines</h3>

<span id="A6.SSx3.p1" class="ltx_para">
<span id="A6.I5" class="ltx_itemize ltx_leftmargin_flush">
<span id="A6.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I5.i1.p1" class="ltx_para">
<span id="A6.I5.i1.p1.1" class="ltx_p"><span id="A6.I5.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Strictly</span><span id="A6.I5.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> evaluate how similar the audio samples are to the reference in terms of speaker identity and recording conditions.</span></span>
</span></span>
<span id="A6.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I5.i2.p1" class="ltx_para">
<span id="A6.I5.i2.p1.1" class="ltx_p"><span id="A6.I5.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Disregard speaking style</span><span id="A6.I5.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Ignore the acting performance, emotion, or fine-grained prosody, unless it severely impacts the similarity.</span></span>
</span></span>
<span id="A6.I5.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I5.i3.p1" class="ltx_para">
<span id="A6.I5.i3.p1.1" class="ltx_p"><span id="A6.I5.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Disregard text content</span><span id="A6.I5.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Ignore what is said, pronunciation or intelligibility, unless it severely impacts the similarity.</span></span>
</span></span>
<span id="A6.I5.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I5.i4.p1" class="ltx_para">
<span id="A6.I5.i4.p1.1" class="ltx_p"><span id="A6.I5.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Different samples can receive the </span><span id="A6.I5.i4.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">same score</span><span id="A6.I5.i4.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> if similar.</span></span>
</span></span>
</span>
</span>
</section>
                    
<section id="A6.SSx4" class="ltx_subsection">
<h3 class="ltx_title ltx_title_subsection" style="--ltx-fg-color:#000000;">Scoring Guidance</h3>

<span id="A6.SSx4.p1" class="ltx_para">
<span id="A6.I6" class="ltx_itemize ltx_leftmargin_flush">
<span id="A6.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I6.i1.p1" class="ltx_para">
<span id="A6.I6.i1.p1.1" class="ltx_p"><span id="A6.I6.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">80 - 100: Identical</span></span>
<span id="A6.I6.i1.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:1em;">
<span id="A6.I6.i1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">–</span> 
<span id="A6.I6.i1.I1.i1.p1" class="ltx_para">
<span id="A6.I6.i1.I1.i1.p1.1" class="ltx_p"><span id="A6.I6.i1.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Indistinguishable speaker identity and recording conditions. Definitely the same as the reference.</span></span>
</span></span>
</span>
</span></span>
<span id="A6.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I6.i2.p1" class="ltx_para">
<span id="A6.I6.i2.p1.1" class="ltx_p"><span id="A6.I6.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">60 - 80: Very Close</span></span>
<span id="A6.I6.i2.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:1em;">
<span id="A6.I6.i2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">–</span> 
<span id="A6.I6.i2.I1.i1.p1" class="ltx_para">
<span id="A6.I6.i2.I1.i1.p1.1" class="ltx_p"><span id="A6.I6.i2.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Sounds like the same speaker and recording conditions, but with slight identity or acoustic differences.</span></span>
</span></span>
</span>
</span></span>
<span id="A6.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I6.i3.p1" class="ltx_para">
<span id="A6.I6.i3.p1.1" class="ltx_p"><span id="A6.I6.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">40 - 60: Similar</span></span>
<span id="A6.I6.i3.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:1em;">
<span id="A6.I6.i3.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">–</span> 
<span id="A6.I6.i3.I1.i1.p1" class="ltx_para">
<span id="A6.I6.i3.I1.i1.p1.1" class="ltx_p"><span id="A6.I6.i3.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Sounds like a family member or a good impression, but with noticeable mismatch to the reference. Sounds like it was recorded in a similar environment but with acoustic differences.</span></span>
</span></span>
</span>
</span></span>
<span id="A6.I6.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I6.i4.p1" class="ltx_para">
<span id="A6.I6.i4.p1.1" class="ltx_p"><span id="A6.I6.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">20 - 40: Different</span></span>
<span id="A6.I6.i4.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:1em;">
<span id="A6.I6.i4.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">–</span> 
<span id="A6.I6.i4.I1.i1.p1" class="ltx_para">
<span id="A6.I6.i4.I1.i1.p1.1" class="ltx_p"><span id="A6.I6.i4.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Vaguely similar pitch, but clearly a different person or recorded in a different environment.</span></span>
</span></span>
</span>
</span></span>
<span id="A6.I6.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I6.i5.p1" class="ltx_para">
<span id="A6.I6.i5.p1.1" class="ltx_p"><span id="A6.I6.i5.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">0 - 20: No Similarity</span></span>
<span id="A6.I6.i5.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:1em;">
<span id="A6.I6.i5.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">–</span> 
<span id="A6.I6.i5.I1.i1.p1" class="ltx_para">
<span id="A6.I6.i5.I1.i1.p1.1" class="ltx_p"><span id="A6.I6.i5.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Complete mismatch. Completely different identity or recording conditions.</span></span>
</span></span>
</span>
</span></span>
</span>
</span>
</section>
                  </span></span></span></foreignobject></g></g></svg>