<svg id="A1.SS7.p3.pic1" class="ltx_picture" height="914.9" overflow="visible" version="1.1" viewbox="0 0 477.38 914.9" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,914.9) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#808080;" fill="#808080" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 908.99 C 0 912.25 2.64 914.9 5.91 914.9 L 471.47 914.9 C 474.73 914.9 477.38 912.25 477.38 908.99 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 890.79 L 475.41 890.79 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 899.38)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS7.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A1.SS7.p3.pic1.1.1" class="ltx_p"><span id="A1.SS7.p3.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">LLM Prompt for Initial Guidelines</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:62.33em;--ltx-fo-depth:0.19em;font-size:10pt;" height="865.21" overflow="visible" transform="matrix(1 0 0 -1 0 862.52)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS7.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A1.SS7.p3.pic1.2.1" class="ltx_p"><span id="A1.SS7.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">[System Prompt] You are an expert in parameter optimization.</span></span>
<span id="A1.SS7.p3.pic1.2.2" class="ltx_p"><span id="A1.SS7.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">[User Prompt]
I am tuning test-time parameters for a complex task that can be broken down into multiple simple subtasks. The parameters include the model size and the number of samples used for each subtask. Generally, increasing the number of samples improves performance. The goal is to find the best parameter settings that maximize performance within a fixed budget.</span></span>
<span id="A1.SS7.p3.pic1.2.3" class="ltx_p"><span id="A1.SS7.p3.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">I will provide the task name, description, budget, and initial search history. Please help me summarize the guidelines from the search history in the following aspect:</span></span>
<span id="A1.SS7.p3.pic1.2.4" class="ltx_p"><span id="A1.SS7.p3.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. The search history includes initial trials that use different model sizes under the same unit budget. In these trials, smaller models are allowed more samples, while larger models have fewer samples due to their higher cost. Please help me identify which model size we should explore further in each subtask. If the large model performs significantly better than the small model, we will choose the large one. Otherwise, if its performance is similar or only slightly better, we will prefer the smaller model.</span></span>
<span id="A1.SS7.p3.pic1.2.5" class="ltx_p"><span id="A1.SS7.p3.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. As the number of samples increases, performance tends to improve and then level off. Please identify the search direction for finding the optimal number of samples for each subtask, especially the point after which more samples no longer improve results.</span></span>
<span id="A1.SS7.p3.pic1.2.6" class="ltx_p"><span id="A1.SS7.p3.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. The total compute budget is shared across all subtasks and they are interdependent. If we could not assign the optimal model and sample count to every subtask, consider the following strategy. Leveraging your planning capability, prioritize each subtask, try different combinations of budget allocations for the other tasks, and balance the allocations across subtasks.</span></span>
<span id="A1.SS7.p3.pic1.2.7" class="ltx_p"><span id="A1.SS7.p3.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Inputs:</span></span>
<span id="A1.I2" class="ltx_itemize ltx_leftmargin_flush">
<span id="A1.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i1.p1" class="ltx_para">
<span id="A1.I2.i1.p1.1" class="ltx_p"><span id="A1.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Task name: </span><span id="A1.I2.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{task_name}</span></span>
</span></span>
<span id="A1.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i2.p1" class="ltx_para">
<span id="A1.I2.i2.p1.1" class="ltx_p"><span id="A1.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Task description: </span><span id="A1.I2.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{task_desc}</span></span>
</span></span>
<span id="A1.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i3.p1" class="ltx_para">
<span id="A1.I2.i3.p1.1" class="ltx_p"><span id="A1.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Subtasks, models, prompt/generation lengths: </span><span id="A1.I2.i3.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{subtask_specification}</span><span id="A1.I2.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="A1.I2.i3.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{model_space}</span></span>
</span></span>
<span id="A1.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i4.p1" class="ltx_para">
<span id="A1.I2.i4.p1.1" class="ltx_p"><span id="A1.I2.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Total budget: </span><span id="A1.I2.i4.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{budget}</span></span>
</span></span>
<span id="A1.I2.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i5.p1" class="ltx_para">
<span id="A1.I2.i5.p1.1" class="ltx_p"><span id="A1.I2.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Evaluation metrics: </span><span id="A1.I2.i5.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{metrics}</span></span>
</span></span>
<span id="A1.I2.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i6.p1" class="ltx_para">
<span id="A1.I2.i6.p1.1" class="ltx_p"><span id="A1.I2.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Main metric: </span><span id="A1.I2.i6.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{main_metric}</span></span>
</span></span>
<span id="A1.I2.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A1.I2.i7.p1" class="ltx_para">
<span id="A1.I2.i7.p1.1" class="ltx_p"><span id="A1.I2.i7.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Search history: </span><span id="A1.I2.i7.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{history}</span></span>
</span></span>
</span>
<span id="A1.SS7.p3.pic1.2.8" class="ltx_p"><span id="A1.SS7.p3.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Please generate your response in the most concise wording.</span></span>
<span id="A1.SS7.p3.pic1.2.9" class="ltx_p"><span id="A1.SS7.p3.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">Response:</span></span>
