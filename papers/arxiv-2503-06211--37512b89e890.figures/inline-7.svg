<section id="S5.SS0.SSS0.Px6" class="ltx_paragraph">
<h3 class="ltx_title ltx_title_paragraph" style="--ltx-fg-color:#000000;">Key insight:</h3>

<span id="S5.SS0.SSS0.Px6.p1" class="ltx_para">
<span id="S5.SS0.SSS0.Px6.p1.1" class="ltx_p"><span id="S5.SS0.SSS0.Px6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Late fusion delivers the largest gains in perceptual understanding, which also improves generation, while late fission is most important for perceptual generation; attention residuals add further gains, especially in cross-modal settings.</span></span>
</span>
</section>
