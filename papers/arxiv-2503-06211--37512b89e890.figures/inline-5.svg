<section id="S5.SS0.SSS0.Px3" class="ltx_paragraph">
<h3 class="ltx_title ltx_title_paragraph" style="--ltx-fg-color:#000000;">Key insight:</h3>

<span id="S5.SS0.SSS0.Px3.p1" class="ltx_para">
<span id="S5.SS0.SSS0.Px3.p1.1" class="ltx_p"><span id="S5.SS0.SSS0.Px3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Late fission prevents the late layers of the pretrained model from being repurposed for fine-grained modeling, preserving pretrained next-word prediction.</span></span>
</span>
