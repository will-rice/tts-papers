<h3 class="ltx_title ltx_title_paragraph" style="--ltx-fg-color:#000000;">Hyp.</h3>

<span id="S3.SS0.SSS0.Px2.p1" class="ltx_para">
<span id="S3.SS0.SSS0.Px2.p1.1" class="ltx_p"><span id="S3.SS0.SSS0.Px2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Multimodal adaptation benefits from late fusion for additional fine-to-coarse processing before the pretrained text backbone and late fission for additional coarse-to-fine processing after it to better match expected layerwise abstraction levels.</span></span>
