<span id="S5.SS0.SSS0.Px1.p6.pic1.1.1" class="ltx_p"><span id="S5.SS0.SSS0.Px1.p6.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#13235A;">Lesson.<span id="S5.SS0.SSS0.Px1.p6.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> Score the whole chain during training, and fine-tune the vocoder on generated mels early. Our first pair came after 17,000 fine-tune steps, about 34 minutes on one H200, and moved WER from 3.78% to 2.12%.</span></span></span>
