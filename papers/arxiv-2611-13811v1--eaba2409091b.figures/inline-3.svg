<span id="S4.SS0.SSS0.Px1.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.04em;">
<span id="S4.SS0.SSS0.Px1.p3.pic1.1.1" class="ltx_p"><span id="S4.SS0.SSS0.Px1.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#13235A;">Lesson.<span id="S4.SS0.SSS0.Px1.p3.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> After the first step, assert that every trainable module has a gradient. Our first launch crashed on an unused-parameter error, which was this bug’s symptom. We silenced it with <span id="S4.SS0.SSS0.Px1.p3.pic1.1.1.1.1.1" class="ltx_text ltx_font_typewriter">find_unused_parameters=True</span> before we knew the cause.</span></span></span>
