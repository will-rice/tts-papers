<span id="S7.SS0.SSS0.Px9.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.04em;">
<span id="S7.SS0.SSS0.Px9.p3.pic1.1.1" class="ltx_p"><span id="S7.SS0.SSS0.Px9.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#13235A;">Lesson.<span id="S7.SS0.SSS0.Px9.p3.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> Freeze the output EQ before using UTMOS to compare checkpoints. On the same weights, four EQ settings span UTMOS 3.16 to 3.25 on our own harness (Figure <a href="#S7.F19" title="Figure 19 ‣ UTMOS and the output EQ. ‣ 7 Evaluation" class="ltx_ref"><span class="ltx_text ltx_ref_tag">19</span></a>b). With the first vocoder fine-tune, UTMOS rose with more bass and less treble while WER stayed flat (24 runs, seed 0).</span></span></span>
</span></span></span></foreignobject></g></g></svg>