<span id="S36.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.31em;">
<span id="S36.p2.pic1.1.1" class="ltx_p"><span id="S36.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Key takeaways</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 181.67)"><foreignobject style="--ltx-fo-width:36.54em;--ltx-fo-height:1.75em;--ltx-fo-depth:12.39em;font-size:10pt;" height="195.72" overflow="visible" transform="matrix(1 0 0 -1 0 24.22)" width="505.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S36.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.54em;">
<span id="S36.I1" class="ltx_itemize">
<span id="S36.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S36.I1.i1.p1" class="ltx_para">
<span id="S36.I1.i1.p1.1" class="ltx_p"><span id="S36.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Video-to-music systems extend the conditioning route (slot 3) with a second alignment, temporal as well as semantic, and leave the paradigms unchanged. The branch surveys cited in Section </span><a href="#S34" title="34 Cross-Modal Scoring ‣ Chapter 10 Boundaries and Adjacent Areas ‣ A Tutorial on Generative Models for Music Audio" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">34</span></a><span id="S36.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> cover them in depth.</span></span>
</span></span>
<span id="S36.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S36.I1.i2.p1" class="ltx_para">
<span id="S36.I1.i2.p1.1" class="ltx_p"><span id="S36.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Unified systems come in two designs, a language model that routes to generators and a single model that understands and generates, with multi-agent composition as a third pattern that so far lives mostly in the symbolic domain.</span></span>
</span></span>
<span id="S36.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S36.I1.i3.p1" class="ltx_para">
<span id="S36.I1.i3.p1.1" class="ltx_p"><span id="S36.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Symbolic generation matters to audio systems as a control layer and as the place where co-creation interfaces are studied. The two threads meet in the sketch representations of D1.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>