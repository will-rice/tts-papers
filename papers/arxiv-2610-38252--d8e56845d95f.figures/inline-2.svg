<span id="S11.SS0.SSS0.Px1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.31em;">
<span id="S11.SS0.SSS0.Px1.p2.pic1.1.1" class="ltx_p"><span id="S11.SS0.SSS0.Px1.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Key takeaways</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 228.79)"><foreignobject style="--ltx-fo-width:36.54em;--ltx-fo-height:1.69em;--ltx-fo-depth:15.8em;font-size:10pt;" height="242.07" overflow="visible" transform="matrix(1 0 0 -1 0 23.45)" width="505.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S11.SS0.SSS0.Px1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.54em;">
<span id="S11.I1" class="ltx_itemize">
<span id="S11.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S11.I1.i1.p1" class="ltx_para">
<span id="S11.I1.i1.p1.1" class="ltx_p"><span id="S11.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Every system fills four slots: a representation, a factorization, a route for the condition, and a sampler. The comparison framework’s first three dimensions correspond to the representation, generative method, and conditioning route. The fourth and fifth dimensions, the application class and the artifact attributes, describe use and release.</span></span>
</span></span>
<span id="S11.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S11.I1.i2.p1" class="ltx_para">
<span id="S11.I1.i2.p1.1" class="ltx_p"><span id="S11.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The five paradigms differ in how the number of sequential steps scales: with the token count for autoregressive models, with the sampler’s step count for diffusion and flow models, and with both for a planner-renderer pair. Wall time also depends on the cost of each step and on the hardware.</span></span>
</span></span>
<span id="S11.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S11.I1.i3.p1" class="ltx_para">
<span id="S11.I1.i3.p1.1" class="ltx_p"><span id="S11.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">A distribution distance depends on its encoder, its reference set, and its sample size, and the plug-in estimate of the Fréchet distance is biased at finite sample sizes.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>