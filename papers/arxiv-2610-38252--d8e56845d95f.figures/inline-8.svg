<span id="S40.p3.pic1.1.1" class="ltx_p"><span id="S40.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Key takeaways</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 198.27)"><foreignobject style="--ltx-fo-width:36.54em;--ltx-fo-height:1.69em;--ltx-fo-depth:13.59em;font-size:10pt;" height="211.55" overflow="visible" transform="matrix(1 0 0 -1 0 23.45)" width="505.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S40.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.54em;">
<span id="S40.I2" class="ltx_itemize">
<span id="S40.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S40.I2.i1.p1" class="ltx_para">
<span id="S40.I2.i1.p1.1" class="ltx_p"><span id="S40.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">A distribution distance depends on its encoder, its reference set, and its sample size. The plug-in FAD estimate is biased at finite sample sizes, an unbiased MMD estimate avoids that bias and remains variable, and agreement with listeners depends on the metric, the embedding, and the evaluation population. Report those choices with the number.</span></span>
</span></span>
<span id="S40.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S40.I2.i2.p1" class="ltx_para">
<span id="S40.I2.i2.p1.1" class="ltx_p"><span id="S40.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Table </span><a href="#S38.T7" title="Table 7 ‣ 38 Human Evaluation and Learned Judges ‣ Chapter 11 Evaluation ‣ A Tutorial on Generative Models for Music Audio" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">7</span></a><span id="S40.I2.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> distinguishes the measures for which human-agreement evidence is reported and states the population and conditions to which that evidence applies.</span></span>
</span></span>
<span id="S40.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S40.I2.i3.p1" class="ltx_para">
<span id="S40.I2.i3.p1.1" class="ltx_p"><span id="S40.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">A judge used as a training reward cannot provide independent evidence of improvement. Its scores may be reported alongside an independent human evaluation, with attention to the biases of the judge’s rating set.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>