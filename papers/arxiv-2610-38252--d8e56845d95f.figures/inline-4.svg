<span id="S18.p3.pic1.1.1" class="ltx_p"><span id="S18.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Key takeaways</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 165.83)"><foreignobject style="--ltx-fo-width:36.54em;--ltx-fo-height:1.69em;--ltx-fo-depth:11.25em;font-size:10pt;" height="179.11" overflow="visible" transform="matrix(1 0 0 -1 0 23.45)" width="505.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S18.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.54em;">
<span id="S18.I1" class="ltx_itemize">
<span id="S18.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S18.I1.i1.p1" class="ltx_para">
<span id="S18.I1.i1.p1.1" class="ltx_p"><span id="S18.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The application classes are unordered labels. A system is tabulated once, in the class of its main evaluation, and the boundary rules of Section </span><a href="#S15" title="15 Application Classes ‣ Chapter 5 Comparing Music Generation Systems ‣ A Tutorial on Generative Models for Music Audio" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">15</span></a><span id="S18.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> decide the hard cases.</span></span>
</span></span>
<span id="S18.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S18.I1.i2.p1" class="ltx_para">
<span id="S18.I1.i2.p1.1" class="ltx_p"><span id="S18.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Artifact attributes are taken from the system’s own paper or model card, and the openness cells follow the dated artifact checks documented in Appendix </span><a href="#chapter15.A1" title="Appendix 15.A Screening and Sources ‣ Chapter 15 Search Strings and Counts ‣ A Tutorial on Generative Models for Music Audio" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">15.A</span></a><span id="S18.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">. Cells without a source are marked as unknown. Section </span><a href="#S16" title="16 Reported Attributes and Release Conditions ‣ Chapter 5 Comparing Music Generation Systems ‣ A Tutorial on Generative Models for Music Audio" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">16</span></a><span id="S18.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> explains which attributes the tables omit and why.</span></span>
</span></span>
<span id="S18.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S18.I1.i3.p1" class="ltx_para">
<span id="S18.I1.i3.p1.1" class="ltx_p"><span id="S18.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Table </span><a href="#S17.T3" title="Table 3 ‣ 17 Reading the Comparison Tables ‣ Chapter 5 Comparing Music Generation Systems ‣ A Tutorial on Generative Models for Music Audio" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">3</span></a><span id="S18.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> links a system’s design choices to the sections that explain them.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>