<svg id="S43.p3.pic1" class="ltx_picture" height="389.89" overflow="visible" version="1.1" viewbox="0 0 531.5 389.89" width="531.5"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,389.89) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#737373;" fill="#737373" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.08 L 0 387.81 C 0 388.96 0.93 389.89 2.08 389.89 L 529.42 389.89 C 530.57 389.89 531.5 388.96 531.5 387.81 L 531.5 2.08 C 531.5 0.93 530.57 0 529.42 0 L 2.08 0 C 0.93 0 0 0.93 0 2.08 Z" /></g><g style="--ltx-fill-color:#F7F7F7;" fill="#F7F7F7" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 2.08 L 0.69 369.56 L 530.8 369.56 L 530.8 2.08 C 530.8 1.31 530.18 0.69 529.42 0.69 L 2.08 0.69 C 1.31 0.69 0.69 1.31 0.69 2.08 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 376.61)"><foreignobject style="--ltx-fo-width:34.31em;--ltx-fo-height:0.63em;--ltx-fo-depth:0.18em;font-size:10pt;" height="11.07" overflow="visible" transform="matrix(1 0 0 -1 0 8.65)" width="474.75"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S43.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.31em;">
<span id="S43.p3.pic1.1.1" class="ltx_p"><span id="S43.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Key takeaways</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 336.64)"><foreignobject style="--ltx-fo-width:36.54em;--ltx-fo-height:1.69em;--ltx-fo-depth:23.59em;font-size:10pt;" height="349.93" overflow="visible" transform="matrix(1 0 0 -1 0 23.45)" width="505.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S43.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.54em;">
<span id="S43.I1" class="ltx_itemize">
<span id="S43.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S43.I1.i1.p1" class="ltx_para">
<span id="S43.I1.i1.p1.1" class="ltx_p"><span id="S43.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Training-source disclosure remains incomplete: 43 of the 105 table rows carry only the data code U (undisclosed, in-house, or web-collected data). The codes describe available documentation and are neither findings of legality nor assurances of creator consent and compensation.</span></span>
</span></span>
<span id="S43.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S43.I1.i2.p1" class="ltx_para">
<span id="S43.I1.i2.p1.1" class="ltx_p"><span id="S43.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Licensing, provenance, memorization, and output identification answer different questions. A release should state its sources, the permissions it documents, and the protocols used to test reproduction of training material.</span></span>
</span></span>
<span id="S43.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S43.I1.i3.p1" class="ltx_para">
<span id="S43.I1.i3.p1.1" class="ltx_p"><span id="S43.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Systems with documented sources provide useful reference points. Comparisons do not isolate the effect of data licensing when training data, scale, and evaluation also differ.</span></span>
</span></span>
<span id="S43.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S43.I1.i4.p1" class="ltx_para">
<span id="S43.I1.i4.p1.1" class="ltx_p"><span id="S43.I1.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Input records, attribution methods, and output audits can provide complementary evidence. Their conclusions depend on the workflow and test, and they do not by themselves determine who should be credited or paid.</span></span>
</span></span>
<span id="S43.I1.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S43.I1.i5.p1" class="ltx_para">
<span id="S43.I1.i5.p1.1" class="ltx_p"><span id="S43.I1.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Watermarks and detectors provide fallible evidence whose robustness must be tested under relevant transformations and deployment conditions. They do not replace source documentation, creator authorization, or compensation arrangements.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>