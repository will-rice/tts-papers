<svg id="S40.p2.pic1" class="ltx_picture" height="258.69" overflow="visible" version="1.1" viewbox="0 0 531.5 258.69" width="531.5"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,258.69) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4D4D4D;" fill="#4D4D4D" fill-opacity="1.0"><path style="stroke:none" d="M 0 0.83 L 0 257.86 C 0 258.32 0.37 258.69 0.83 258.69 L 530.67 258.69 C 531.12 258.69 531.5 258.32 531.5 257.86 L 531.5 0.83 C 531.5 0.37 531.12 0 530.67 0 L 0.83 0 C 0.37 0 0 0.37 0 0.83 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.83 0.83 L 0.83 238.09 L 530.67 238.09 L 530.67 0.83 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.07 245.28)"><foreignobject style="--ltx-fo-width:34.29em;--ltx-fo-height:0.63em;--ltx-fo-depth:0.18em;font-size:10pt;" height="11.07" overflow="visible" transform="matrix(1 0 0 -1 0 8.65)" width="474.48"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S40.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.29em;">
<span id="S40.p2.pic1.1.1" class="ltx_p"><span id="S40.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Reporting an evaluation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.07 12.99)"><foreignobject style="--ltx-fo-width:36.52em;--ltx-fo-height:15.58em;--ltx-fo-depth:0.19em;font-size:10pt;" height="218.32" overflow="visible" transform="matrix(1 0 0 -1 0 215.63)" width="505.33"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S40.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.52em;">
<span id="S40.p2.pic1.2.1" class="ltx_p"><span id="S40.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Given the evidence in Table <a href="#S38.T7" title="Table 7 ‣ 38 Human Evaluation and Learned Judges ‣ Chapter 11 Evaluation ‣ A Tutorial on Generative Models for Music Audio" class="ltx_ref"><span class="ltx_text ltx_ref_tag">7</span></a>, a system report should include:</span></span>
<span id="S40.I1" class="ltx_itemize">
<span id="S40.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S40.I1.i1.p1" class="ltx_para">
<span id="S40.I1.i1.p1.1" class="ltx_p"><span id="S40.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">at least one distribution-level metric, with the encoder, the reference set, and the number of clips named;</span></span>
</span></span>
<span id="S40.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S40.I1.i2.p1" class="ltx_para">
<span id="S40.I1.i2.p1.1" class="ltx_p"><span id="S40.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">a prompt-adherence score, read as adherence rather than as quality;</span></span>
</span></span>
<span id="S40.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S40.I1.i3.p1" class="ltx_para">
<span id="S40.I1.i3.p1.1" class="ltx_p"><span id="S40.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">a listening test that states its items, raters, and intervals (Section </span><a href="#S39" title="39 A Minimum Listening-Test Protocol ‣ Chapter 11 Evaluation ‣ A Tutorial on Generative Models for Music Audio" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">39</span></a><span id="S40.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">);</span></span>
</span></span>
<span id="S40.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S40.I1.i4.p1" class="ltx_para">
<span id="S40.I1.i4.p1.1" class="ltx_p"><span id="S40.I1.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">for songs, per-aspect judge scores from a judge the system was not trained against.</span></span>
</span></span>
</span>
<span id="S40.p2.pic1.2.2" class="ltx_p"><span id="S40.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Report when a model was optimized using a learned judge, and provide an independent human comparison on matched items. For distribution-level scores, report the encoder, reference set, and sample count so that readers can assess whether comparisons are meaningful.</span></span>
</span></span></span></foreignobject></g></g></svg>