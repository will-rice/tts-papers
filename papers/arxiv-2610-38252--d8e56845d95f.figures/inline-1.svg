<svg id="S5.p2.pic1" class="ltx_picture" height="295.79" overflow="visible" version="1.1" viewbox="0 0 531.5 295.79" width="531.5"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,295.79) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#737373;" fill="#737373" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.08 L 0 293.72 C 0 294.86 0.93 295.79 2.08 295.79 L 529.42 295.79 C 530.57 295.79 531.5 294.86 531.5 293.72 L 531.5 2.08 C 531.5 0.93 530.57 0 529.42 0 L 2.08 0 C 0.93 0 0 0.93 0 2.08 Z" /></g><g style="--ltx-fill-color:#F7F7F7;" fill="#F7F7F7" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 2.08 L 0.69 275.47 L 530.8 275.47 L 530.8 2.08 C 530.8 1.31 530.18 0.69 529.42 0.69 L 2.08 0.69 C 1.31 0.69 0.69 1.31 0.69 2.08 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 282.52)"><foreignobject style="--ltx-fo-width:34.31em;--ltx-fo-height:0.63em;--ltx-fo-depth:0.18em;font-size:10pt;" height="11.07" overflow="visible" transform="matrix(1 0 0 -1 0 8.65)" width="474.75"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S5.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:34.31em;">
<span id="S5.p2.pic1.1.1" class="ltx_p"><span id="S5.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Key takeaways</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 242.55)"><foreignobject style="--ltx-fo-width:36.54em;--ltx-fo-height:1.69em;--ltx-fo-depth:16.79em;font-size:10pt;" height="255.83" overflow="visible" transform="matrix(1 0 0 -1 0 23.45)" width="505.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S5.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.54em;">
<span id="S5.I1" class="ltx_itemize">
<span id="S5.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I1.i1.p1" class="ltx_para">
<span id="S5.I1.i1.p1.1" class="ltx_p"><span id="S5.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The codec constrains the generator’s cost. Its token rate determines sequence length for a given audio duration, while its bitrate and reconstruction quality affect the detail the system can preserve. Semantic content and graceful degradation are the two other properties that later tokenizers compete on.</span></span>
</span></span>
<span id="S5.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I1.i2.p1" class="ltx_para">
<span id="S5.I1.i2.p1.1" class="ltx_p"><span id="S5.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Continuous latents trade compression against decoder losses in high frequencies, phase, and stereo image, and the newest autoencoders are trained to be compact, accurate in reconstruction, and semantically structured at once.</span></span>
</span></span>
<span id="S5.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I1.i3.p1" class="ltx_para">
<span id="S5.I1.i3.p1.1" class="ltx_p"><span id="S5.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Text reaches a generator through a text encoder or a contrastive audio-text embedding. When the same embedding also serves as the prompt-adherence score, the system and its metric can share a blind spot.</span></span>
</span></span>
<span id="S5.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I1.i4.p1" class="ltx_para">
<span id="S5.I1.i4.p1.1" class="ltx_p"><span id="S5.I1.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Training corpora are mostly undisclosed, captions are scarce and often synthetic, and the datasets that are documented under-represent most of the world’s music.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>