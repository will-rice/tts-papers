<span id="A1.SS1.SSS2.p9.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.79em;">
<span id="A1.SS1.SSS2.p9.pic1.2.1" class="ltx_p"><span id="A1.SS1.SSS2.p9.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">1. Caption Rephrasing (Linguistic Diversity)<span id="A1.SS1.SSS2.p9.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="A1.SS1.SSS2.p9.pic1.2.2" class="ltx_quote">
<span id="A1.SS1.SSS2.p9.pic1.2.2.1" class="ltx_p"><span id="A1.SS1.SSS2.p9.pic1.2.2.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">“A gun is cocked, followed by two bursts of machine gun fire.”</span><span id="A1.SS1.SSS2.p9.pic1.2.2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span>
<br class="ltx_break"><span id="A1.SS1.SSS2.p9.pic1.2.2.1.3" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">“After the sharp, metallic sound of a firearm mechanism, two rapid-fire bursts from a machine gun are heard.”</span></span>
</span>
<span id="A1.SS1.SSS2.p9.pic1.2.3" class="ltx_p"><span id="A1.SS1.SSS2.p9.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">2. Augmentation from Category and Count<span id="A1.SS1.SSS2.p9.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A1.SS1.SSS2.p9.pic1.2.4" class="ltx_quote">
<span id="A1.SS1.SSS2.p9.pic1.2.4.1" class="ltx_p"><span id="A1.SS1.SSS2.p9.pic1.2.4.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">“The audio contains two sounds of a machine gun and one generic impact sound.”</span></span>
</span>
<span id="A1.SS1.SSS2.p9.pic1.2.5" class="ltx_p"><span id="A1.SS1.SSS2.p9.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">3. Augmentation from SED<span id="A1.SS1.SSS2.p9.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="A1.SS1.SSS2.p9.pic1.2.6" class="ltx_quote">
<span id="A1.SS1.SSS2.p9.pic1.2.6.1" class="ltx_p"><span id="A1.SS1.SSS2.p9.pic1.2.6.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">“The sound of a firearm being handled is audible for the first second, followed by a burst of machine gun fire from 1 to 5 seconds and a second burst from 6 to 8 seconds.”</span></span>
</span>
<span id="A1.SS1.SSS2.p9.pic1.2.7" class="ltx_p"><span id="A1.SS1.SSS2.p9.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">4. Augmentation from Time Relation<span id="A1.SS1.SSS2.p9.pic1.2.7.1.1" class="ltx_text"></span></span></span>
<span id="A1.SS1.SSS2.p9.pic1.2.8" class="ltx_quote">
<span id="A1.SS1.SSS2.p9.pic1.2.8.1" class="ltx_p"><span id="A1.SS1.SSS2.p9.pic1.2.8.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">“In this audio, the sound of a generic impact occurs first, followed by two distinct machine gun sounds.”</span></span>
</span>
