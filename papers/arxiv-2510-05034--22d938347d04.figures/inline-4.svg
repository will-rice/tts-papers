<span id="S4.p1.pic1.2.1" class="ltx_p"><span id="S4.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Test-time scaling improves reliability by allocating inference compute to evidence selection, reasoning depth, and path diversity. Recent work has explored various TTS strategies, including Video-CoT prompting, self-consistency with verifier gating, confidence-guided iteration with refine-on-fail, and tool-augmented chains for long or streaming videos.</span></span>
