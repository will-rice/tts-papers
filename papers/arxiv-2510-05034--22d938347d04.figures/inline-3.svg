</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 22.45 133.5)"><foreignobject style="--ltx-fo-width:45.67em;--ltx-fo-height:1.69em;--ltx-fo-depth:8.79em;font-size:10pt;" height="145.14" overflow="visible" transform="matrix(1 0 0 -1 0 23.45)" width="631.94"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.67em;">
<span id="S3.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:20pt;">
<span id="S3.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I1.i1.p1" class="ltx_para">
<span id="S3.I1.i1.p1.1" class="ltx_p"><span id="S3.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">GRPO has emerged as a popular approach in recent work on video reasoning because it uses verifiable outcomes like answer correctness for optimization, avoiding the need for human preference data.</span></span>
</span></span>
<span id="S3.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I1.i2.p1" class="ltx_para">
<span id="S3.I1.i2.p1.1" class="ltx_p"><span id="S3.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">A successful system requires co-designing three key elements: advanced policy algorithms, multi-faceted reward functions, and high-quality curated datasets.</span></span>
</span></span>
<span id="S3.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I1.i3.p1" class="ltx_para">
<span id="S3.I1.i3.p1.1" class="ltx_p"><span id="S3.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">This reinforcement learning approach is highly data-efficient, as a small set of quality data can match or exceed the performance of large-scale supervised tuning.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>