<span id="S2.p2.pic1.1.1" class="ltx_p"><span id="S2.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Takeaways</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 22.45 122.43)"><foreignobject style="--ltx-fo-width:45.67em;--ltx-fo-height:1.69em;--ltx-fo-depth:7.99em;font-size:10pt;" height="134.07" overflow="visible" transform="matrix(1 0 0 -1 0 23.45)" width="631.94"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.67em;">
<span id="S2.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:20pt;">
<span id="S2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S2.I1.i1.p1" class="ltx_para">
<span id="S2.I1.i1.p1.1" class="ltx_p"><span id="S2.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Fixed-format CoT supervision enables imitation of reasoning patterns but provides limited flexibility for self-exploration and error correction compared to RL approaches, necessitating the transition to RL for learning abstract objectives and generalizing to complex, unseen scenarios.</span></span>
</span></span>
<span id="S2.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S2.I1.i2.p1" class="ltx_para">
<span id="S2.I1.i2.p1.1" class="ltx_p"><span id="S2.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">CoT-SFT has evolved from a standalone training paradigm to a critical cold-start phase for RL, providing structured reasoning formats (&lt;think&gt;, &lt;answer&gt;) and stable initialization that prevents instability in subsequent RL-driven policy optimization.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>