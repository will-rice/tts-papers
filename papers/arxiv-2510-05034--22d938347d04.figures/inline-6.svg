</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 22.45 150.1)"><foreignobject style="--ltx-fo-width:45.67em;--ltx-fo-height:1.69em;--ltx-fo-depth:9.99em;font-size:10pt;" height="161.74" overflow="visible" transform="matrix(1 0 0 -1 0 23.45)" width="631.94"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S6.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.67em;">
<span id="S6.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:20pt;">
<span id="S6.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S6.I1.i1.p1" class="ltx_para">
<span id="S6.I1.i1.p1.1" class="ltx_p"><span id="S6.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Ground supervision and evaluation in structured, evidence-linked reasoning and explicit verifier signals; actively diagnose and mitigate sycophancy, judge and length biases, and subtitle leakage.</span></span>
</span></span>
<span id="S6.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S6.I1.i2.p1" class="ltx_para">
<span id="S6.I1.i2.p1.1" class="ltx_p"><span id="S6.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Scale RL on long videos with verifiable, compositional rewards, efficient frame selection and caching, and exploration objectives that go beyond distilled teachers.</span></span>
</span></span>
<span id="S6.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S6.I1.i3.p1" class="ltx_para">
<span id="S6.I1.i3.p1.1" class="ltx_p"><span id="S6.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Build budget-aware anytime agents that couple confidence estimates with verifier checks and tool use; standardize reporting (viewing budget, reasoning length, paths, latency/throughput, subtitle usage) to ensure fair comparison and avoid leakage.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>