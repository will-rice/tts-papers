<span id="S5.p2.pic1.2.1" class="ltx_p"><span id="S5.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Alignment between evaluation metrics and training objectives enables more interpretable optimization: answer faithfulness, temporal correctness, and spatial–temporal grounding under realistic budgets with verifier-ready annotations. The field has moved beyond monolithic QA suites toward targeted evaluations, including multi-event reasoning, long-video and streaming, and precise grounding, that better diagnose where post-training gains come from.</span></span>
