</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 22.45 14.5)"><foreignobject style="--ltx-fo-width:45.67em;--ltx-fo-height:5.49em;--ltx-fo-depth:0.19em;font-size:10pt;" height="78.72" overflow="visible" transform="matrix(1 0 0 -1 0 76.03)" width="631.94"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
