<span id="S1.I1.i1.p1.1" class="ltx_p"><span id="S1.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">A comprehensive review of post-training methodologies for Video-LMMs, covering supervised fine-tuning, reinforcement learning, and test-time scaling as integral components of model optimization.</span></span>
