<span id="S3.p2.pic1.1.1" class="ltx_p"><span id="S3.p2.pic1.1.1.1" class="ltx_text ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#000000;">RQ1 -</span><span id="S3.p2.pic1.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Beyond free-form text inputs, can common general-domain PRMs combined with TTS strategies also enhance the performance of LRMs on tabular reasoning tasks?</span></span>
