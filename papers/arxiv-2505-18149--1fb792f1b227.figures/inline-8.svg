<svg id="S10.p8.pic1" class="ltx_picture" height="256.81" overflow="visible" version="1.1" viewbox="0 0 550 256.81" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,256.81) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#CCFFCC;" fill="#CCFFCC" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.32 L 0 251.49 C 0 254.43 2.38 256.81 5.32 256.81 L 544.68 256.81 C 547.62 256.81 550 254.43 550 251.49 L 550 5.32 C 550 2.38 547.62 0 544.68 0 L 5.32 0 C 2.38 0 0 2.38 0 5.32 Z" /></g><g style="--ltx-fill-color:#F7FFF7;" fill="#F7FFF7" fill-opacity="1.0"><path style="stroke:none" d="M 1.38 5.32 L 1.38 236.56 L 548.62 236.56 L 548.62 5.32 C 548.62 3.15 546.85 1.38 544.68 1.38 L 5.32 1.38 C 3.15 1.38 1.38 3.15 1.38 5.32 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.07 241.88)"><foreignobject style="--ltx-fo-width:31.91em;--ltx-fo-height:0.69em;--ltx-fo-depth:0em;font-size:10pt;" height="9.61" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="441.54"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S10.p8.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.91em;">
<span id="S10.p8.pic1.1.1" class="ltx_p"><span id="S10.p8.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Final Answer</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.07 15.89)"><foreignobject style="--ltx-fo-width:36.7em;--ltx-fo-height:15.09em;--ltx-fo-depth:0.19em;font-size:10pt;" height="211.55" overflow="visible" transform="matrix(1 0 0 -1 0 208.86)" width="507.82"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S10.p8.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.7em;">
<span id="S10.p8.pic1.2.1" class="ltx_p"><span id="S10.p8.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To find the least prime number <math id="S10.p8.pic1.m1" class="ltx_Math" alttext="p" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><annotation encoding="application/x-tex">p</annotation></semantics></math> such that there exists a positive integer <math id="S10.p8.pic1.m2" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> where <math id="S10.p8.pic1.m3" class="ltx_Math" alttext="n^{4}+1" display="inline" intent=":literal"><semantics><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">n^{4}+1</annotation></semantics></math> is divisible by <math id="S10.p8.pic1.m4" class="ltx_Math" alttext="p^{2}" display="inline" intent=":literal"><semantics><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup><annotation encoding="application/x-tex">p^{2}</annotation></semantics></math>, we start by considering primes <math id="S10.p8.pic1.m5" class="ltx_Math" alttext="p" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><annotation encoding="application/x-tex">p</annotation></semantics></math> where <math id="S10.p8.pic1.m6" class="ltx_Math" alttext="-1" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">-1</annotation></semantics></math> is a fourth power residue modulo <math id="S10.p8.pic1.m7" class="ltx_Math" alttext="p" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><annotation encoding="application/x-tex">p</annotation></semantics></math>. These primes are congruent to <math id="S10.p8.pic1.m8" class="ltx_Math" alttext="1\mod 8" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">mod</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">8</mn></mrow><annotation encoding="application/x-tex">1\mod 8</annotation></semantics></math>. The smallest such prime is 17.</span></span>
<span id="S10.p8.pic1.2.2" class="ltx_p"><span id="S10.p8.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Next, we need to verify if there exists an integer <math id="S10.p8.pic1.m9" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math> such that <math id="S10.p8.pic1.m10" class="ltx_Math" alttext="n^{4}+1\equiv 0\mod 17^{2}" display="inline" intent=":literal"><semantics><mrow><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≡</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">mod</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">17</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup></mrow></mrow><annotation encoding="application/x-tex">n^{4}+1\equiv 0\mod 17^{2}</annotation></semantics></math>. We know that <math id="S10.p8.pic1.m11" class="ltx_Math" alttext="8^{4}\equiv-1\mod 17" display="inline" intent=":literal"><semantics><mrow><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">8</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≡</mo><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">mod</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">17</mn></mrow></mrow><annotation encoding="application/x-tex">8^{4}\equiv-1\mod 17</annotation></semantics></math>. Using Hensel’s lemma, we lift this solution modulo <math id="S10.p8.pic1.m12" class="ltx_Math" alttext="17^{2}" display="inline" intent=":literal"><semantics><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">17</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup><annotation encoding="application/x-tex">17^{2}</annotation></semantics></math>.</span></span>
<span id="S10.p8.pic1.2.3" class="ltx_p"><span id="S10.p8.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Let <math id="S10.p8.pic1.m13" class="ltx_Math" alttext="m=8+17k" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">8</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">17</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow></mrow></mrow><annotation encoding="application/x-tex">m=8+17k</annotation></semantics></math>. Expanding <math id="S10.p8.pic1.m14" class="ltx_Math" alttext="(8+17k)^{4}" display="inline" intent=":literal"><semantics><msup><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">8</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">17</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></msup><annotation encoding="application/x-tex">(8+17k)^{4}</annotation></semantics></math> modulo <math id="S10.p8.pic1.m15" class="ltx_Math" alttext="289" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">289</mn><annotation encoding="application/x-tex">289</annotation></semantics></math> (which is <math id="S10.p8.pic1.m16" class="ltx_Math" alttext="17^{2}" display="inline" intent=":literal"><semantics><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">17</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup><annotation encoding="application/x-tex">17^{2}</annotation></semantics></math>) using the binomial theorem, we find the linear term coefficient and solve for <math id="S10.p8.pic1.m17" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math>:</span></span>
<span id="S10.Ex28" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="S10.Ex28.m1" class="ltx_Math" alttext="(8+17k)^{4}+1\equiv 51+136k\mod 289" display="block" intent=":literal"><semantics><mrow><mrow><msup><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">8</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">17</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≡</mo><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">51</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">136</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">mod</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">289</mn></mrow></mrow><annotation encoding="application/x-tex">(8+17k)^{4}+1\equiv 51+136k\mod 289</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="S10.p8.pic1.2.4" class="ltx_p"><span id="S10.p8.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">We need <math id="S10.p8.pic1.m18" class="ltx_Math" alttext="51+136k\equiv 0\mod 289" display="inline" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">51</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">136</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≡</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">mod</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">289</mn></mrow></mrow><annotation encoding="application/x-tex">51+136k\equiv 0\mod 289</annotation></semantics></math>. Solving <math id="S10.p8.pic1.m19" class="ltx_Math" alttext="136k\equiv-51\mod 289" display="inline" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">136</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≡</mo><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">51</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">mod</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">289</mn></mrow></mrow><annotation encoding="application/x-tex">136k\equiv-51\mod 289</annotation></semantics></math>, we find <math id="S10.p8.pic1.m20" class="ltx_Math" alttext="k\equiv 6\mod 17" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≡</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">6</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">mod</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">17</mn></mrow></mrow><annotation encoding="application/x-tex">k\equiv 6\mod 17</annotation></semantics></math>. Thus, the smallest positive <math id="S10.p8.pic1.m21" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math> is 6, leading to <math id="S10.p8.pic1.m22" class="ltx_Math" alttext="m=8+17\cdot 6=110" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">8</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">17</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">6</mn></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">110</mn></mrow><annotation encoding="application/x-tex">m=8+17\cdot 6=110</annotation></semantics></math>.</span></span>
<span id="S10.p8.pic1.2.5" class="ltx_p"><span id="S10.p8.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Verification shows <math id="S10.p8.pic1.m23" class="ltx_Math" alttext="110^{4}+1" display="inline" intent=":literal"><semantics><mrow><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">110</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">110^{4}+1</annotation></semantics></math> is indeed divisible by <math id="S10.p8.pic1.m24" class="ltx_Math" alttext="289" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">289</mn><annotation encoding="application/x-tex">289</annotation></semantics></math>. Therefore, the least positive integer <math id="S10.p8.pic1.m25" class="ltx_Math" alttext="m" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><annotation encoding="application/x-tex">m</annotation></semantics></math> such that <math id="S10.p8.pic1.m26" class="ltx_Math" alttext="m^{4}+1" display="inline" intent=":literal"><semantics><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">m^{4}+1</annotation></semantics></math> is divisible by <math id="S10.p8.pic1.m27" class="ltx_Math" alttext="17^{2}" display="inline" intent=":literal"><semantics><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">17</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup><annotation encoding="application/x-tex">17^{2}</annotation></semantics></math> is <math id="S10.p8.pic1.m28" class="ltx_Math" alttext="\boxed{110}" display="inline" intent=":literal"><semantics><menclose notation="box"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">110</mn></menclose><annotation encoding="application/x-tex">\boxed{110}</annotation></semantics></math>.</span></span>
</span></span></span></foreignobject></g></g></svg>