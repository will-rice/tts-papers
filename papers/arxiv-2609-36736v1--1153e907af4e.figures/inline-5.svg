<svg id="S8.SS5.p3.pic1" class="ltx_picture" height="793.08" overflow="visible" version="1.1" viewbox="0 0 708.27 793.08" width="708.27"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,793.08) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#F2F1EF;" fill="#F2F1EF" fill-opacity="1.0"><path style="stroke:none" d="M 0 6.92 L 0 786.16 C 0 789.98 3.1 793.08 6.92 793.08 L 701.35 793.08 C 705.17 793.08 708.27 789.98 708.27 786.16 L 708.27 6.92 C 708.27 3.1 705.17 0 701.35 0 L 6.92 0 C 3.1 0 0 3.1 0 6.92 Z" /></g><g style="--ltx-fill-color:#F2F1EF;" fill="#F2F1EF" fill-opacity="1.0"><path style="stroke:none" d="M 0 6.92 L 0 759.07 L 708.27 759.07 L 708.27 6.92 C 708.27 3.1 705.17 0 701.35 0 L 6.92 0 C 3.1 0 0 3.1 0 6.92 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 24.69 771.23)"><foreignobject style="--ltx-fo-width:41.41em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="573"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S8.SS5.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:41.41em;"><span id="S8.SS5.p3.pic1.1.1" class="ltx_ERROR undefined">\sharpfont</span>
<span id="S8.SS5.p3.pic1.1.2" class="ltx_p"><span id="S8.SS5.p3.pic1.1.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Box 2 — Recommended reporting and responsible-design checklist for speech BCIs</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 24.69 27.38)"><foreignobject style="--ltx-fo-width:47.62em;--ltx-fo-height:51.09em;--ltx-fo-depth:0.19em;font-size:10pt;" height="709.69" overflow="visible" transform="matrix(1 0 0 -1 0 707)" width="658.93"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S8.SS5.p3.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:47.62em;">
<span id="S8.SS5.p3.pic1.p16" class="ltx_para">
<span id="S8.SS5.p3.pic1.p16.1" class="ltx_p"><span id="S8.SS5.p3.pic1.p16.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Transparent and responsible speech BCI research requires both comprehensive reporting of experimental and computational methods and explicit safeguards in system design.</span></span>
</span>
<span id="S8.SS5.p3.pic1.p1" class="ltx_para ltx_noindent"><span id="S8.SS5.p3.pic1.p1.1" class="ltx_ERROR undefined">\sharpfont</span>
<span id="S8.SS5.p3.pic1.p1.2" class="ltx_p"><span id="S8.SS5.p3.pic1.p1.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">A — Reporting and reproducibility</span></span>
</span>
<span id="S8.SS5.p3.pic1.p2" class="ltx_para ltx_noindent">
<span id="S8.SS5.p3.pic1.p2.1" class="ltx_p"><span id="S8.SS5.p3.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Participants and clinical context.</span><span id="S8.SS5.p3.pic1.p2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Diagnosis, severity, inclusion criteria, medication status, and relevant cognitive assessments.</span></span>
</span>
<span id="S8.SS5.p3.pic1.p3" class="ltx_para ltx_noindent">
<span id="S8.SS5.p3.pic1.p3.1" class="ltx_p"><span id="S8.SS5.p3.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Recording details.</span><span id="S8.SS5.p3.pic1.p3.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Modality, electrode type and coverage, sampling rate, referencing scheme, and signal quality metrics.</span></span>
</span>
<span id="S8.SS5.p3.pic1.p4" class="ltx_para ltx_noindent">
<span id="S8.SS5.p3.pic1.p4.1" class="ltx_p"><span id="S8.SS5.p3.pic1.p4.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task design and labels.</span><span id="S8.SS5.p3.pic1.p4.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Prompted versus spontaneous speech, overt/mouthed/imagined conditions, alignment procedures, and label uncertainty.</span></span>
</span>
<span id="S8.SS5.p3.pic1.p5" class="ltx_para ltx_noindent">
<span id="S8.SS5.p3.pic1.p5.1" class="ltx_p"><span id="S8.SS5.p3.pic1.p5.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Model and training.</span><span id="S8.SS5.p3.pic1.p5.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Architecture, preprocessing, data splits, hyperparameter selection, and leakage prevention.</span></span>
</span>
<span id="S8.SS5.p3.pic1.p6" class="ltx_para ltx_noindent">
<span id="S8.SS5.p3.pic1.p6.1" class="ltx_p"><span id="S8.SS5.p3.pic1.p6.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Use of priors.</span><span id="S8.SS5.p3.pic1.p6.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Language model type, training data, participant adaptation, and ablations quantifying reliance on priors.</span></span>
</span>
<span id="S8.SS5.p3.pic1.p7" class="ltx_para ltx_noindent">
<span id="S8.SS5.p3.pic1.p7.1" class="ltx_p"><span id="S8.SS5.p3.pic1.p7.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Evaluation.</span><span id="S8.SS5.p3.pic1.p7.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Offline and online metrics, latency, calibration, robustness tests, and user burden measures.</span></span>
</span>
<span id="S8.SS5.p3.pic1.p8" class="ltx_para ltx_noindent">
<span id="S8.SS5.p3.pic1.p8.1" class="ltx_p"><span id="S8.SS5.p3.pic1.p8.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Availability.</span><span id="S8.SS5.p3.pic1.p8.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Code, data access conditions, and documentation of limitations.</span></span>
</span>
<span id="S8.SS5.p3.pic1.p9" class="ltx_para ltx_noindent"><span id="S8.SS5.p3.pic1.p9.1" class="ltx_ERROR undefined">\sharpfont</span>
<span id="S8.SS5.p3.pic1.p9.2" class="ltx_p"><span id="S8.SS5.p3.pic1.p9.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">B — Ethical and responsible design</span></span>
</span>
<span id="S8.SS5.p3.pic1.p10" class="ltx_para ltx_noindent">
<span id="S8.SS5.p3.pic1.p10.1" class="ltx_p"><span id="S8.SS5.p3.pic1.p10.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">User-controlled activation.</span><span id="S8.SS5.p3.pic1.p10.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Explicit, reliable mechanisms that ensure decoding occurs only when the user intends to communicate.</span></span>
</span>
<span id="S8.SS5.p3.pic1.p11" class="ltx_para ltx_noindent">
<span id="S8.SS5.p3.pic1.p11.1" class="ltx_p"><span id="S8.SS5.p3.pic1.p11.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Privacy-by-design.</span><span id="S8.SS5.p3.pic1.p11.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Minimization of continuous recording, secure storage, encryption, and access control for neural data, with local on-device decoding wherever feasible so that raw brain activity does not need to be transmitted to centralized servers.</span></span>
</span>
<span id="S8.SS5.p3.pic1.p12" class="ltx_para ltx_noindent">
<span id="S8.SS5.p3.pic1.p12.1" class="ltx_p"><span id="S8.SS5.p3.pic1.p12.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Transparency of priors.</span><span id="S8.SS5.p3.pic1.p12.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Clear documentation of language-model use, provenance of output, and ablations quantifying reliance on priors.</span></span>
</span>
<span id="S8.SS5.p3.pic1.p13" class="ltx_para ltx_noindent">
<span id="S8.SS5.p3.pic1.p13.1" class="ltx_p"><span id="S8.SS5.p3.pic1.p13.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Calibrated uncertainty.</span><span id="S8.SS5.p3.pic1.p13.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Confidence signalling, abstention mechanisms, and conservative defaults for high-impact outputs.</span></span>
</span>
<span id="S8.SS5.p3.pic1.p14" class="ltx_para ltx_noindent">
<span id="S8.SS5.p3.pic1.p14.1" class="ltx_p"><span id="S8.SS5.p3.pic1.p14.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Bias auditing.</span><span id="S8.SS5.p3.pic1.p14.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Evaluation across languages, clinical conditions, and demographic factors, with explicit reporting of limitations.</span></span>
</span>
<span id="S8.SS5.p3.pic1.p15" class="ltx_para ltx_noindent">
<span id="S8.SS5.p3.pic1.p15.1" class="ltx_p"><span id="S8.SS5.p3.pic1.p15.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Lifecycle accountability.</span><span id="S8.SS5.p3.pic1.p15.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Governance for software updates, model adaptation, and post-deployment monitoring.</span></span>
</span></span></span></span></foreignobject></g></g></svg>