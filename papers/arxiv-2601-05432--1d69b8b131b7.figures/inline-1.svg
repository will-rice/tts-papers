<span id="A2.SS4.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.91em;">
<span id="A2.SS4.p2.pic1.1.1" class="ltx_p"><span id="A2.SS4.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt Template for Thinking with Map</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 25.01 19.82)"><foreignobject style="--ltx-fo-width:43.59em;--ltx-fo-height:12.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="178.35" overflow="visible" transform="matrix(1 0 0 -1 0 175.66)" width="603.16"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS4.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.59em;">
<span id="A2.SS4.p2.pic1.2.1" class="ltx_p"><span id="A2.SS4.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;image&gt;You are given an image, and your task is to use your exceptional skills to determine the precise coordinates of the location depicted.</span></span>
<span id="A2.SS4.p2.pic1.2.2" class="ltx_p"><span id="A2.SS4.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Carefully examine the image, taking note of any distinctive features, POIs, landmarks, vegetation, or other elements that could serve as clues.</span></span>
<span id="A2.SS4.p2.pic1.2.3" class="ltx_p"><span id="A2.SS4.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">When extra information is needed to search for a location or confirm precise coordinates, you can use the given tools to get the information from search engine and maps.</span></span>
<span id="A2.SS4.p2.pic1.2.4" class="ltx_p"><span id="A2.SS4.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Once you have gathered sufficient evidence, provide your best inference for the coordinates in the following JSON format:</span></span>
<span id="A2.SS4.p2.pic1.2.5" class="ltx_p"><span id="A2.SS4.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">{&quot;lat&quot;: latitude, &quot;lon&quot;: longitude, &quot;city&quot;: city, &quot;country&quot;: country}.</span></span>
<span id="A2.SS4.p2.pic1.2.6" class="ltx_p"><span id="A2.SS4.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use signed values for latitude and longitude to indicate N/S and E/W.
If you cannot narrow it down, then provide your best guess.</span></span>
</span></span></span></foreignobject></g></g></svg>