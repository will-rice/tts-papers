<span id="A2.SS4.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.91em;">
<span id="A2.SS4.p4.pic1.1.1" class="ltx_p"><span id="A2.SS4.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt Template for Verifier</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 25.01 20.59)"><foreignobject style="--ltx-fo-width:43.59em;--ltx-fo-height:7.89em;--ltx-fo-depth:0.25em;font-size:10pt;" height="112.7" overflow="visible" transform="matrix(1 0 0 -1 0 109.24)" width="603.16"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS4.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.59em;">
<span id="A2.SS4.p4.pic1.2.1" class="ltx_p"><span id="A2.SS4.p4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a strict geo-localization solver.</span></span>
<span id="A2.SS4.p4.pic1.2.2" class="ltx_p"><span id="A2.SS4.p4.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will be given an image, the original task, and multiple candidate answers from other agents.
Synthesize the best final location.</span></span>
<span id="A2.SS4.p4.pic1.2.3" class="ltx_p"><span id="A2.SS4.p4.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">If candidates disagree, pick the most evidence-consistent and geographically plausible one.</span></span>
<span id="A2.SS4.p4.pic1.2.4" class="ltx_p"><span id="A2.SS4.p4.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">After thinking, provide your final answer in the JSON format:</span></span>
<span id="A2.SS4.p4.pic1.2.5" class="ltx_p"><span id="A2.SS4.p4.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">{&quot;lat&quot;: latitude, &quot;lon&quot;: longitude, &quot;city&quot;: city, &quot;country&quot;: country}.</span></span>
<span id="A2.SS4.p4.pic1.2.6" class="ltx_p"><span id="A2.SS4.p4.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use signed values for latitude and longitude to indicate N/S and E/W.</span></span>
</span></span></span></foreignobject></g></g></svg>