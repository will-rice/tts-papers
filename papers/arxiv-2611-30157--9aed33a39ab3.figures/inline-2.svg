span></span></foreignobject><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.62 0.62 L 0.62 496.57 L 650.38 496.57 L 650.38 0.62 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.43 79.55)"><foreignobject style="--ltx-fo-width:44.76em;--ltx-fo-height:29.48em;--ltx-fo-depth:5.05em;font-size:10pt;" height="477.84" overflow="visible" transform="matrix(1 0 0 -1 0 407.97)" width="619.35"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A2.SS2.SSS1.p1.pic1.10" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:44.76em;">
<span id="A2.SS2.SSS1.p1.pic1.p1" class="ltx_para ltx_align_left ltx_noindent">
<span id="A2.SS2.SSS1.p1.pic1.p1.1" class="ltx_p"><span id="A2.SS2.SSS1.p1.pic1.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">System message</span></span>
</span>
<span id="A2.SS2.SSS1.p1.pic1.p3" class="ltx_para">
<span id="A2.SS2.SSS1.p1.pic1.p3.1" class="ltx_p ltx_align_left"><span id="A2.SS2.SSS1.p1.pic1.p3.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You observe only the visible facts of one original human input clip. You receive silent frames, in original order, sampled at six frames per second. Write clear, concise English. No audio, transcript, speaker attribution, system identity, subtitles, or scores are provided.</span></span>
</span>
<span id="A2.SS2.SSS1.p1.pic1.p2" class="ltx_para ltx_align_left ltx_noindent">
<span id="A2.SS2.SSS1.p1.pic1.p2.1" class="ltx_p"><span id="A2.SS2.SSS1.p1.pic1.p2.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">User message</span></span>
</span>
<span id="A2.SS2.SSS1.p1.pic1.p4" class="ltx_para">
<span id="A2.SS2.SSS1.p1.pic1.p4.1" class="ltx_p ltx_align_left"><span id="A2.SS2.SSS1.p1.pic1.p4.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Across this whole clip, describe what the camera shows and the most distinctive visible gestures or expressions.</span></span>
<span id="A2.SS2.SSS1.p1.pic1.p4.2" class="ltx_p ltx_align_left"><span id="A2.SS2.SSS1.p1.pic1.p4.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Give a one-sentence scene overview: the visible person(s), framing and one or two useful setting details. For a cut or another visible person, distinguish the people by appearance or position. Do not name identities or infer relationships.</span></span>
<span id="A2.SS2.SSS1.p1.pic1.p4.3" class="ltx_p ltx_align_left"><span id="A2.SS2.SSS1.p1.pic1.p4.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Choose two to five distinct, informative time ranges for actions or expressions; a single range is fine for a nearly static shot. Observe hand shapes/gestures, orientation of the head, a clear gaze shift or facial expression as applicable. Do not invent motion when hands or eyes are obscured. When little changes, use one or two intervals describing the visible posture or a small visible change. Avoid stock descriptions of lip movement when clearer motion is visible. Use screen directions only, and only when unambiguous. Do not infer emotions, intentions, who is speaking, what was said, or what a person outside the frame did. Describe the actual positions and changes rather than describing their significance.</span></span>
<span id="A2.SS2.SSS1.p1.pic1.p4.4" class="ltx_p ltx_align_left"><span id="A2.SS2.SSS1.p1.pic1.p4.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">For each range, give the FIRST AND LAST NUMBERED FRAMES that support that specific observation. Subtle onset times are only approximations on the supplied image grid. Do not assign a whole-clip time span to a fleeting action. Sort by start frame. Use no text outside the requested JSON:</span></span>
<span id="A2.SS2.SSS1.p1.pic1.p4.5" class="ltx_p ltx_align_left"><span id="A2.SS2.SSS1.p1.pic1.p4.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{&quot;scene_overview&quot;:&quot;One English sentence.&quot;, &quot;events&quot;:[{&quot;first_frame&quot;:1,&quot;last_frame&quot;:2,&quot;description&quot;:&quot;A short English sentence describing what is actually visible.&quot;}]}</span></span>
</span></span></span></span></foreignobject></g></g></g></svg>