<svg id="S10.SS5.p4.pic1" class="ltx_picture" height="732.09" overflow="visible" version="1.1" viewbox="0 0 653.15 732.09" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,732.09) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#5959A6;" fill="#5959A6" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.98 L 0 727.11 C 0 729.86 2.23 732.09 4.98 732.09 L 648.17 732.09 C 650.92 732.09 653.15 729.86 653.15 727.11 L 653.15 4.98 C 653.15 2.23 650.92 0 648.17 0 L 4.98 0 C 2.23 0 0 2.23 0 4.98 Z" /></g><g style="--ltx-fill-color:#FAFAFF;" fill="#FAFAFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.83 4.98 L 0.83 727.11 C 0.83 729.41 2.69 731.26 4.98 731.26 L 648.17 731.26 C 650.46 731.26 652.32 729.41 652.32 727.11 L 652.32 4.98 C 652.32 2.69 650.46 0.83 648.17 0.83 L 4.98 0.83 C 2.69 0.83 0.83 2.69 0.83 4.98 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 17.43 231.22)"><foreignobject style="--ltx-fo-width:44.68em;--ltx-fo-height:35.34em;--ltx-fo-depth:15.85em;font-size:10pt;" height="708.3" overflow="visible" transform="matrix(1 0 0 -1 0 488.98)" width="618.25"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S10.SS5.p4.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:44.68em;">
<span id="S10.SS5.p4.pic1.p3" class="ltx_para">
<span id="S10.SS5.p4.pic1.p3.1" class="ltx_p"><span id="S10.SS5.p4.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Speech Transcription Prompt<span id="S10.SS5.p4.pic1.p3.1.1.1" class="ltx_text"></span></span></span>
<span id="S10.SS5.p4.pic1.p3.2" class="ltx_p"><span id="S10.SS5.p4.pic1.p3.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a <span id="S10.SS5.p4.pic1.p3.2.1.1" class="ltx_text ltx_font_bold">speech transcription annotator</span>. Your task is Automatic Speech Recognition! Your sole purpose is to produce event-level <span id="S10.SS5.p4.pic1.p3.2.1.2" class="ltx_text ltx_font_bold">verbatim transcriptions of audible speech</span>. Ignore non-speech sounds and music entirely.
You must follow the OUTPUT FORMAT!</span></span>
<span id="S10.SS5.p4.pic1.p3.3" class="ltx_p"><span id="S10.SS5.p4.pic1.p3.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">LAWS<span id="S10.SS5.p4.pic1.p3.3.1.1" class="ltx_text"></span></span></span>
<span id="S10.I3" class="ltx_enumerate">
<span id="S10.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="S10.I3.i1.p1" class="ltx_para ltx_noindent">
<span id="S10.I3.i1.p1.1" class="ltx_p"><span id="S10.I3.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">LAW OF LANGUAGE FIDELITY</span></span>
<span id="S10.I3.i1.I1" class="ltx_itemize">
<span id="S10.I3.i1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S10.I3.i1.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="S10.I3.i1.I1.i1.p1.1" class="ltx_p"><span id="S10.I3.i1.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Preserve the original language.</span></span>
</span></span>
<span id="S10.I3.i1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S10.I3.i1.I1.i2.p1" class="ltx_para">
<span id="S10.I3.i1.I1.i2.p1.1" class="ltx_p"><span id="S10.I3.i1.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">No translation.</span></span>
</span></span>
</span>
</span></span>
<span id="S10.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="S10.I3.i2.p1" class="ltx_para ltx_noindent">
<span id="S10.I3.i2.p1.1" class="ltx_p"><span id="S10.I3.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">LAW OF SPEECH DYNAMICS</span></span>
<span id="S10.I3.i2.I1" class="ltx_itemize">
<span id="S10.I3.i2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S10.I3.i2.I1.i1.p1" class="ltx_para">
<span id="S10.I3.i2.I1.i1.p1.1" class="ltx_p"><span id="S10.I3.i2.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">When new speaker/language/intonation begins, create a new event. But you still need to follow the output format.</span></span>
</span></span>
</span>
</span></span>
<span id="S10.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="S10.I3.i3.p1" class="ltx_para ltx_noindent">
<span id="S10.I3.i3.p1.1" class="ltx_p"><span id="S10.I3.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">LAW OF SILENCE</span></span>
<span id="S10.I3.i3.I1" class="ltx_itemize">
<span id="S10.I3.i3.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S10.I3.i3.I1.i1.p1" class="ltx_para">
<span id="S10.I3.i3.I1.i1.p1.1" class="ltx_p"><span id="S10.I3.i3.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">When no speech is present, output </span><span id="S10.I3.i3.I1.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">null</span><span id="S10.I3.i3.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> in ‘speech_description‘ part.</span></span>
</span></span>
</span>
</span></span>
</span>
</span>
<span id="S10.SS5.p4.pic1.p1" class="ltx_para ltx_noindent"><span class="ltx_rule" style="width:446.8pt;height:0.4pt;--ltx-bg-color:black;display:inline-block;"> </span>
</span>
<span id="S10.SS5.p4.pic1.p4" class="ltx_para">
<span id="S10.SS5.p4.pic1.p4.1" class="ltx_p"><span id="S10.SS5.p4.pic1.p4.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">OUTPUT FORMAT<span id="S10.SS5.p4.pic1.p4.1.1.1" class="ltx_text"></span></span></span>
</span>
<span id="S10.SS5.p4.pic1.p2" class="ltx_para ltx_noindent">
<span id="S10.SS5.p4.pic1.p2.1" class="ltx_p"><span id="S10.SS5.p4.pic1.p2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{
<br class="ltx_break"> &quot;speech_transcription_report&quot;: {
<br class="ltx_break">   &quot;speech_description&quot;: &quot;[Exact verbatim speech. null if none.
<br class="ltx_break">   Use [inaudible] for unclear parts]&quot;
<br class="ltx_break"> },
<br class="ltx_break"> &quot;final_verification_audit&quot;: {
<br class="ltx_break">   &quot;hallucination_check_passed&quot;: true,
<br class="ltx_break">   &quot;speech_dynamics_verified&quot;: true,
<br class="ltx_break">   &quot;comment&quot;: &quot;All speech changes verifiably detected.
<br class="ltx_break">   No non-speech or music included.&quot;
<br class="ltx_break"> }
<br class="ltx_break">}</span></span>
</span></span></span></span></foreignobject></g></g></svg>