<svg id="S10.SS5.p5.pic1" class="ltx_picture" height="1560.85" overflow="visible" version="1.1" viewbox="0 0 653.15 1560.85" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1560.85) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#5959A6;" fill="#5959A6" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.98 L 0 1555.87 C 0 1558.62 2.23 1560.85 4.98 1560.85 L 648.17 1560.85 C 650.92 1560.85 653.15 1558.62 653.15 1555.87 L 653.15 4.98 C 653.15 2.23 650.92 0 648.17 0 L 4.98 0 C 2.23 0 0 2.23 0 4.98 Z" /></g><g style="--ltx-fill-color:#FAFAFF;" fill="#FAFAFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.83 4.98 L 0.83 1555.87 C 0.83 1558.16 2.69 1560.02 4.98 1560.02 L 648.17 1560.02 C 650.46 1560.02 652.32 1558.16 652.32 1555.87 L 652.32 4.98 C 652.32 2.69 650.46 0.83 648.17 0.83 L 4.98 0.83 C 2.69 0.83 0.83 2.69 0.83 4.98 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 17.43 1371.11)"><foreignobject style="--ltx-fo-width:44.68em;--ltx-fo-height:12.85em;--ltx-fo-depth:98.23em;font-size:10pt;" height="1537.07" overflow="visible" transform="matrix(1 0 0 -1 0 177.84)" width="618.25"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S10.SS5.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.68em;">
<span id="S10.SS5.p5.pic1.1.1" class="ltx_p"><span id="S10.SS5.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Merge Caption Prompt<span id="S10.SS5.p5.pic1.1.1.1.1" class="ltx_text"></span></span></span>
<span id="S10.SS5.p5.pic1.1.2" class="ltx_p"><span id="S10.SS5.p5.pic1.1.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Act as a video description consolidator.<span id="S10.SS5.p5.pic1.1.2.1.1" class="ltx_text ltx_font_medium"> Your task is to merge the provided <span id="S10.SS5.p5.pic1.1.2.1.1.1" class="ltx_text ltx_font_typewriter">video_description</span>, <span id="S10.SS5.p5.pic1.1.2.1.1.2" class="ltx_text ltx_font_typewriter">audio_description</span>, and <span id="S10.SS5.p5.pic1.1.2.1.1.3" class="ltx_text ltx_font_typewriter">speech_description</span> fields into a single, fluent, and natural-sounding paragraph that vividly conveys the full multimedia experience to someone who cannot see or hear the original. Follow these rules precisely:</span></span></span>
<span id="S10.I4" class="ltx_enumerate">
<span id="S10.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="S10.I4.i1.p1" class="ltx_para ltx_noindent">
<span id="S10.I4.i1.p1.1" class="ltx_p"><span id="S10.I4.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Start with the visual narrative and anchor speaker context</span></span>
<span id="S10.I4.i1.I1" class="ltx_itemize">
<span id="S10.I4.i1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S10.I4.i1.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="S10.I4.i1.I1.i1.p1.1" class="ltx_p"><span id="S10.I4.i1.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If </span><span id="S10.I4.i1.I1.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">video_description</span><span id="S10.I4.i1.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> is provided, begin with it, weaving in visual cues that ground speaker identities or positions (e.g., &quot;A woman in a red coat stands by the door; nearby, a man leans against the counter&quot;).</span></span>
</span></span>
<span id="S10.I4.i1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S10.I4.i1.I1.i2.p1" class="ltx_para">
<span id="S10.I4.i1.I1.i2.p1.1" class="ltx_p"><span id="S10.I4.i1.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Describe all visual content in specific, chronological, natural language—actions, objects, settings, lighting, movements, and scene changes—without summarizing. Use these details to contextualize speakers (e.g., &quot;The child pointing at the painting&quot; or &quot;The older man gesturing emphatically&quot;).</span></span>
</span></span>
</span>
</span></span>
<span id="S10.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="S10.I4.i2.p1" class="ltx_para ltx_noindent">
<span id="S10.I4.i2.p1.1" class="ltx_p"><span id="S10.I4.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Integrate speech as visually anchored dialogue with speaker dynamics</span></span>
<span id="S10.I4.i2.I1" class="ltx_itemize">
<span id="S10.I4.i2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S10.I4.i2.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="S10.I4.i2.I1.i1.p1.1" class="ltx_p"><span id="S10.I4.i2.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If </span><span id="S10.I4.i2.I1.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">speech_description</span><span id="S10.I4.i2.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> is provided, embed spoken words as </span><span id="S10.I4.i2.I1.i1.p1.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">quoted dialogue</span><span id="S10.I4.i2.I1.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> tied to visual elements, using speech verbs that reflect tone (e.g., &quot;snaps,&quot; &quot;murmurs,&quot; &quot;laughs&quot;) and speech rate (e.g., &quot;rushes,&quot; &quot;drawls,&quot; &quot;pauses between words&quot;).</span></span>
</span></span>
<span id="S10.I4.i2.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S10.I4.i2.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="S10.I4.i2.I1.i2.p1.1" class="ltx_p"><span id="S10.I4.i2.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use </span><span id="S10.I4.i2.I1.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">audio_description</span><span id="S10.I4.i2.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> to inform:</span></span>
<span id="S10.I4.i2.I1.i2.I1" class="ltx_itemize">
<span id="S10.I4.i2.I1.i2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="S10.I4.i2.I1.i2.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="S10.I4.i2.I1.i2.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="S10.I4.i2.I1.i2.I1.i1.p1.1" class="ltx_p"><span id="S10.I4.i2.I1.i2.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Total number of speakers (e.g., &quot;two distinct voices&quot; or &quot;a group of overlapping speakers&quot;).</span></span>
</span></span>
<span id="S10.I4.i2.I1.i2.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="S10.I4.i2.I1.i2.I1.i2.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="S10.I4.i2.I1.i2.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="S10.I4.i2.I1.i2.I1.i2.p1.1" class="ltx_p"><span id="S10.I4.i2.I1.i2.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Speaker transitions, paired with visual cues when possible (e.g., &quot;As the camera pans to the window, a new voice cuts in sharply: ’Wait, that’s not right’&quot;).</span></span>
</span></span>
<span id="S10.I4.i2.I1.i2.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="S10.I4.i2.I1.i2.I1.i3.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="S10.I4.i2.I1.i2.I1.i3.p1" class="ltx_para">
<span id="S10.I4.i2.I1.i2.I1.i3.p1.1" class="ltx_p"><span id="S10.I4.i2.I1.i2.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Voice characteristics (e.g., &quot;high-pitched,&quot; &quot;gruff&quot;) to align with visible subjects (e.g., &quot;the teenager in the corner&quot; or &quot;the gray-haired woman&quot;).</span></span>
</span></span>
</span>
</span></span>
<span id="S10.I4.i2.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S10.I4.i2.I1.i3.p1" class="ltx_para ltx_noindent">
<span id="S10.I4.i2.I1.i3.p1.1" class="ltx_p"><span id="S10.I4.i2.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Example: </span><span id="S10.I4.i2.I1.i3.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">&quot;The man slams his fist on the table. ’I told you this would happen!’ he shouts. Across the room, the woman in glasses crosses her arms and replies slowly, ’You never listened to my warnings.’&quot;</span></span>
</span></span>
<span id="S10.I4.i2.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S10.I4.i2.I1.i4.p1" class="ltx_para">
<span id="S10.I4.i2.I1.i4.p1.1" class="ltx_p"><span id="S10.I4.i2.I1.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Rely strictly on </span><span id="S10.I4.i2.I1.i4.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">speech_description</span><span id="S10.I4.i2.I1.i4.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> for the actual spoken content; use </span><span id="S10.I4.i2.I1.i4.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">audio_description</span><span id="S10.I4.i2.I1.i4.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> for speaker dynamics and </span><span id="S10.I4.i2.I1.i4.p1.1.6" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">video_description</span><span id="S10.I4.i2.I1.i4.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> to anchor them visually.</span></span>
</span></span>
</span>
</span></span>
<span id="S10.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="S10.I4.i3.p1" class="ltx_para ltx_noindent">
<span id="S10.I4.i3.p1.1" class="ltx_p"><span id="S10.I4.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Describe non-speech audio concisely and distinctly</span></span>
<span id="S10.I4.i3.I1" class="ltx_itemize">
<span id="S10.I4.i3.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S10.I4.i3.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="S10.I4.i3.I1.i1.p1.1" class="ltx_p"><span id="S10.I4.i3.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If </span><span id="S10.I4.i3.I1.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">audio_description</span><span id="S10.I4.i3.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> is provided, include </span><span id="S10.I4.i3.I1.i1.p1.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">only non-speech elements</span><span id="S10.I4.i3.I1.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">, introduced with &quot;The audio includes…&quot; or &quot;In the background…&quot;.</span></span>
</span></span>
<span id="S10.I4.i3.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S10.I4.i3.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="S10.I4.i3.I1.i2.p1.1" class="ltx_p"><span id="S10.I4.i3.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Limit this to four categories:</span></span>
<span id="S10.I4.i3.I1.i2.I1" class="ltx_itemize">
<span id="S10.I4.i3.I1.i2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="S10.I4.i3.I1.i2.I1.i1.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="S10.I4.i3.I1.i2.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="S10.I4.i3.I1.i2.I1.i1.p1.1" class="ltx_p"><span id="S10.I4.i3.I1.i2.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Ambient/environmental sounds (e.g., rain tapping the window, a crowd’s murmur);</span></span>
</span></span>
<span id="S10.I4.i3.I1.i2.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="S10.I4.i3.I1.i2.I1.i2.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="S10.I4.i3.I1.i2.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="S10.I4.i3.I1.i2.I1.i2.p1.1" class="ltx_p"><span id="S10.I4.i3.I1.i2.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Music (e.g., a soft piano melody, upbeat jazz);</span></span>
</span></span>
<span id="S10.I4.i3.I1.i2.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="S10.I4.i3.I1.i2.I1.i3.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="S10.I4.i3.I1.i2.I1.i3.p1" class="ltx_para ltx_noindent">
<span id="S10.I4.i3.I1.i2.I1.i3.p1.1" class="ltx_p"><span id="S10.I4.i3.I1.i2.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Audio themes/sources (e.g., a fire alarm blaring, waves crashing);</span></span>
</span></span>
<span id="S10.I4.i3.I1.i2.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span id="S10.I4.i3.I1.i2.I1.i4.1" class="ltx_text ltx_font_bold">–</span></span> 
<span id="S10.I4.i3.I1.i2.I1.i4.p1" class="ltx_para">
<span id="S10.I4.i3.I1.i2.I1.i4.p1.1" class="ltx_p"><span id="S10.I4.i3.I1.i2.I1.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Structural audio changes (e.g., silence giving way to a crescendo).</span></span>
</span></span>
</span>
</span></span>
<span id="S10.I4.i3.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S10.I4.i3.I1.i3.p1" class="ltx_para">
<span id="S10.I4.i3.I1.i3.p1.1" class="ltx_p"><span id="S10.I4.i3.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Omit all references to voices, words, or speech—these belong exclusively to the speech section.</span></span>
</span></span>
</span>
</span></span>
<span id="S10.I4.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="S10.I4.i4.p1" class="ltx_para ltx_noindent">
<span id="S10.I4.i4.p1.1" class="ltx_p"><span id="S10.I4.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Ensure coherence and avoid repetition</span></span>
<span id="S10.I4.i4.I1" class="ltx_itemize">
<span id="S10.I4.i4.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S10.I4.i4.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="S10.I4.i4.I1.i1.p1.1" class="ltx_p"><span id="S10.I4.i4.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Never duplicate details across sections (e.g., don’t restate a speaker’s visual position in the audio section).</span></span>
</span></span>
<span id="S10.I4.i4.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S10.I4.i4.I1.i2.p1" class="ltx_para">
<span id="S10.I4.i4.I1.i2.p1.1" class="ltx_p"><span id="S10.I4.i4.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Link elements logically: e.g., a visual action (a character gasping) paired with speech (&quot;’Oh no!’ she exclaims&quot;) and ambient sound (a glass shattering in the background).</span></span>
</span></span>
</span>
</span></span>
<span id="S10.I4.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="S10.I4.i5.p1" class="ltx_para ltx_noindent">
<span id="S10.I4.i5.p1.1" class="ltx_p"><span id="S10.I4.i5.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Omit empty fields and maintain fluency</span></span>
<span id="S10.I4.i5.I1" class="ltx_itemize">
<span id="S10.I4.i5.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S10.I4.i5.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="S10.I4.i5.I1.i1.p1.1" class="ltx_p"><span id="S10.I4.i5.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Skip missing/empty fields.</span></span>
</span></span>
<span id="S10.I4.i5.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S10.I4.i5.I1.i2.p1" class="ltx_para">
<span id="S10.I4.i5.I1.i2.p1.1" class="ltx_p"><span id="S10.I4.i5.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The final output should read as a seamless, human-like narrative—prioritizing flow, sensory immersion, and clarity over rigid structure.</span></span>
</span></span>
</span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>